floor: 8
floor_name: Prototype Wilds
quests:
  - id: f7_repeat_benches
    title: Make the Benches Scenegraph Instances
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Scenegraph Thickets
    kind: room
    prerequisites: [f6_zoning_golem]
    level_required: 15
    exam_tasks: [author_scenegraph_instances, reuse_component]
    stats: {craft: 4, insight: 3}
    brief: "SYSTEM: The Wilds bill memory by the copy. Three benches, one prototype. Instanceable is now a financial requirement."
    starter: |
      from pathlib import Path
      from pxr import Usd, UsdGeom

      bench = (Path(WORLD_ROOT) / "assets" / "bench.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      UsdGeom.Xform.Define(stage, "/City/InstanceWilds")
      for name in ("BenchA", "BenchB", "BenchC"):
          prim = UsdGeom.Xform.Define(stage, f"/City/InstanceWilds/{name}").GetPrim()
          # TODO: Reference bench.usda and set instanceable True.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - has_reference: {path: /City/InstanceWilds/BenchA, asset: bench.usda}
        - has_reference: {path: /City/InstanceWilds/BenchB, asset: bench.usda}
        - has_reference: {path: /City/InstanceWilds/BenchC, asset: bench.usda}
        - instanceable: {path: /City/InstanceWilds/BenchA, value: true}
        - instanceable: {path: /City/InstanceWilds/BenchB, value: true}
        - instanceable: {path: /City/InstanceWilds/BenchC, value: true}
    cookbook: docs/asset-modularity-instancing/authoring-scenegraph-instancing/exercise-authoring-scenegraph-instancing.md
    xp: 220
    reward: Prototype Tongs
    world_target: /City/InstanceWilds
    recipes: [Instancing, Instanceable]

  - id: f7_prototype_sentinel
    title: "Prototype Sentinel: Keep the Instance Shared"
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Scenegraph Thickets
    kind: neighborhood_boss
    prerequisites: [f7_repeat_benches]
    level_required: 15
    exam_tasks: [keep_instanceable, author_instance_local_metadata]
    stats: {insight: 4, resolve: 3}
    brief: "SYSTEM: The Sentinel asks which forms truly share. Keep BenchB instanceable. Name it in metadata, not by exploding the prototype."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/InstanceWilds/BenchB with type Xform.
      # 2. Set /City/InstanceWilds/BenchB instanceable to True.
      # 3. Author a reference on /City/InstanceWilds/BenchB to asset bench.usda.
      # 4. Set /City/InstanceWilds/BenchB metadata displayName to 'Shared Foundry Bench'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/InstanceWilds/BenchB, value: Xform}
      - instanceable: {path: /City/InstanceWilds/BenchB, value: true}
      - has_reference: {path: /City/InstanceWilds/BenchB, asset: bench.usda}
      - metadata_equals: {path: /City/InstanceWilds/BenchB, key: displayName, value: Shared Foundry Bench}
    cookbook: docs/asset-modularity-instancing/authoring-scenegraph-instancing/scenegraph-instancing-intro.md
    xp: 260
    reward: {opinion_points: 1, achievement: "New achievement! You named an instance without de-instancing it."}
    world_target: /City/InstanceWilds/BenchB
    recipes: [Opinions]
    questions:
      - prompt: What does SetInstanceable(True) create at runtime?
        choices:
          - An implicit prototype shared by matching instanceable prims
          - A PointInstancer
          - A flattened copy of every gprim
        answer: 0
        explanation: Scenegraph instancing shares an implicit prototype.

  - id: f7_deinstance_sticker
    title: Deinstance One Bench, Share the Rest
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Scenegraph Thickets
    kind: room
    prerequisites: [f7_prototype_sentinel]
    level_required: 16
    exam_tasks: [deinstance_selectively, preserve_other_instances]
    stats: {craft: 3, insight: 4}
    brief: "SYSTEM: One bench needs a unique sticker. Deinstance only that prim. The other two still share."
    starter: |
      from pathlib import Path
      from pxr import Usd, UsdGeom

      bench = (Path(WORLD_ROOT) / "assets" / "bench.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      for name in ("BenchA", "BenchB", "BenchC"):
          prim = UsdGeom.Xform.Define(stage, f"/City/InstanceWilds/{name}").GetPrim()
          prim.GetReferences().AddReference(bench)
          prim.SetInstanceable(True)
      # TODO: Set BenchC instanceable False and displayName "Unique Sticker Bench".
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - instanceable: {path: /City/InstanceWilds/BenchA, value: true}
        - instanceable: {path: /City/InstanceWilds/BenchB, value: true}
        - instanceable: {path: /City/InstanceWilds/BenchC, value: false}
        - metadata_equals: {path: /City/InstanceWilds/BenchC, key: displayName, value: "Unique Sticker Bench"}
    cookbook: docs/asset-modularity-instancing/refining-scenegraph-instances/scenegraph-deinstance-refinement.md
    xp: 240
    reward: Sticker Permit
    world_target: /City/InstanceWilds
    recipes: [Instancing]

  - id: f7_point_scatter
    title: Scatter Crates With a PointInstancer
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Point Wastes
    kind: room
    prerequisites: [f7_deinstance_sticker]
    level_required: 16
    exam_tasks: [author_point_instancer, bind_prototypes]
    stats: {craft: 5, insight: 4}
    brief: "SYSTEM: Scenegraph instances are too chatty for a thousand crates. PointInstancer. Prototypes, indices, positions. No extras."
    starter: |
      from pathlib import Path
      from pxr import Gf, Usd, UsdGeom

      cargo = (Path(WORLD_ROOT) / "assets" / "cargo.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      scatter = UsdGeom.PointInstancer.Define(stage, "/World/Scatter")
      proto = stage.DefinePrim("/World/Scatter/Prototypes/Crate", "Xform")
      proto.GetReferences().AddReference(cargo)
      # TODO: Set prototypes relationship to the crate prim.
      # TODO: protoIndices [0, 0, 0, 0] and positions along X at 0, 2, 4, 6.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - point_instancer: {path: /World/Scatter, min_instances: 4, prototype_count: 1}
        - has_reference: {path: /World/Scatter/Prototypes/Crate, asset: cargo.usda}
    cookbook: docs/asset-modularity-instancing/authoring-point-instancing/exercise-authoring-point-instancing.md
    xp: 280
    reward: Scatter Ledger
    world_target: /City/InstanceWilds/Warehouse
    recipes: [Point Instancer]

  - id: f7_point_wastes_boss
    title: "Cargo Foreman: Two Prototypes, One Instancer"
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Point Wastes
    kind: neighborhood_boss
    prerequisites: [f7_point_scatter]
    level_required: 16
    exam_tasks: [multi_prototype_instancer, author_proto_indices]
    stats: {insight: 5, craft: 4}
    brief: "SYSTEM: Crates and benches in one instancer. protoIndices choose. Copies are a moral failing."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World/Scatter with type PointInstancer.
      # 2. Define /World/Scatter as a PointInstancer with at least 4 instances and 2 prototypes.
      # 3. Author a reference on /World/Scatter/Prototypes/Crate to asset cargo.usda.
      # 4. Author a reference on /World/Scatter/Prototypes/Bench to asset bench.usda.
      # 5. Set /World/Scatter metadata documentation to 'Cargo Foreman: Two Prototypes, One Instancer cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /World/Scatter, value: PointInstancer}
      - point_instancer: {path: /World/Scatter, min_instances: 4, prototype_count: 2}
      - has_reference: {path: /World/Scatter/Prototypes/Crate, asset: cargo.usda}
      - has_reference: {path: /World/Scatter/Prototypes/Bench, asset: bench.usda}
      - metadata_equals: {path: /World/Scatter, key: documentation, value: 'Cargo Foreman: Two Prototypes,
            One Instancer cleared.'}
    cookbook: docs/asset-modularity-instancing/authoring-point-instancing/point-instancing-intro.md
    xp: 320
    reward: {opinion_points: 1, achievement: "New achievement! Two prototypes, zero duplicated warehouses."}
    world_target: /City/InstanceWilds/Warehouse
    recipes: [Point Instancer]
    questions:
      - prompt: How does point instancing differ from scenegraph instancing?
        choices:
          - Point instancers store each copy in compact per-instance arrays
          - Point instancers cannot use references
          - Scenegraph instancing forbids prototypes
        answer: 0
        explanation: Point instancing is array-based; scenegraph instancing uses instanceable prims.

  - id: f7_warehouse_district
    title: "Warehouse District: Mix Both Instancing Types"
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Warehouse Recapture
    kind: city_boss
    prerequisites: [f7_point_wastes_boss]
    level_required: 17
    exam_tasks: [mix_scenegraph_and_point_instancing, compose_warehouse]
    stats: {craft: 5, resolve: 4, lore: 3}
    brief: "SYSTEM: City boss. Scenegraph instances for the office benches. Point instancer for the crate field. The warehouse pack can wait; these assets already work."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/InstanceWilds/Warehouse with type Xform.
      # 2. Set /City/InstanceWilds/Warehouse/Office/BenchA instanceable to True.
      # 3. Set /City/InstanceWilds/Warehouse/Office/BenchB instanceable to True.
      # 4. Author a reference on /City/InstanceWilds/Warehouse/Office/BenchA to asset bench.usda.
      # 5. Define /City/InstanceWilds/Warehouse/CrateField as a PointInstancer with at least 6 instances and 1 prototypes.
      # 6. Set /City/InstanceWilds/Warehouse metadata documentation to 'Warehouse District: Mix Both Instancing Types cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/InstanceWilds/Warehouse, value: Xform}
      - instanceable: {path: /City/InstanceWilds/Warehouse/Office/BenchA, value: true}
      - instanceable: {path: /City/InstanceWilds/Warehouse/Office/BenchB, value: true}
      - has_reference: {path: /City/InstanceWilds/Warehouse/Office/BenchA, asset: bench.usda}
      - point_instancer: {path: /City/InstanceWilds/Warehouse/CrateField, min_instances: 6, prototype_count: 1}
      - metadata_equals: {path: /City/InstanceWilds/Warehouse, key: documentation, value: 'Warehouse District: Mix Both Instancing
            Types cleared.'}
    cookbook: docs/asset-modularity-instancing/asset-modularity/exercise-assets-overview.md
    xp: 400
    reward: {opinion_points: 2, achievement: "Warehouse recaptured. The crowd pretends they understood prototypes."}
    world_target: /City/InstanceWilds/Warehouse
    recipes: [Instancing, Assembly]
    questions:
      - prompt: When should you prefer a PointInstancer over scenegraph instances?
        choices:
          - Huge counts of similar copies with per-instance arrays
          - Unique hero assets with deep overrides
          - Always
        answer: 0
        explanation: Point instancers scale when copies share prototypes and vary by arrays.

  - id: f7_mirror_forge
    title: "Mirror Forge: Nested Instancing"
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Mirror Furnace
    kind: floor_boss
    prerequisites: [f7_warehouse_district]
    level_required: 17
    exam_tasks: [nested_instancing, instanceable_aggregate]
    stats: {craft: 5, resolve: 5, insight: 3}
    brief: "SYSTEM: A row of benches that is itself instanceable. Nest on purpose. Mirrors inside mirrors, but this time you hold the spec."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/InstanceWilds/BenchRow with type Xform.
      # 2. Author a reference on /City/InstanceWilds/BenchRow to asset bench_row.usda.
      # 3. Set /City/InstanceWilds/BenchRow kind to 'assembly'.
      # 4. Set /City/InstanceWilds/BenchRow instanceable to True.
      # 5. Set /City/InstanceWilds/BenchRow metadata documentation to 'Mirror Forge: Nested Instancing cleared.'.
      # 6. Set stage up axis to Y.
      # 7. Set stage metersPerUnit to 0.01.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/InstanceWilds/BenchRow, value: Xform}
      - has_reference: {path: /City/InstanceWilds/BenchRow, asset: bench_row.usda}
      - kind_equals: {path: /City/InstanceWilds/BenchRow, value: assembly}
      - instanceable: {path: /City/InstanceWilds/BenchRow, value: true}
      - metadata_equals: {path: /City/InstanceWilds/BenchRow, key: documentation, value: 'Mirror Forge: Nested Instancing cleared.'}
      - {up_axis: Y}
      - {meters_per_unit: 0.01}
    cookbook: docs/asset-modularity-instancing/authoring-scenegraph-instancing/nested-instancing.md
    xp: 460
    reward:
      opinion_points: 3
      achievement: "Floor clear! Nested instancing survived the Mirror Forge."
      inventory: {prim_censuses: 1}
    world_target: /City/InstanceWilds/BenchRow
    recipes: [Instancing]
    questions:
      - prompt: What is nested instancing?
        choices:
          - Instanceable prims that themselves contain instanceable descendants or references
          - Two PointInstancers in different files
          - Flattening a prototype
        answer: 0
        explanation: Nested instancing stacks instanceable aggregates.
      - prompt: Why can nested instancing explode memory if misused?
        choices:
          - Unique deinstances and nested prototypes multiply cost
          - USD forbids more than one instance
          - Payloads cannot nest
        answer: 0
        explanation: Deinstancing unique copies under nested prototypes defeats sharing.
