  - id: f7_promote_point
    title: Hide One Point and Promote It
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Point Wastes
    kind: room
    prerequisites: [f7_point_scatter]
    level_required: 16
    exam_tasks: [hide_point_instances, promote_a_point_instance]
    stats: {craft: 5, insight: 4}
    brief: "SYSTEM: One crate in the Wastes needs a name and an animator. Hide its index, then reference the real asset into the hole it left and place it where the point stood. Promotion is pruning plus a prim."
    starter: |
      from pathlib import Path
      from pxr import Gf, Usd, UsdGeom

      cargo = (Path(WORLD_ROOT) / "assets" / "cargo.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      field = UsdGeom.PointInstancer.Define(stage, "/City/InstanceWilds/CrateScatter")
      crate = stage.DefinePrim("/City/InstanceWilds/CrateScatter/Prototypes/Crate", "Xform")
      crate.GetReferences().AddReference(cargo)
      field.CreatePrototypesRel().SetTargets([crate.GetPath()])
      field.CreateProtoIndicesAttr([0, 0, 0, 0])
      field.CreatePositionsAttr([Gf.Vec3f(x, 0.0, 0.0) for x in (0.0, 2.0, 4.0, 6.0)])
      # TODO: Hide instance index 2 by authoring invisibleIds on the scatter.
      # TODO: Define /City/InstanceWilds/PromotedCrate, reference cargo.usda, and AddTranslateOp
      #       to (4, 0, 0), the position instance 2 held.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - point_instancer: {path: /City/InstanceWilds/CrateScatter, min_instances: 4, prototype_count: 1}
        - attribute_equals: {path: /City/InstanceWilds/CrateScatter.invisibleIds, value: [2]}
        - has_reference: {path: /City/InstanceWilds/PromotedCrate, asset: cargo.usda}
        - attribute_equals:
            path: /City/InstanceWilds/PromotedCrate.xformOp:translate
            value: [4.0, 0.0, 0.0]
    cookbook: docs/asset-modularity-instancing/refining-point-instances.md
    xp: 275
    reward: Promotion Warrant
    world_target: /City/InstanceWilds/PromotedCrate
    recipes: [Point Instancer, Reference]

