  - id: f7_modularity_doctrine
    title: Read the Case for Building Out of Parts
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Scenegraph Thickets
    kind: room
    prerequisites: [f6_zoning_golem]
    level_required: 15
    exam_tasks: [explain_content_reuse, separate_arcs_from_layer_stacks]
    stats: {lore: 4, insight: 3}
    brief: "SYSTEM: The Wilds run on reuse, and reuse is a decision you make before you make anything else. One rack asset, twenty-five placements, one team that never sees the bolts. Read the page, then answer."
    starter: ''
    language: none
    validator:
      assertions: []
    cookbook: docs/asset-modularity-instancing/asset-modularity/what-is-asset-modularity.md
    xp: 160
    reward: Reuse Doctrine
    world_target: /City/InstanceWilds
    recipes: [Reference, Layer Stack]
    questions:
      - prompt: A scene composes through its root layer stack. Which layers make up that stack?
        choices:
          - The root layer plus every sublayer, including the sublayers of those sublayers
          - The root layer plus every asset layer any prim references
          - Only the layers the stage was asked to open by name
        answer: 0
        explanation: The root layer stack is the root layer and its full sublayer tree; composition arcs then compose other layer stacks into it.
      - prompt: Four scenarios reference the same rack asset. A more advanced material model is authored once inside the rack. What reaches the scenarios?
        choices:
          - The change propagates through every assembly and scenario that references the rack
          - Nothing, because a reference copies the rack's scene description when it is authored
          - Only the scenarios whose layers are re-exported by hand afterwards
        answer: 0
        explanation: Centralized editing is the point of reuse, since one edit to a referenced asset resolves everywhere it is composed.
      - prompt: The module treats layer stacks and composition arcs as separate operators rather than one idea. Which topic makes that distinction matter?
        choices:
          - Instancing, whose behavior depends on which operator supplied the shared structure
          - Sublayering, which cannot be expressed as an arc at all
          - Strength ordering, which ignores arcs entirely
        answer: 0
        explanation: LIVERPS orders local layer stacks against arcs, and instancing behavior turns on which of the two brought in the structure.

