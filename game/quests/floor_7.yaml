      cargo = (Path(WORLD_ROOT) / "assets" / "cargo.usda").as_posix()
      bench = (Path(WORLD_ROOT) / "assets" / "bench.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      UsdGeom.Xform.Define(stage, "/City/InstanceWilds/Warehouse")
