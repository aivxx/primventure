  - id: f7_dedup_declaration
    title: Read What Instancing Actually Declares
    floor: 8
    floor_name: Prototype Wilds
    neighborhood: Scenegraph Thickets
    kind: room
    prerequisites: [f7_asset_lineup]
    level_required: 15
    exam_tasks: [explain_declarative_deduplication, weigh_refinement_against_sharing]
    stats: {lore: 4, insight: 4}
    brief: "SYSTEM: Composition already lets you repeat an asset forty thousand times and override every copy. Instancing is you giving up that right on purpose, in writing. Read the page, then answer."
    starter: ''
    language: none
    validator:
      assertions: []
    cookbook: docs/asset-modularity-instancing/what-is-instancing.md
    xp: 165
    reward: Deduplication Waiver
    world_target: /City/InstanceWilds
    recipes: [Reference, Instancing]
    questions:
      - prompt: A stage references one robot asset forty times and overrides a few copies. What must a runtime do before it can deduplicate the rest?
        choices:
          - Inspect each copy for overrides to learn whether it still matches the source
          - Nothing, because copies that share an asset path are always shared automatically
          - Flatten the composed stage into a single layer first
        answer: 0
        explanation: Deduplication after the fact costs time and algorithmic complexity, because every repetition has to be compared against the source.
      - prompt: What does tagging part of a scene for instancing declare up front?
        choices:
          - That the tagged element is not open to refinement downstream, so its composed result can be shared
          - That the element is drawn in a single batch by the renderer
          - That the element's layer is stored only once on disk
        answer: 0
        explanation: Instancing is a declaration that per-instance customization is limited, which is what lets the composed result be shared without inspection.
      - prompt: What is the trade you accept in exchange for that shared view of the scene?
        choices:
          - Sparse overrides on the shared content, given up in return for lower runtime cost
          - Composition arcs, which instanced content can no longer use
          - Modular layers, which must be merged before instancing applies
        answer: 0
        explanation: Sparse overrides are the capability being limited; modular layers and arcs are what instancing is built on top of.

