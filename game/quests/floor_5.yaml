  - id: f5_liverps_labyrinth
    title: Trace the Highland Labyrinth
    floor: 5
    floor_name: Arc Highlands
    neighborhood: LIVERPS Labyrinth
    kind: floor_boss
    prerequisites: [f5_city_block]
    level_required: 12
    exam_tasks: [trace_liverps, debug_composed_opinions]
    stats: {insight: 5, resolve: 5, craft: 3}
    brief: "SYSTEM: The block is composed. The sign is lying. A reference says 1, a variant says 2, a payload says 3. Author the local 4 and keep every weaker arc intact."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      folder = Path(STAGE_PATH).parent

      referenced = Usd.Stage.CreateNew(str(folder / "ref_sign.usda"))
      ref_root = referenced.DefinePrim("/Sign", "Xform")
      ref_root.CreateAttribute("floorIndex", Sdf.ValueTypeNames.Int).Set(1)
      referenced.SetDefaultPrim(ref_root)
      referenced.GetRootLayer().Save()

      payload = Usd.Stage.CreateNew(str(folder / "payload_sign.usda"))
      payload_root = payload.DefinePrim("/Bulk", "Xform")
      payload_root.CreateAttribute("floorIndex", Sdf.ValueTypeNames.Int).Set(3)
      payload.SetDefaultPrim(payload_root)
      payload.GetRootLayer().Save()

      fallback = stage.CreateClassPrim("/_FallbackIndex")
      fallback.CreateAttribute("floorIndex", Sdf.ValueTypeNames.Int).Set(0)
      inherited = stage.CreateClassPrim("/_InheritedIndex")
      inherited.CreateAttribute("floorIndex", Sdf.ValueTypeNames.Int).Set(5)

      sign = stage.DefinePrim("/City/ArcHighlands/LabyrinthSign", "Xform")
      sign.GetSpecializes().AddSpecialize(fallback.GetPath())
      sign.GetPayloads().AddPayload("payload_sign.usda")
      sign.GetReferences().AddReference("ref_sign.usda")
      sign.GetInherits().AddInherit(inherited.GetPath())
      modes = sign.GetVariantSets().AddVariantSet("edition")
      for name, value in [("draft", 2), ("final", 2)]:
          modes.AddVariant(name)
          modes.SetVariantSelection(name)
          with modes.GetVariantEditContext():
              sign.CreateAttribute("floorIndex", Sdf.ValueTypeNames.Int).Set(value)
      modes.SetVariantSelection("final")
      # TODO: Author a local floorIndex of 4 while preserving the weaker arcs.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - attribute_equals: {path: /City/ArcHighlands/LabyrinthSign.floorIndex, value: 4}
        - attribute_source: {path: /City/ArcHighlands/LabyrinthSign.floorIndex, layer: submission.usd}
        - has_inherit: {path: /City/ArcHighlands/LabyrinthSign}
        - has_variant_set:
            path: /City/ArcHighlands/LabyrinthSign
            name: edition
            variants: [draft, final]
            selection: final
        - has_reference: {path: /City/ArcHighlands/LabyrinthSign, asset: ref_sign.usda}
        - has_payload: {path: /City/ArcHighlands/LabyrinthSign, asset: payload_sign.usda}
        - has_specializes: {path: /City/ArcHighlands/LabyrinthSign}
        - prim_stack: {path: /City/ArcHighlands/LabyrinthSign, min: 5}
    cookbook: docs/creating-composition-arcs/strength-ordering/tracing-through-liverps.md
    xp: 500
    reward:
      opinion_points: 3
      achievement: "Floor clear! You traced LIVERPS on a live city sign. Weaker arcs request a mediator."
      inventory: {system_peeks: 1}
    world_target: /City/ArcHighlands/LabyrinthSign
    recipes: [LIVERPS Strength Ordering, Composition]
    questions:
      - prompt: "From strongest to weakest, LIVRPS is:"
        choices:
          - Local, Inherits, Variant sets, References, Payloads, Specializes
          - Local, References, Inherits, Variant sets, Payloads, Specializes
          - Specializes, Payloads, References, Variant sets, Inherits, Local
        answer: 0
        explanation: LIVRPS is Local, Inherits, Variant sets, References, Payloads, Specializes.
      - prompt: An inherit authors 5 and a local authors 4. Which composed value wins?
        choices: ["5", "4", "Neither"]
        answer: 1
        explanation: Local opinions are stronger than inherits.
      - prompt: Why keep the payload after authoring a local value?
        choices:
          - The payload still contributes other composition and can be inspected later
          - Local opinions require payloads
          - usdview cannot open stages without payloads
        answer: 0
        explanation: Weaker arcs remain part of the composed prim even when a stronger opinion wins.
