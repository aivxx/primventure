      - {prim_exists: /World/Looks/Red}
      - {prim_exists: /World/Cube}
      - traversal_contains:
          paths: [/World/Looks/Red]
          excluded: [/Looks]
      - metadata_equals: {path: /World, key: documentation, value: 'Stranded Looks: Encapsulate the
