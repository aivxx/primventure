quests:
  - id: f5_sublayer_workstreams
    title: Sublayer the Geometry and Shading Workstreams
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Sublayer Yards
    kind: room
    prerequisites: [f4_hydra_of_choices]
    level_required: 10
    exam_tasks: [author_sublayers, separate_workstreams]
    stats: {craft: 3, lore: 3}
    brief: "SYSTEM: Geometry and shading filed a joint complaint. Give each a weaker layer. A third department will be considered evidence of panic."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
      folder = Path(STAGE_PATH).parent

      geometry = Usd.Stage.CreateNew(str(folder / "geometry.usda"))
      geometry.DefinePrim("/World", "Xform")
      geometry.DefinePrim("/World/Hull", "Cube")
      geometry.GetRootLayer().Save()

      shading = Usd.Stage.CreateNew(str(folder / "shading.usda"))
      shading.OverridePrim("/World/Hull").SetDisplayName("Shaded Hull")
      shading.GetRootLayer().Save()

      # TODO: Append shading.usda then geometry.usda to the root subLayerPaths.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_exists: /World/Hull
        - sublayer_order: {layers: [shading.usda, geometry.usda]}
        - specifier_equals: {path: /World/Hull, value: def}
    cookbook: docs/creating-composition-arcs/sublayers/working-with-sublayers.md
    xp: 200
    reward: Workstream Wedge
    world_target: /City/ArcHighlands/SkyscraperShell
    recipes: [Sublayer, Layer Stack]

  - id: f5_workstream_clerk
    title: "Workstream Clerk: Reorder the Sublayer Stack"
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Sublayer Yards
    kind: neighborhood_boss
    prerequisites: [f5_sublayer_workstreams]
    level_required: 10
    exam_tasks: [order_sublayers, inspect_strongest_opinion]
    stats: {insight: 4, resolve: 3}
    brief: "SYSTEM: Layout currently shouts over lighting. Invert the stack without rewriting either file. The Clerk is taking notes."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      folder = Path(STAGE_PATH).parent
      for filename, sign_off in (("layout.usda", "DRAFT"), ("lighting.usda", "FINAL")):
          fixture = Usd.Stage.CreateNew(str(folder / filename))
          marquee = fixture.DefinePrim("/World/Marquee", "Xform")
          marquee.CreateAttribute("signOff", Sdf.ValueTypeNames.String).Set(sign_off)
          fixture.GetRootLayer().Save()

      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World/Marquee with type Xform.
      # 2. Set /World/Marquee.signOff to 'FINAL'.
      # 3. Make lighting.usda the strongest source for /World/Marquee.signOff.
      # 4. Set root sublayers strongest-first to ['lighting.usda', 'layout.usda'].
      # 5. Set /World/Marquee metadata documentation to 'Workstream Clerk: Reorder the Sublayer Stack cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /World/Marquee, value: Xform}
      - attribute_equals: {path: /World/Marquee.signOff, value: FINAL}
      - attribute_source: {path: /World/Marquee.signOff, layer: lighting.usda}
      - sublayer_order:
          layers: [lighting.usda, layout.usda]
      - metadata_equals: {path: /World/Marquee, key: documentation, value: 'Workstream Clerk: Reorder the Sublayer Stack
            cleared.'}
    cookbook: docs/creating-composition-arcs/sublayers/what-are-sublayers.md
    xp: 260
    reward: {opinion_points: 1, achievement: "New achievement! You promoted lighting without touching a vertex."}
    world_target: /City/ArcHighlands/Marquee
    recipes: [Opinions, Direct Opinion]
    questions:
      - prompt: In a root layer's subLayerPaths, which listed layer is strongest?
        choices: [The first, The last, The largest file]
        answer: 0
        explanation: Sublayers are ordered strongest to weakest.

