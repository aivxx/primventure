quests:
  - id: f5_composition_brief
    title: Read How Specs Compose One Prim
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Sublayer Yards
    kind: room
    prerequisites: [f4_hydra_of_choices]
    level_required: 10
    exam_tasks: [explain_prim_composition, distinguish_specs_from_prims]
    stats: {lore: 3, insight: 3}
    brief: "SYSTEM: The Highlands hand out composition arcs. Before that, settle what an arc argues over. A prim on a stage is a resolved result; the specs sitting in each layer are the opinions behind it. Read the page, then answer."
    starter: ""
    language: none
    validator:
      assertions: []
    cookbook: docs/creating-composition-arcs/prim-composition.md
    xp: 150
    reward: Composition Ledger
    world_target: /City/ArcHighlands
    recipes: [Opinions, Prim Spec]
    questions:
      - prompt: What does a layer actually hold for a prim the stage presents at /World/Hull?
        choices:
          - A prim spec carrying that layer's own authored opinions
          - A copy of the composed prim the stage will present
          - Nothing, because prims exist only on stages
        answer: 0
        explanation: Layers store sparse prim specs and property specs; a stage composes them into one prim.
      - prompt: Two layers in the same stack both author a prim spec at /World/Hull. What does the stage present?
        choices:
          - One composed prim assembled from both specs, resolved field by field
          - Two sibling prims sharing one path
          - Only the spec from whichever layer was saved most recently
        answer: 0
        explanation: Composition gathers every applicable spec and resolves each field by strength into a single prim.
      - prompt: Why can one property resolve from a weaker layer than the one supplying its prim's type?
        choices:
          - Resolution runs per field, so a weaker spec supplies whatever nothing stronger authored
          - Types and values are resolved on separate stages
          - Weaker layers always win for properties and lose for metadata
        answer: 0
        explanation: Each field and property is resolved independently, so a weaker spec fills gaps the stronger ones leave.

  - id: f5_sublayer_brief
    title: Read the Sublayer Strength Order
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Sublayer Yards
    kind: room
    prerequisites: [f5_composition_brief]
    level_required: 10
    exam_tasks: [explain_sublayer_inclusion, order_competing_opinions]
    stats: {lore: 3, insight: 3}
    brief: "SYSTEM: Sublayer Yards runs on one list and one rule. Every listed layer arrives unremapped, and the order is the entire negotiation. Answer before you touch a stack."
    starter: ""
    language: none
    validator:
      assertions: []
    cookbook: docs/creating-composition-arcs/sublayers/what-are-sublayers.md
    xp: 150
    reward: Yard Order Sheet
    world_target: /City/ArcHighlands
    recipes: [Sublayer, Layer Stack]
    questions:
      - prompt: A sublayer defines a Cube at /World/Geometry/Cube. Where does it contribute on the composed stage?
        choices:
          - At /World/Geometry/Cube, because sublayers include content without remapping paths
          - Beneath whichever prim the root layer nominates as its default
          - At a path the root layer chooses when it lists the sublayer
        answer: 0
        explanation: Sublayer composition adds every spec at the path it was authored, unlike references and payloads.
      - prompt: sublayerB is listed before sublayerA and both author the cube's size. What happens to sublayerA's value?
        choices:
          - It stays in the stack and returns if sublayerB's opinion is removed
          - It is erased from sublayerA when the stack composes
          - It is averaged with sublayerB's value
        answer: 0
        explanation: Strength ordering picks a winner per opinion; the weaker opinion remains authored in its own layer.
      - prompt: Where do opinions authored directly in the root layer sit relative to the sublayers it lists?
        choices:
          - Stronger than every sublayer in the stack
          - Weaker than the first listed sublayer only
          - Equal to the first listed sublayer
        answer: 0
        explanation: Within a layer stack the root layer is strongest, and listed sublayers follow first to last.

  - id: f5_sublayer_workstreams
    title: Sublayer the Geometry and Shading Workstreams
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Sublayer Yards
    kind: room
    prerequisites: [f5_sublayer_brief]
    level_required: 10
    exam_tasks: [author_sublayers, separate_workstreams]
    stats: {craft: 3, lore: 3}
    brief: "SYSTEM: Geometry and shading filed a joint complaint. Give each a weaker layer. A third department will be considered evidence of panic."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
      folder = Path(STAGE_PATH).parent

      geometry = Usd.Stage.CreateNew(str(folder / "geometry.usda"))
      geometry.DefinePrim("/World", "Xform")
      geometry.DefinePrim("/World/Hull", "Cube")
      geometry.GetRootLayer().Save()

      shading = Usd.Stage.CreateNew(str(folder / "shading.usda"))
      shading.OverridePrim("/World/Hull").SetDisplayName("Shaded Hull")
      shading.GetRootLayer().Save()

      # TODO: Append shading.usda then geometry.usda to the root subLayerPaths.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_exists: /World/Hull
        - sublayer_order: {layers: [shading.usda, geometry.usda]}
        - specifier_equals: {path: /World/Hull, value: def}
    cookbook: docs/creating-composition-arcs/sublayers/working-with-sublayers.md
    xp: 200
    reward: Workstream Wedge
    world_target: /City/ArcHighlands/SkyscraperShell
    recipes: [Sublayer, Layer Stack]

  - id: f5_workstream_clerk
    title: "Workstream Clerk: Reorder the Sublayer Stack"
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Sublayer Yards
    kind: neighborhood_boss
    prerequisites: [f5_sublayer_workstreams]
    level_required: 10
    exam_tasks: [order_sublayers, inspect_strongest_opinion]
    stats: {insight: 4, resolve: 3}
    brief: "SYSTEM: Layout currently shouts over lighting. Invert the stack without rewriting either file. The Clerk is taking notes."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      folder = Path(STAGE_PATH).parent
      for filename, sign_off in (("layout.usda", "DRAFT"), ("lighting.usda", "FINAL")):
          fixture = Usd.Stage.CreateNew(str(folder / filename))
          marquee = fixture.DefinePrim("/World/Marquee", "Xform")
          marquee.CreateAttribute("signOff", Sdf.ValueTypeNames.String).Set(sign_off)
          fixture.GetRootLayer().Save()

      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World/Marquee with type Xform.
      # 2. Set /World/Marquee.signOff to 'FINAL'.
      # 3. Make lighting.usda the strongest source for /World/Marquee.signOff.
      # 4. Set root sublayers strongest-first to ['lighting.usda', 'layout.usda'].
      # 5. Set /World/Marquee metadata documentation to 'Workstream Clerk: Reorder the Sublayer Stack cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /World/Marquee, value: Xform}
      - attribute_equals: {path: /World/Marquee.signOff, value: FINAL}
      - attribute_source: {path: /World/Marquee.signOff, layer: lighting.usda}
      - sublayer_order:
          layers: [lighting.usda, layout.usda]
      - metadata_equals: {path: /World/Marquee, key: documentation, value: 'Workstream Clerk: Reorder the Sublayer Stack
            cleared.'}
    cookbook: docs/creating-composition-arcs/sublayers/what-are-sublayers.md
    xp: 260
    reward: {opinion_points: 1, achievement: "New achievement! You promoted lighting without touching a vertex."}
    world_target: /City/ArcHighlands/Marquee
    recipes: [Opinions, Direct Opinion]
    questions:
      - prompt: In a root layer's subLayerPaths, which listed layer is strongest?
        choices: [The first, The last, The largest file]
        answer: 0
        explanation: Sublayers are ordered strongest to weakest.

  - id: f5_reference_brief
    title: Read What a Reference Grafts
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Reference Docks
    kind: room
    prerequisites: [f5_workstream_clerk]
    level_required: 11
    exam_tasks: [explain_reference_grafting, distinguish_internal_and_external_references]
    stats: {lore: 3, insight: 3}
    brief: "SYSTEM: The docks sign for one building and stand it up three times. Before the paperwork clears, settle what an arc grafts and what happens to the names on the way in. Read the page, then answer."
    starter: ""
    language: none
    validator:
      assertions: []
    cookbook: docs/creating-composition-arcs/references-payloads/what-are-references.md
    xp: 160
    reward: Docks Grafting Notice
    world_target: /City/ArcHighlands/Skyline
    recipes: [Reference, Path Translation]
    questions:
      - prompt: Why can sublayering one sphere layer three times not produce three spheres?
        choices:
          - Every inclusion contributes at the authored path, so the three arrive as one prim
          - A layer stack refuses to list the same layer more than once
          - Each inclusion after the first drops the layer's prim specs
        answer: 0
        explanation: Sublayers never remap paths, so repeating one only redefines the same prim rather than creating siblings.
      - prompt: What happens to a referenced prim's name and descendant paths at the destination?
        choices:
          - They are translated into the destination prim's namespace
          - They stay exactly as the source layer authored them
          - They are copied into the destination's root layer as new specs
        answer: 0
        explanation: A reference grafts the source hierarchy onto the destination prim, so the root takes the destination's name and its descendants are re-pathed beneath it.
      - prompt: A layer defines blue_cube_01 and two sibling prims that reference blue_cube_01 in that same layer. What kind of reference is that?
        choices:
          - Internal, because the target is a prim in the current layer stack
          - External, because each destination is its own prim
          - Invalid, because a layer cannot target a prim it authored itself
        answer: 0
        explanation: References targeting a prim in the current layer stack are internal; external references name a prim in a different layer.

