  - id: f5_encapsulation_raid
    title: "Stranded Looks: Encapsulate the Bindings"
    floor: 5
    floor_name: Composition Highlands
    neighborhood: Reference Docks
    kind: neighborhood_boss
    prerequisites: [f5_skyline_references]
    level_required: 11
    exam_tasks: [encapsulate_default_prim, keep_bindings_inside]
    stats: {insight: 4, resolve: 3}
    brief: "SYSTEM: The material lives outside World. Referencing the asset will strand the binding. Move Looks under the default prim before the crowd notices."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World with type Xform.
      # 2. Set the stage default prim to /World.
      # 3. Define or override /World/Looks/Red.
      # 4. Define or override /World/Cube.
      # 5. Traversal must include ['/World/Looks/Red'] and exclude ['/Looks'].
      # 6. Set /World metadata documentation to 'Stranded Looks: Encapsulate the Bindings cleared.'.
      stage.GetRootLayer().Save()
