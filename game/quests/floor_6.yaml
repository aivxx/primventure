  - id: f6_workstream_split
    title: Split Geometry and Shading Into Sublayers
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Workstream Forges
    kind: room
    prerequisites: [f6_hierarchy_sort]
    level_required: 13
    exam_tasks: [author_workstream_sublayers, keep_interface_thin]
    stats: {craft: 4, lore: 3}
    brief: "SYSTEM: Modelers and lookdev cannot share a file without a restraining order. Give each a sublayer."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      folder = Path(STAGE_PATH).parent
      geometry = Usd.Stage.CreateNew(str(folder / "geometry.usda"))
      geometry.DefinePrim("/World", "Xform")
      geometry.DefinePrim("/World/Hull", "Cube")
      geometry.GetRootLayer().Save()
      shading = Usd.Stage.CreateNew(str(folder / "shading.usda"))
      shading.OverridePrim("/World/Hull").SetDisplayName("Shaded Hull")
      shading.GetRootLayer().Save()
      # TODO: Append shading.usda then geometry.usda as sublayers.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_exists: /World/Hull
        - sublayer_order: {layers: [shading.usda, geometry.usda]}
    cookbook: docs/asset-structure/workstreams/modeling-workstreams.md
    xp: 220
    reward: Workstream Wedge
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Sublayer, Layer Stack]

  - id: f6_shading_workstream
    title: Publish the Surfacing Workstream Layer
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Workstream Forges
    kind: room
    prerequisites: [f6_workstream_split]
    level_required: 13
    exam_tasks: [author_sparse_shading_layer, order_workstream_sublayers]
    stats: {craft: 4, lore: 3}
    brief: "SYSTEM: Guild job. Modeling has published geometry.usda and gone home. Surfacing exports next, and it exports only what surfacing owns: a material and a binding, in its own layer, stronger than the geometry it decorates."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom, UsdShade

      folder = Path(STAGE_PATH).parent
      geometry = Usd.Stage.CreateNew(str(folder / "geometry.usda"))
      geometry.DefinePrim("/World", "Xform")
      UsdGeom.Mesh.Define(geometry, "/World/Geometry/large_buildingF")
      geometry.GetRootLayer().Save()

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      stage.GetRootLayer().subLayerPaths.append("geometry.usda")
      shading = Usd.Stage.CreateNew(str(folder / "shading.usda"))
      # TODO: In shading.usda author only surfacing: define /World/Looks/roof as a
      #       UsdShade.Material, OverridePrim the existing mesh, and give it a
      #       material:binding with CreateRelationship targeting /World/Looks/roof.
      # TODO: Save shading.usda, then place it ahead of geometry.usda in the root
      #       layer's subLayerPaths so the sparse export is the stronger opinion.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - sublayer_order: {layers: [shading.usda, geometry.usda]}
        - prim_type: {path: /World/Looks/roof, value: Material}
        - prim_type: {path: /World/Geometry/large_buildingF, value: Mesh}
        - relationship_targets:
            path: /World/Geometry/large_buildingF.material:binding
            targets: [/World/Looks/roof]
    cookbook: docs/asset-structure/workstreams/adding-user-workstreams.md
    xp: 240
    reward: Surfacing Export Slip
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Sublayer, Over]

