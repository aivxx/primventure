    questions:
      - prompt: Why is Scope generally the best type for an organizational prim?
        choices:
          - It carries no additional semantics such as the transform operations an Xform implies
          - It composes faster than an Xform
          - It cannot be overridden by downstream layers
        answer: 0
        explanation: An organizational node should not quietly acquire transform behavior.
      - prompt: What does partitioning a prim hierarchy prevent?
        choices:
          - Unintentional namespace collisions between collaborators and ambiguous parentage
          - Variant selections from composing
          - Materials from binding across scopes
        answer: 0
        explanation: Partitions give each contribution its own jurisdiction and make parentage mean something.
      - prompt: How do collaborators signal that a prim is internal rather than public?
        choices:
          - By convention, such as leading underscores, because no field is protected from being overridden
          - By leaving the prim out of stage traversal
          - By authoring the prim as a class rather than a def
        answer: 0
        explanation: OpenUSD places no restriction on which fields may be overridden, so access semantics are a naming agreement.

