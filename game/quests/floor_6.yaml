  - id: f6_loft_primvar
    title: Loft the Accent Above the Payload
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Parameter Loft
    kind: room
    prerequisites: [f6_payload_split]
    level_required: 13
    exam_tasks: [loft_asset_parameter, copy_property_specs]
    stats: {craft: 4, insight: 4}
    brief: "SYSTEM: Guild job. The accent parameter went behind the payload and took its discoverability with it. Copy the property specs up onto the interface layer with the Sdf API, which edits one layer at a time and ignores composition entirely."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      folder = Path(STAGE_PATH).parent
      contents = Usd.Stage.CreateNew(str(folder / "contents.usda"))
      inner = UsdGeom.Xform.Define(contents, "/World").GetPrim()
      contents.SetDefaultPrim(inner)
      UsdGeom.PrimvarsAPI(inner).CreatePrimvar(
          "accentColor", Sdf.ValueTypeNames.Float3, UsdGeom.Tokens.constant
      ).Set((1.0, 0.0, 0.0))
      contents.GetRootLayer().Save()

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
      stage.SetDefaultPrim(world)
      world.GetPayloads().AddPayload("./contents.usda")
      asset_layer = stage.GetRootLayer()
      contents_layer = contents.GetRootLayer()
      # TODO: Take contents_layer.GetPrimAtPath("/World") and, for every property
      #       spec on it, Sdf.CopySpec that spec onto asset_layer at the same path
      #       and RemoveProperty it from the contents prim spec.
      # TODO: Save contents_layer as well, so the moved specs persist on disk.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - has_payload: {path: /World, asset: contents.usda}
        - attribute_equals: {path: /World.primvars:accentColor, value: [1.0, 0.0, 0.0]}
        - attribute_source: {path: /World.primvars:accentColor, layer: submission.usd}
    cookbook: docs/asset-structure/reference-payload-pattern/lofting-primvars.md
    xp: 260
    reward: Lofting Caliper
