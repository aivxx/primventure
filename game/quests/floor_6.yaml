floor: 6
floor_name: Asset Foundry
quests:
  - id: f6_entry_point
    title: Cut the Asset Front Door
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Principles Ward
    kind: room
    prerequisites: [f5_liverps_labyrinth]
    level_required: 12
    exam_tasks: [set_default_prim, encapsulate_entry]
    stats: {lore: 3, craft: 3}
    brief: "SYSTEM: Guild job one. An export dumped geometry at the layer root. Give it a /World door or every reference will wander the parking lot."
    starter: |
      from pxr import Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      UsdGeom.Cube.Define(stage, "/Hull")
      # TODO: Define /World as an Xform, set it as the default prim,
      # and reparent /Hull under /World with Usd.NamespaceEditor.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - default_prim: /World
        - prim_exists: /World/Hull
        - traversal_contains: {paths: [/World/Hull], excluded: [/Hull]}
    cookbook: docs/asset-structure/asset-structure-principles/your-first-asset.md
    xp: 200
    reward: Entry Chisel
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Default Prim, Asset]

  - id: f6_hierarchy_sort
    title: File Looks With the Building
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Principles Ward
    kind: neighborhood_boss
    prerequisites: [f6_entry_point]
    level_required: 12
    exam_tasks: [organize_prim_hierarchy, encapsulate_materials]
    stats: {insight: 3, lore: 3}
    brief: "SYSTEM: Geometry lives under World. Materials filed a separate ZIP. Encapsulate Looks or the next reference will arrive nude."
    starter: |
      from pxr import Usd, UsdGeom, UsdShade

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World")
      stage.SetDefaultPrim(world.GetPrim())
      UsdGeom.Cube.Define(stage, "/World/Hull")
      # TODO: Define /World/Looks as a Scope and /World/Looks/Paint as a Material.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - default_prim: /World
        - prim_type: {path: /World/Looks, value: Scope}
        - prim_exists: /World/Looks/Paint
        - traversal_contains: {paths: [/World/Looks/Paint], excluded: [/Looks]}
    cookbook: docs/asset-structure/asset-structure-principles/organizing-prim-hierarchy.md
    xp: 240
    reward: {opinion_points: 1, achievement: "New achievement! You put the paint inside the building. Interior designers wept."}
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Namespace, Encapsulation]
    questions:
      - prompt: Why should Looks live under the default prim?
        choices:
          - So references and payloads bring materials with the asset
          - So usdview hides geometry
          - So kind metadata becomes optional
        answer: 0
        explanation: Encapsulation keeps bindings inside the referenced target.

  - id: f6_workstream_split
    title: Split Geometry From Shading
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Workstream Forges
    kind: room
    prerequisites: [f6_hierarchy_sort]
    level_required: 13
    exam_tasks: [author_workstream_sublayers, keep_interface_thin]
    stats: {craft: 4, lore: 3}
    brief: "SYSTEM: Modelers and lookdev cannot share a file without a restraining order. Give each a sublayer."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      folder = Path(STAGE_PATH).parent
      geometry = Usd.Stage.CreateNew(str(folder / "geometry.usda"))
      geometry.DefinePrim("/World", "Xform")
      geometry.DefinePrim("/World/Hull", "Cube")
      geometry.GetRootLayer().Save()
      shading = Usd.Stage.CreateNew(str(folder / "shading.usda"))
      shading.OverridePrim("/World/Hull").SetDisplayName("Shaded Hull")
      shading.GetRootLayer().Save()
      # TODO: Append shading.usda then geometry.usda as sublayers.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_exists: /World/Hull
        - sublayer_order: {layers: [shading.usda, geometry.usda]}
    cookbook: docs/asset-structure/workstreams/modeling-workstreams.md
    xp: 220
    reward: Workstream Wedge
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Sublayer, Layer Stack]

  - id: f6_asset_interface
    title: Forge the Thin Asset Shell
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Workstream Forges
    kind: city_boss
    prerequisites: [f6_workstream_split]
    level_required: 13
    exam_tasks: [reference_payload_pattern, set_default_prim, split_workstreams]
    stats: {craft: 4, resolve: 4, lore: 3}
    brief: "SYSTEM: City boss. Contents are bulk. The asset file is a door. Payload the workstreams. Do not weld the foundry to the catalog card."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      folder = Path(STAGE_PATH).parent
      contents = Usd.Stage.CreateNew(str(folder / "contents.usda"))
      UsdGeom.Xform.Define(contents, "/World")
      contents.DefinePrim("/World/Hull", "Cube")
      contents.SetDefaultPrim(contents.GetPrimAtPath("/World"))
      contents.GetRootLayer().Save()

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World")
      UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
      # TODO: Set /World as default prim.
      # TODO: Payload contents.usda onto /World.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - default_prim: /World
        - has_payload: {path: /World, asset: contents.usda}
        - prim_exists: /World/Hull
        - up_axis: Y
    cookbook: docs/asset-structure/reference-payload-pattern/what-is-ref-payload-pattern.md
    xp: 360
    reward: {opinion_points: 2, achievement: "Shell forged. The contents layer now travels asleep."}
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Payload, Asset]
    questions:
      - prompt: Why payload contents instead of referencing them from the asset interface?
        choices:
          - Payloads keep heavy contents unloadable while preserving the asset door
          - References cannot target USDA
          - Payloads always beat local opinions
        answer: 0
        explanation: The reference/payload pattern keeps a thin interface over deferred contents.

  - id: f6_accent_parameter
    title: Loft the Accent Color
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Parameter Loft
    kind: room
    prerequisites: [f6_asset_interface]
    level_required: 13
    exam_tasks: [author_interface_primvar, parameterize_asset]
    stats: {craft: 3, lore: 3}
    brief: "SYSTEM: The client will change the awning color 400 times. Put accentColor on the default prim, not buried in a shader."
    starter: |
      from pxr import Sdf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World")
      stage.SetDefaultPrim(world.GetPrim())
      # TODO: Create constant primvar accentColor = (1, 0, 0) on /World.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - default_prim: /World
        - attribute_equals: {path: /World.primvars:accentColor, value: [1.0, 0.0, 0.0]}
    cookbook: docs/asset-structure/asset-parameterization/what-is-asset-parameterization.md
    xp: 230
    reward: Accent Swatch
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Primvar, Asset]

  - id: f6_loft_variant
    title: Hoist the Shade Variant
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Parameter Loft
    kind: neighborhood_boss
    prerequisites: [f6_accent_parameter]
    level_required: 13
    exam_tasks: [loft_variant_set, keep_internal_selection]
    stats: {insight: 4, craft: 3}
    brief: "SYSTEM: Shade lives on Looks. Consumers cannot see Looks. Loft the variant set to the default prim or the art director will enter the payload."
    starter: |
      from pxr import Sdf, Usd, UsdGeom, UsdShade

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
      stage.SetDefaultPrim(world)
      looks = stage.DefinePrim("/World/Looks", "Scope")
      shades = looks.GetVariantSets().AddVariantSet("paint")
      for name in ("brick", "stucco"):
          shades.AddVariant(name)
          shades.SetVariantSelection(name)
          with shades.GetVariantEditContext():
              looks.CreateAttribute("finishName", Sdf.ValueTypeNames.String).Set(name)
      shades.SetVariantSelection("brick")
      # TODO: Add the same paint variant set on /World and select brick.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - has_variant_set:
            path: /World
            name: paint
            variants: [brick, stucco]
            selection: brick
        - has_variant_set:
            path: /World/Looks
            name: paint
            variants: [brick, stucco]
    cookbook: docs/asset-structure/reference-payload-pattern/lofting-variant-sets.md
    xp: 280
    reward: {opinion_points: 1, achievement: "New achievement! You lofted a variant without inviting the client into Looks."}
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Variant Set]
    questions:
      - prompt: Why loft a variant set from Looks to the default prim?
        choices:
          - Downstream shots can select variants without opening internal scopes
          - Variant sets only work on default prims
          - Lofting deletes the original set
        answer: 0
        explanation: The asset interface is the supported place to parameterize an asset.

