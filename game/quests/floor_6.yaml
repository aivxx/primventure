  - id: f6_asset_interface
    title: "Thin Asset Shell: The Reference-Payload Pattern"
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Workstream Forges
    kind: city_boss
    prerequisites: [f6_ref_payload_brief]
    level_required: 13
    exam_tasks: [reference_payload_pattern, set_default_prim, split_workstreams]
    stats: {craft: 4, resolve: 4, lore: 3}
    brief: "SYSTEM: City boss. Contents are bulk. The asset file is a door. Payload the workstreams and keep the foundry detachable from its catalog card."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      fixture = Usd.Stage.CreateNew(str(Path(STAGE_PATH).parent / "contents.usda"))
      contents = fixture.DefinePrim("/World", "Xform")
      fixture.DefinePrim("/World/Hull", "Cube")
      fixture.SetDefaultPrim(contents)
      fixture.GetRootLayer().Save()

      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World with type Xform.
      # 2. Set the stage default prim to /World.
      # 3. Author a payload on /World to asset contents.usda.
      # 4. Define or override /World/Hull.
      # 5. Set stage up axis to Y.
      # 6. Set /World metadata documentation to 'Thin Asset Shell: The Reference-Payload Pattern cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /World, value: Xform}
      - {default_prim: /World}
      - has_payload: {path: /World, asset: contents.usda}
      - {prim_exists: /World/Hull}
      - {up_axis: Y}
      - metadata_equals: {path: /World, key: documentation, value: 'Thin Asset Shell: The Reference-Payload
            Pattern cleared.'}
    cookbook: docs/asset-structure/reference-payload-pattern/what-is-ref-payload-pattern.md
    xp: 360
    reward: {opinion_points: 2, achievement: "Shell forged. The contents layer now travels asleep."}
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Payload, Asset]
    questions:
      - prompt: Why should the asset interface payload its contents?
        choices:
          - Payloads keep heavy contents unloadable while preserving the asset door
          - References cannot target USDA
          - Payloads always beat local opinions
        answer: 0
        explanation: The reference/payload pattern keeps a thin interface over deferred contents.

  - id: f6_payload_split
    title: Split the Asset Into Interface and Contents
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Workstream Forges
    kind: room
    prerequisites: [f6_asset_interface]
    level_required: 13
    exam_tasks: [export_contents_layer, rebuild_asset_interface]
    stats: {craft: 4, resolve: 3}
    brief: "SYSTEM: Guild job. The authored asset is exported to contents.usda, and the file consumers reference gets rebuilt from nothing: an entry point, the stage conventions, and a payload. No workstream sublayers survive the move."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd, UsdGeom

      folder = Path(STAGE_PATH).parent
