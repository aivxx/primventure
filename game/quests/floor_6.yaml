    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World with type Xform.
      # 2. Set the stage default prim to /World.
      # 3. Define /World/Looks with type Scope.
      # 4. Define or override /World/Looks/Paint.
