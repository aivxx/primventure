  - id: f6_why_structure
    title: Read the Case for Asset Structure
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Principles Ward
    kind: room
    prerequisites: [f5_liverps_labyrinth]
    level_required: 12
    exam_tasks: [define_asset, judge_structure_principles]
    stats: {lore: 4, insight: 3}
    brief: "SYSTEM: Floor six opens with paperwork. An asset is a named, versioned, structured container, and the Foundry will not stamp a pile of layers with ambitions. Four principles decide whether yours scales. Read the page, then answer."
    starter: ""
    language: none
    validator:
      assertions: []
    cookbook: docs/asset-structure/asset-structure-principles/why-necessary.md
    xp: 160
    reward: Foundry Charter
    world_target: /City/AssetFoundry
    recipes: [Asset, Composition]
    questions:
      - prompt: What does a well-designed asset structure exist to make possible?
        choices:
          - Reuse of persistent data, with conventions that keep content flowing between collaborators
          - One universal layout every pipeline is expected to adopt
          - A guarantee that any layer opens without an asset resolver
        answer: 0
        explanation: Asset structure maps content through production and lowers the friction of working together on it.
      - prompt: Which principle governs the cost of resolving, opening, and composing an asset's layers?
        choices: [Performance, Legibility, Navigability]
        answer: 0
        explanation: Read and write speed is the performance question, which is why reference/payload pairs and instancing appear under it.
      - prompt: Why does the page refuse to name one best asset structure?
        choices:
          - Clients, domain, and whether OpenUSD is the deliverable all change the right answer
          - The composition engine resolves each layout differently
          - Naming conventions cannot be shared between file formats
        answer: 0
        explanation: A structure is tailored to its clients and collaborators; an intermediate representation has more slack than a delivered asset.

  - id: f6_interface_brief
    title: Read What an Asset Interface Is
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Principles Ward
    kind: room
    prerequisites: [f6_why_structure]
    level_required: 12
    exam_tasks: [identify_asset_interface, explain_entry_points]
    stats: {lore: 4, insight: 3}
    brief: "SYSTEM: Every asset has one root layer that downstream users are meant to touch. That layer is the interface, and a few named descendants are part of the deal. Read the page, then answer."
    starter: ""
    language: none
    validator:
      assertions: []
    cookbook: docs/asset-structure/asset-structure-principles/asset-interface-pt1.md
    xp: 160
    reward: Interface Notice
    world_target: /City/AssetFoundry
    recipes: [Asset, Default Prim]
    questions:
      - prompt: Which layer of an asset is the asset interface layer?
        choices:
          - Its root layer, structured as the primary means of interacting with the asset
          - The strongest sublayer inside the asset's layer stack
          - Whichever layer holds the most geometry
        answer: 0
        explanation: The root layer is the foundation an asset is opened or referenced through.
      - prompt: How does an asset advertise its single entry point prim?
        choices:
          - Through the root layer's defaultPrim metadata, which composition respects when referencing
          - Through a prim named World, which composition treats specially
          - Through a relationship authored on the pseudo-root
        answer: 0
        explanation: defaultPrim is the metadata the composition engine reads when a reference omits a prim path.
      - prompt: Besides the root layer, what else counts as part of an asset's interface?
        choices:
          - Descendant prims maintainers designate as stable for downstream overrides
          - Every prim in the asset, since a reference carries all of them
          - Only prims that carry kind metadata
        answer: 0
        explanation: Materials and subcomponent prims are commonly published as stable override points.

