  - id: f6_assembly_block
    title: Assemble the Skyline Block
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Model Heights
    kind: neighborhood_boss
    prerequisites: [f6_component_house]
    level_required: 14
    exam_tasks: [author_assembly, aggregate_components]
    stats: {craft: 4, insight: 4}
    brief: "SYSTEM: Loose components clog the skyline. An assembly references components. It does not become one."
    starter: |
      from pathlib import Path
      from pxr import Kind, Usd, UsdGeom

      sign = (Path(WORLD_ROOT) / "assets" / "sign.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      block = UsdGeom.Xform.Define(stage, "/City/AssetFoundry/SkylineBlock").GetPrim()
      stage.SetDefaultPrim(block)
      # TODO: Mark SkylineBlock as assembly.
      # TODO: Define SignA beneath it and reference the civic sign asset.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - kind_equals: {path: /City/AssetFoundry/SkylineBlock, value: assembly}
        - has_reference: {path: /City/AssetFoundry/SkylineBlock/SignA, asset: sign.usda}
    cookbook: docs/asset-structure/model-hierarchy/exercise-assemblies.md
    xp: 300
    reward: {opinion_points: 1, achievement: "New achievement! You aggregated a component without stuffing its guts into the block."}
    world_target: /City/AssetFoundry/SkylineBlock
    recipes: [Assembly, Model Hierarchy]
    questions:
      - prompt: What should an assembly typically contain?
        choices:
          - References or payloads to other models
          - Flattened gprims copied from every component
          - Only class prims
        answer: 0
        explanation: Assemblies aggregate models rather than duplicating their geometry.

  - id: f6_street_groups
    title: Group the North and South Lots
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Model Heights
    kind: room
    prerequisites: [f6_assembly_block]
    level_required: 14
    exam_tasks: [author_group_kind, nest_model_hierarchy]
    stats: {lore: 4, craft: 3}
    brief: "SYSTEM: Guild job eleven. An assembly with six naked children is a spreadsheet. Group the lots."
    starter: |
      from pxr import Kind, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
      stage.SetDefaultPrim(world)
      Usd.ModelAPI(world).SetKind(Kind.Tokens.assembly)
      # TODO: Define /World/North and /World/South as group Xforms.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - kind_equals: {path: /World, value: assembly}
        - kind_equals: {path: /World/North, value: group}
        - kind_equals: {path: /World/South, value: group}
    cookbook: docs/asset-structure/model-hierarchy/exercise-groups.md
    xp: 240
    reward: Lot Survey
    world_target: /City/AssetFoundry/SkylineBlock
    recipes: [Group, Model Hierarchy]

  - id: f6_zoning_golem
    title: Reorder the Zoning Golem
    floor: 6
    floor_name: Asset Foundry
    neighborhood: Hierarchy Hall
    kind: floor_boss
    prerequisites: [f6_street_groups]
    level_required: 14
    exam_tasks: [enforce_model_hierarchy, inspect_kinds]
    stats: {lore: 5, resolve: 5, insight: 3}
    brief: "SYSTEM: The Golem stacked a component on an assembly and called it urban planning. Restore group over assembly over component before the inspector arrives."
    starter: |
      from pxr import Kind, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      district = UsdGeom.Xform.Define(stage, "/City/AssetFoundry").GetPrim()
      block = UsdGeom.Xform.Define(stage, "/City/AssetFoundry/SkylineBlock").GetPrim()
      house = UsdGeom.Xform.Define(stage, "/City/AssetFoundry/House").GetPrim()
      # Currently inverted on purpose. Fix the kinds.
      Usd.ModelAPI(district).SetKind(Kind.Tokens.component)
      Usd.ModelAPI(block).SetKind(Kind.Tokens.group)
      Usd.ModelAPI(house).SetKind(Kind.Tokens.assembly)
      # TODO: district=group, SkylineBlock=assembly, House=component.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - kind_equals: {path: /City/AssetFoundry, value: group}
        - kind_equals: {path: /City/AssetFoundry/SkylineBlock, value: assembly}
        - kind_equals: {path: /City/AssetFoundry/House, value: component}
        - prim_exists: /City/AssetFoundry/SkylineBlock
        - prim_exists: /City/AssetFoundry/House
    cookbook: docs/asset-structure/model-hierarchy/model-hierarchy-considerations.md
    xp: 480
    reward:
      opinion_points: 3
      achievement: "Floor clear! The Zoning Golem now recites group, assembly, component in the approved order."
      inventory: {system_peeks: 1}
    world_target: /City/AssetFoundry
    recipes: [Model Hierarchy, Kind]
    questions:
      - prompt: Which kind should organize sibling assemblies in a district?
        choices: [group, component, gprim]
        answer: 0
        explanation: Groups organize models without being leaf components.
      - prompt: Why keep component geometry out of the assembly layer?
        choices:
          - Assemblies aggregate reusable models; copying gprims breaks reuse
          - Components cannot be referenced
          - Kind metadata forbids payloads
        answer: 0
        explanation: Model hierarchy exists so assemblies instance and reference components.
      - prompt: Which API sets a prim's model kind?
        choices: [Usd.ModelAPI.SetKind, UsdGeom.Tokens.kind, Sdf.Layer.SetKind]
        answer: 0
        explanation: Usd.ModelAPI is the supported authoring API for kind.
