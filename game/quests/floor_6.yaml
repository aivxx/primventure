  - id: f6_encapsulate_material
    title: Bring the Roof Material Inside the Asset
    floor: 6
    floor_name: Hierarchy Foundry
    neighborhood: Principles Ward
    kind: room
    prerequisites: [f6_library_entry_brief]
    level_required: 12
    exam_tasks: [encapsulate_dependencies, retarget_relationships]
    stats: {craft: 3, insight: 4}
    brief: "SYSTEM: Guild job. The building references cleanly and arrives grey. Its roof material is parked outside the entry point, so the binding points at a path the reference never brings along. Move the material in."
    starter: |
      from pxr import Usd, UsdGeom, UsdShade

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
      stage.SetDefaultPrim(world)
      building = UsdGeom.Mesh.Define(stage, "/World/large_buildingF").GetPrim()
      roof = UsdShade.Material.Define(stage, "/roof").GetPrim()
      building.CreateRelationship("material:binding").SetTargets([roof.GetPath()])
      # TODO: Move /roof beneath /World with Usd.NamespaceEditor so the binding
      #       travels with the asset: ReparentPrim, then ApplyEdits.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - default_prim: /World
        - traversal_contains: {paths: [/World/roof], excluded: [/roof]}
        - relationship_targets:
            path: /World/large_buildingF.material:binding
            targets: [/World/roof]
    cookbook: docs/asset-structure/asset-structure-principles/encapsulating-your-asset.md
    xp: 220
    reward: Encapsulation Clamp
    world_target: /City/AssetFoundry/Townhouse
    recipes: [Namespace, Encapsulation]

