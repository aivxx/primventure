  - id: f8_extract_mesh
    title: Extract the OBJ Cube Into a Mesh
    floor: 7
    floor_name: Customs Terminal
    neighborhood: Intake Platform
    kind: room
    prerequisites: [f8_mapping_document]
    level_required: 15
    exam_tasks: [extract_geometry, author_mesh]
    stats: {craft: 5, insight: 3}
    brief: "SYSTEM: Guild job. shapes.obj is sitting on the dock. Pull the Cube vertices into a Mesh. usd-core will not open OBJ for you. That is the lesson."
    starter: |
      from pxr import Gf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World")
      stage.SetDefaultPrim(world.GetPrim())
      points = []
      for line in Path(EXCHANGE_OBJ).read_text().splitlines():
          if line.startswith("v "):
              _, x, y, z = line.split()[:4]
              points.append(Gf.Vec3f(float(x), float(y), float(z)))
          if line.startswith("o ") and points:
              break
      cube_points = points[:8]
      # TODO: Define Mesh /World/Cube and set its points to cube_points.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_type: {path: /World/Cube, value: Mesh}
        - default_prim: /World
    cookbook: docs/data-exchange/data-extraction/exercise-extracting-geometry.md
    xp: 240
    reward: Vertex Tongs
    world_target: /City/ExchangeTerminal/ExtractedCube
    recipes: [Gprim, Mesh]

