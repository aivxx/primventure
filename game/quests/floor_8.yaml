        - prim_type: {path: /World/Material_001, value: Material}
        - prim_type: {path: /World/Material_001/Shader, value: Shader}
        - attribute_equals: {path: "/World/Material_001/Shader.info:id", value: UsdPreviewSurface}
        - attribute_equals: {path: "/World/Material_001/Shader.inputs:specularColor", value: [0.5, 0.5, 0.5]}
        - relationship_targets: {path: "/World/Cube.material:binding", targets: [/World/Material_001]}
