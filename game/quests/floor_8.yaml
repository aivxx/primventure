      cube = UsdGeom.Mesh.Define(stage, "/World/Cube")

      # Read off the MTL record shipped beside shapes.obj.
      source_name = "Material.001"
      specular_color = Gf.Vec3f(0.5, 0.5, 0.5)
      material_path = Sdf.Path("/World").AppendChild(Tf.MakeValidIdentifier(source_name))

      # TODO: Define a UsdShade.Material at material_path.
      # TODO: Define a UsdShade.Shader at material_path.AppendChild("Shader") and give it
      #       CreateIdAttr("UsdPreviewSurface"), which authors info:id.
      # TODO: Connect the material's surface output to the shader's surface output.
      # TODO: Author inputs:specularColor on the shader from specular_color.
      # TODO: Bind the material to the cube with UsdShade.MaterialBindingAPI. Bind writes the
