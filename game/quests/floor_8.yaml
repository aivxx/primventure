  - id: f8_customs_engine
    title: Audit the Customs Engine
    floor: 7
    floor_name: Exchange Terminal
    neighborhood: Validation Concourse
    kind: city_boss
    prerequisites: [f8_validate_warden]
    level_required: 16
    exam_tasks: [obj_to_usd_pipeline, validate_stage_contract]
    stats: {insight: 5, resolve: 5, craft: 4}
    brief: "SYSTEM: City boss. Extract the OBJ cube, stamp provenance, pass the contract. The Engine processes data; your feelings remain an unsupported format."
    starter: |
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
      points = []
      for line in Path(EXCHANGE_OBJ).read_text().splitlines():
          if line.startswith("v "):
              _, x, y, z = line.split()[:4]
              points.append(Gf.Vec3f(float(x), float(y), float(z)))
          if len(points) >= 8:
              break
      # TODO: Set default prim, Y-up, centimeters, component kind.
      # TODO: Define /World/Cube mesh points from the first eight OBJ vertices.
      # TODO: Stamp customData sourceFormat="OBJ" on /World.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - default_prim: /World
        - up_axis: Y
        - meters_per_unit: 0.01
        - kind_equals: {path: /World, value: component}
        - prim_type: {path: /World/Cube, value: Mesh}
        - metadata_equals: {path: /World, key: customData, field: sourceFormat, value: OBJ}
    cookbook: docs/data-exchange/asset-validation/exercise-asset-validation-testing.md
    xp: 420
    reward: {opinion_points: 2, achievement: "Pipeline green. OBJ entered the Composition with papers."}
    world_target: /City/ExchangeTerminal/CustomsCube
    recipes: [Data Exchange]
    questions:
      - prompt: Which checks belong in a usdchecker-style intake test?
        choices:
          - Default prim, up axis, units, and required prims
          - Only polygon count
          - Only file size
        answer: 0
        explanation: Asset validation turns pipeline contracts into enforceable checks.
      - prompt: Where should source-format provenance live after an OBJ import?
        choices: [customData on the asset interface, The filename only, A sidecar PDF]
        answer: 0
        explanation: Authored customData travels with the USD asset.
