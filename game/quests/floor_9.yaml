  - id: f9_null_monarch
    title: "Null Monarch: Capstone Stage Authoring"
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Root Throne
    kind: floor_boss
    prerequisites: [f9_archivist_prime]
    level_required: 20
    exam_tasks: ["1.1", "2.x", "7.2", capstone_stage_authoring]
    stats: {craft: 6, insight: 6, resolve: 6}
    brief: "SYSTEM: The Null Monarch leaves matter standing after meaning disappears. Reassert the city contract, instance a sign, and keep Y-up. Last fight. No C++. No mercy for missing default prims."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/CrownDistrict/RootThrone with type Xform.
      # 2. Author a reference on /City/CrownDistrict/RootThrone to asset sign.usda.
      # 3. Set /City/CrownDistrict/RootThrone instanceable to True.
      # 4. Set the stage default prim to /City.
      # 5. Set stage up axis to Y.
      # 6. Set stage startTimeCode to 1.
      # 7. Set stage endTimeCode to 48.
      # 8. Set /City model kind to group.
      # 9. Set /City/CrownDistrict/RootThrone metadata documentation to 'Null Monarch: Capstone Stage Authoring cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/CrownDistrict/RootThrone, value: Xform}
      - has_reference: {path: /City/CrownDistrict/RootThrone, asset: sign.usda}
      - instanceable: {path: /City/CrownDistrict/RootThrone, value: true}
      - {default_prim: /City}
      - {up_axis: Y}
      - {start_time: 1}
      - {end_time: 48}
      - kind_equals: {path: /City, value: group}
      - metadata_equals: {path: /City/CrownDistrict/RootThrone, key: documentation, value: 'Null Monarch: Capstone Stage Authoring
            cleared.'}
    cookbook: docs/asset-structure/asset-structure-principles/index.md
    xp: 800
    reward:
      opinion_points: 5
      achievement: "Colosseum clear. Contestant USD-01 remains underqualified and employed."
      inventory: {prim_censuses: 2}
    world_target: /City
    recipes: [Default Prim, Instancing, Kind]
    questions:
      - prompt: Which of these is out of scope for a usd-core certification crawl?
        choices:
          - Compiling a custom C++ file-format plugin in this process
          - Authoring a default prim
          - Inspecting a prim stack
        answer: 0
        explanation: Plugin compilation needs a full USD build environment.
