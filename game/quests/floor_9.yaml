  - id: f9_archivist_prime
    title: Answer Archivist Prime
    floor: 9
    floor_name: Recap Colosseum
    neighborhood: Certification Archive
    kind: city_boss
    prerequisites: [f9_hydra_brief]
    level_required: 19
    exam_tasks: ["2.1", "3.1", "8.x", recap_mcq]
    stats: {lore: 6, insight: 6}
    brief: "SYSTEM: Archivist Prime permits no memorized incantations. Original questions. If you copy a dump, the crowd will know."
    starter: |
      from pxr import Usd

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      archive = stage.DefinePrim("/City/CrownDistrict/CertificationArchive", "Scope")
      archive.SetDocumentation("Composition knowledge verified.")
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_type: {path: /City/CrownDistrict/CertificationArchive, value: Scope}
        - metadata_equals: {path: /City/CrownDistrict/CertificationArchive, key: documentation, value: "Composition knowledge verified."}
    cookbook: docs/creating-composition-arcs/strength-ordering/what-is-liverps.md
    xp: 400
    reward: {opinion_points: 2, achievement: "Archive sealed. Your opinions have been indexed against the study guide, not a braindump."}
    world_target: /City/CrownDistrict/CertificationArchive
    recipes: [Composition, LIVERPS Strength Ordering]
    questions:
      - prompt: In LIVRPS, which pair is ordered strongest then weaker?
        choices:
          - Local opinions, then inherits
          - Specializes, then local
          - Payloads, then variant sets
        answer: 0
        explanation: Local is strongest; inherits are next.
      - prompt: A referenced asset has no default prim and you omit primPath. What happens?
        choices:
          - The reference cannot target a prim automatically
          - USD invents /World
          - The strongest sublayer is referenced
        answer: 0
        explanation: External references without a prim path require a default prim.
      - prompt: Why is TfDebug a poor substitute for GetPropertyStack while studying composition?
        choices:
          - TfDebug traces runtime diagnostics; it does not list authored opinion strength
          - TfDebug deletes weaker layers
          - TfDebug is the same API
        answer: 0
        explanation: Debug symbols and composition inspection solve different problems.
      - prompt: "Custom Kind tokens in production usually require:"
        choices:
          - Kind plugin configuration in a full USD install, not just SetKind on a random string
          - Only a displayName
          - Flattening
        answer: 0
        explanation: Extending Kind is a customization workflow beyond usd-core defaults.

  - id: f9_null_monarch
    title: Reauthor the Null Monarch
    floor: 9
    floor_name: Recap Colosseum
    neighborhood: Root Throne
    kind: floor_boss
    prerequisites: [f9_archivist_prime]
    level_required: 20
    exam_tasks: ["1.1", "2.x", "7.2", capstone_stage_authoring]
    stats: {craft: 6, insight: 6, resolve: 6}
    brief: "SYSTEM: The Null Monarch deletes meaning, not matter. Reassert the city contract, instance a sign, and keep Y-up. Last fight. No C++. No mercy for missing default prims."
    starter: |
      from pathlib import Path
      from pxr import Kind, Usd, UsdGeom

      sign = (Path(WORLD_ROOT) / "assets" / "sign.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      city = UsdGeom.Xform.Define(stage, "/City").GetPrim()
      throne = UsdGeom.Xform.Define(stage, "/City/CrownDistrict/RootThrone").GetPrim()
      # TODO: default prim /City, Y-up, start 1, end 48.
      # TODO: Reference the civic sign on the throne and set instanceable True.
      # TODO: Mark /City kind group.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_exists: /City/CrownDistrict/RootThrone
        - has_reference: {path: /City/CrownDistrict/RootThrone, asset: sign.usda}
        - instanceable: {path: /City/CrownDistrict/RootThrone, value: true}
        - default_prim: /City
        - up_axis: Y
        - start_time: 1
        - end_time: 48
        - kind_equals: {path: /City, value: group}
    cookbook: docs/asset-structure/asset-structure-principles/index.md
    xp: 800
    reward:
      opinion_points: 5
      achievement: "Colosseum clear. Contestant USD-01 remains underqualified and employed."
      inventory: {system_peeks: 2}
    world_target: /City
    recipes: [Default Prim, Instancing, Kind]
    questions:
      - prompt: Which of these is out of scope for a usd-core certification crawl?
        choices:
          - Compiling a custom C++ file-format plugin in this process
          - Authoring a default prim
          - Inspecting a prim stack
        answer: 0
        explanation: Plugin compilation needs a full USD build environment.
