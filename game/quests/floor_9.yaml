  - id: f9_portfolio_gate
    title: Compose the Portfolio Asset at the Gate
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Portfolio Promenade
    kind: room
    prerequisites: [f7_mirror_forge, f8_customs_engine]
    level_required: 18
    exam_tasks: ["7.2", compose_portfolio, preserve_contracts]
    stats: {craft: 5, lore: 5}
    brief: "SYSTEM: Both branches are clear. Present a payload of cargo and a pipeline note. Tourists will be refunded in sarcasm."
    starter: |
      from pathlib import Path
      from pxr import Usd, UsdGeom

      cargo = (Path(WORLD_ROOT) / "assets" / "cargo.usda").as_posix()
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      crown = UsdGeom.Xform.Define(stage, "/City/CrownDistrict").GetPrim()
      # TODO: Payload cargo.usda and set documentation to "Portfolio capstone district."
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - has_payload: {path: /City/CrownDistrict, asset: cargo.usda}
        - metadata_equals: {path: /City/CrownDistrict, key: documentation, value: "Portfolio capstone district."}
    cookbook: docs/asset-structure/asset-structure-principles/your-first-asset.md
    xp: 280
    reward: Portfolio Gate Writ
    world_target: /City/CrownDistrict
    recipes: [Payload, Asset]

  - id: f9_edit_target_duel
    title: Duel on the Weaker Edit Target
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Debug Gauntlet
    kind: room
    prerequisites: [f9_portfolio_gate]
    level_required: 18
    exam_tasks: ["8.1", set_edit_target, inspect_property_stack]
    stats: {insight: 5, craft: 3}
    brief: "SYSTEM: Root is strongest. The notes layer is weaker. Set the edit target before you author or you will redecorate the wrong file and call it debugging."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      world = stage.DefinePrim("/World", "Xform")
      notes = Sdf.Layer.CreateNew(str(Path(STAGE_PATH).parent / "notes.usda"))
      stage.GetRootLayer().subLayerPaths.append("notes.usda")
      stage.SetEditTarget(notes)
      # TODO: Author displayName "Authored on notes" on /World while notes is the edit target.
      stage.GetRootLayer().Save()
      notes.Save()
    language: python
    validator:
      assertions:
        - metadata_equals: {path: /World, key: displayName, value: "Authored on notes"}
        - sublayer_order: {layers: [notes.usda]}
    cookbook: docs/creating-composition-arcs/prim-composition.md
    xp: 260
    reward: Edit Target Glove
    world_target: /City/CrownDistrict
    recipes: [Layer Stack, Opinions]

  - id: f9_stack_inspector
    title: "Stack Inspector: Read the Property Stack"
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Debug Gauntlet
    kind: neighborhood_boss
    prerequisites: [f9_edit_target_duel]
    level_required: 18
    exam_tasks: ["8.2", debug_value_resolution, inspect_prim_stack]
    stats: {insight: 6, resolve: 4}
    brief: "SYSTEM: A reference says 1. You will say 4. GetPropertyStack illuminates the evidence. Leave the weaker arc alive."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      fixture = Usd.Stage.CreateNew(str(Path(STAGE_PATH).parent / "weaker.usda"))
      source = fixture.DefinePrim("/Probe", "Xform")
      source.CreateAttribute("signal", Sdf.ValueTypeNames.Int).Set(1)
      fixture.SetDefaultPrim(source)
      fixture.GetRootLayer().Save()

      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /World/Probe with type Xform.
      # 2. Set /World/Probe.signal to 4.
      # 3. Make submission.usd the strongest source for /World/Probe.signal.
      # 4. Author a reference on /World/Probe to asset weaker.usda.
      # 5. Compose /World/Probe from at least 2 prim specs.
      # 6. Set /World/Probe metadata documentation to 'Stack Inspector: Read the Property Stack cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /World/Probe, value: Xform}
      - attribute_equals: {path: /World/Probe.signal, value: 4}
      - attribute_source: {path: /World/Probe.signal, layer: submission.usd}
      - has_reference: {path: /World/Probe, asset: weaker.usda}
      - prim_stack: {path: /World/Probe, min: 2}
      - metadata_equals: {path: /World/Probe, key: documentation, value: 'Stack Inspector: Read the Property Stack
            cleared.'}
    cookbook: docs/beyond-basics/value-resolution.md
    xp: 300
    reward: {opinion_points: 1, achievement: "New achievement! You inspected the stack and still wrote the stronger opinion yourself."}
    world_target: /City/CrownDistrict
    recipes: [Value Resolution, LIVERPS Strength Ordering]
    questions:
      - prompt: What does GetPropertyStack reveal about a resolved property?
        choices:
          - It lists the authored sources in strength order for that property
          - It flattens the stage
          - It compiles a plugin
        answer: 0
        explanation: The property stack is a debug view of competing opinions.

  - id: f9_layer_offset_raid
    title: Shift the Clip With a Layer Offset
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Debug Gauntlet
    kind: room
    prerequisites: [f9_stack_inspector]
    level_required: 18
    exam_tasks: ["8.3", author_layer_offset]
    stats: {insight: 5, craft: 4}
    brief: "SYSTEM: The clip starts at frame 0. The shot wants it at 10. Use LayerOffset and leave sample baking to contestants who enjoy unpaid overtime."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      folder = Path(STAGE_PATH).parent
      clip = Usd.Stage.CreateNew(str(folder / "clip.usda"))
      prim = clip.DefinePrim("/Clip", "Xform")
      attr = prim.CreateAttribute("amp", Sdf.ValueTypeNames.Int)
      attr.Set(1, 0)
      attr.Set(2, 5)
      clip.SetDefaultPrim(prim)
      clip.GetRootLayer().Save()

      stage = Usd.Stage.CreateNew(STAGE_PATH)
      dest = stage.DefinePrim("/World/Clip", "Xform")
      # TODO: Add a reference to clip.usda with Sdf.LayerOffset(offset=10).
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - has_reference: {path: /World/Clip, asset: clip.usda}
        - layer_offset: {path: /World/Clip, offset: 10}
    cookbook: docs/beyond-basics/value-resolution.md
    xp: 280
    reward: Offset Wrench
    world_target: /City/CrownDistrict
    recipes: [Layer Offset, Animated Value]

  - id: f9_flatten_delivery
    title: Flatten the Stage for Delivery
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Debug Gauntlet
    kind: room
    prerequisites: [f9_layer_offset_raid]
    level_required: 18
    exam_tasks: ["7.2", flatten_stage, deliver_package]
    stats: {lore: 5, craft: 4}
    brief: "SYSTEM: Delivery wants one file. Flatten the composed cube into a package. The workstream stays behind with the production crew."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      folder = Path(STAGE_PATH).parent
      part = Usd.Stage.CreateNew(str(folder / "part.usda"))
      part.DefinePrim("/World", "Xform")
      part.DefinePrim("/World/Cube", "Cube")
      part.GetRootLayer().Save()

      composed = Usd.Stage.CreateInMemory()
      composed.GetRootLayer().subLayerPaths.append(str(folder / "part.usda"))
      # TODO: Flatten composed (returns an Sdf.Layer) and Export it to STAGE_PATH.
    language: python
    validator:
      assertions:
        - prim_type: {path: /World/Cube, value: Cube}
        - sublayer_order: {layers: []}
    cookbook: docs/beyond-basics/value-resolution.md
    xp: 260
    reward: Delivery Flatten
    world_target: /City/CrownDistrict
    recipes: [Flatten, Layer]

