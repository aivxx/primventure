  - id: f9_hydra_brief
    title: "Hydra Herald: Name the Hydra Architecture"
    floor: 9
    floor_name: Certification Colosseum
    neighborhood: Customizing Colosseum
    kind: neighborhood_boss
    prerequisites: [f9_customizing_raid]
    level_required: 19
    exam_tasks: ["6.4", hydra_architecture]
    stats: {lore: 6, insight: 4}
    brief: "SYSTEM: Hydra is the bridge between scene data and rendering. Name the parts. HdStorm ships; your custom delegate remains stranded several toolchains above this basement."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/CrownDistrict/HydraMarker with type Scope.
      # 2. Set /City/CrownDistrict/HydraMarker.architecture to 'scene delegate -> render index -> render delegate'.
      # 3. Set /City/CrownDistrict/HydraMarker metadata documentation to 'Hydra Herald: Name the Hydra Architecture cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/CrownDistrict/HydraMarker, value: Scope}
      - attribute_equals: {path: /City/CrownDistrict/HydraMarker.architecture, value: scene delegate -> render index -> render delegate}
      - metadata_equals: {path: /City/CrownDistrict/HydraMarker, key: documentation, value: 'Hydra Herald: Name the Hydra Architecture
            cleared.'}
    cookbook: docs/beyond-basics/hydra.md
    xp: 280
    reward: {opinion_points: 1, achievement: "New achievement! You described Hydra without claiming to have written HdStorm."}
    world_target: /City/CrownDistrict
    recipes: [Hydra, Rendering]
    questions:
      - prompt: Which three parts make up Hydra's core loop?
        choices:
          - Scene delegate, render index, render delegate
          - Sublayer, reference, payload
          - Kind, assetInfo, metersPerUnit
        answer: 0
        explanation: Hydra pulls scene data through a delegate, indexes it, and renders via a delegate plugin.
      - prompt: What is HdStorm in a standard OpenUSD distribution?
        choices:
          - The included real-time render delegate used by usdview
          - A required Asset Resolver
          - A Kind token
        answer: 0
        explanation: HdStorm is the shipped GL/Metal/Vulkan delegate.

