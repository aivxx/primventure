floor: 0
floor_name: Prim Threshold
quests:
  - id: f0_first_prim
    title: Define the City's First Prim
    floor: 0
    floor_name: Prim Threshold
    neighborhood: Arrival Hall
    kind: room
    prerequisites: []
    level_required: 1
    exam_tasks: [create_prim, inspect_stage]
    stats: {craft: 1, insight: 1}
    brief: "SYSTEM: The city is blank. Give it one address."
    starter: |
      from pxr import Usd
      stage = Usd.Stage.CreateNew(STAGE_PATH)
      # Define /City as a typed Xform. The save below writes it to disk.
    language: python
    validator:
      assertions:
        - prim_exists: /City
        - prim_type: {path: /City, value: Xform}
    cookbook: docs/stage-setting/prims.md
    xp: 50
    reward: Copper Scene Key
    world_target: /City
    recipes: [Usd.Stage.CreateNew, Usd.Stage.DefinePrim, Sdf.Layer.Save]

  - id: f0_nameplate
    title: Author the City Name Attribute
    floor: 0
    floor_name: Prim Threshold
    neighborhood: Arrival Hall
    kind: room
    prerequisites: [f0_first_prim]
    level_required: 1
    exam_tasks: [author_attribute]
    stats: {craft: 1, lore: 1}
    brief: "SYSTEM: A nameless city cannot persist. Author its identity."
    starter: |
      from pxr import Sdf, Usd
      stage = Usd.Stage.Open(STAGE_PATH)
      city = stage.GetPrimAtPath("/City")
      # Create a string attribute named cityName on /City and set it to "Primventure".
      # Sdf.ValueTypeNames.String is the type; CreateAttribute returns the attribute,
      # and Set() writes the value.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - attribute_equals: {path: /City.cityName, value: Primventure}
    cookbook: docs/stage-setting/properties/attributes.md
    xp: 60
    reward: Archivist's Stylus
    world_target: /City
    recipes: [Usd.Prim.CreateAttribute, Usd.Attribute.Set]

  - id: f0_gatekeeper
    title: "Gatekeeper of the Root: Default Prim and Up Axis"
    floor: 0
    floor_name: Prim Threshold
    neighborhood: Departure Gate
    kind: floor_boss
    prerequisites: [f0_nameplate]
    level_required: 2
    exam_tasks: [set_default_prim, configure_stage]
    stats: {resolve: 2, insight: 1}
    brief: "SYSTEM: The Gatekeeper accepts only a stage with a clear entrance."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City with type Xform.
      # 2. Set the stage default prim to /City.
      # 3. Set stage up axis to Y.
      # 4. Keep /City.cityName set to 'Primventure'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City, value: Xform}
      - {default_prim: /City}
      - {up_axis: Y}
      - attribute_equals: {path: /City.cityName, value: Primventure}
    cookbook: docs/stage-setting/stage.md
    xp: 100
    reward: Threshold Transit Pass
    world_target: /
    recipes: [Usd.Stage.SetDefaultPrim, UsdGeom.SetStageUpAxis]
