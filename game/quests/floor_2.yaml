floor: 2
floor_name: Schema Borough
quests:
  - id: f2_market_stall
    title: Build the Market Stall From a Typed Schema
    floor: 2
    floor_name: Schema Borough
    neighborhood: Schema Square
    kind: room
    prerequisites: [f1_clockwork_crossing]
    level_required: 4
    exam_tasks: [use_usdgeom_schema, author_extent]
    stats: {craft: 2, insight: 2}
    brief: "SYSTEM: Schema Borough trades only in typed goods. Build to schema."
    starter: |
      from pxr import Usd, UsdGeom
      stage = Usd.Stage.Open(STAGE_PATH)
      # Define a Cube at /City/BlueprintBorough/Stall and set size to 2.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_type: {path: /City/BlueprintBorough/Stall, value: Cube}
        - attribute_equals: {path: /City/BlueprintBorough/Stall.size, value: 2.0}
    cookbook: docs/scene-description-blueprints/index.md
    xp: 120
    reward: Schema Mason's Rule
    world_target: /City/BlueprintBorough/Stall
    recipes: [UsdGeom.Cube.Define, UsdGeom.Cube.CreateSizeAttr]

  - id: f2_street_lamp
    title: Light Lumen Row With a UsdLux Sphere Light
    floor: 2
    floor_name: Schema Borough
    neighborhood: Lumen Row
    kind: room
    prerequisites: [f2_market_stall]
    level_required: 4
    exam_tasks: [define_typed_prim, author_namespaced_input]
    stats: {craft: 2, insight: 2}
    brief: "SYSTEM: Lumen Row is dark and the Borough trades only in typed goods. Author a light that says so."
    starter: |
      from pxr import Usd, UsdLux
      stage = Usd.Stage.Open(STAGE_PATH)
      # Define a SphereLight at /City/BlueprintBorough/StreetLamp,
      # then set its intensity to 750 through the schema accessor.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_type: {path: /City/BlueprintBorough/StreetLamp, value: SphereLight}
        - attribute_equals: {path: "/City/BlueprintBorough/StreetLamp.inputs:intensity", value: 750.0}
    cookbook: docs/scene-description-blueprints/lights.md
    xp: 130
    reward: Lumen Vial
    world_target: /City/BlueprintBorough/StreetLamp
    recipes: [UsdLux.SphereLight.Define, UsdLux.LightAPI.GetIntensityAttr]

  - id: f2_relationship_bridge
    title: "Bridge Warden: Relationships and Targets"
    floor: 2
    floor_name: Schema Borough
    neighborhood: Binding Canal
    kind: neighborhood_boss
    prerequisites: [f2_street_lamp]
    level_required: 5
    exam_tasks: [create_relationship, target_prim]
    stats: {insight: 2, resolve: 2}
    brief: "SYSTEM: The bridge exists, but knows no destination. Author the connection."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/BlueprintBorough/Bridge with type Xform.
      # 2. Create /City/BlueprintBorough/Bridge.destination targeting exactly ['/City/BlueprintBorough/Stall'].
      # 3. Set /City/BlueprintBorough/Bridge metadata documentation to 'Bridge Warden: Relationships and Targets cleared.'.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/BlueprintBorough/Bridge, value: Xform}
      - relationship_targets:
          path: /City/BlueprintBorough/Bridge.destination
          targets: [/City/BlueprintBorough/Stall]
      - metadata_equals: {path: /City/BlueprintBorough/Bridge, key: documentation, value: 'Bridge Warden: Relationships and Targets
            cleared.'}
    cookbook: docs/stage-setting/properties/relationships.md
    xp: 150
    reward: Silver Binding Cable
    world_target: /City/BlueprintBorough/Bridge
    recipes: [Usd.Prim.CreateRelationship, Usd.Relationship.SetTargets]

  - id: f2_schema_warden
    title: "Schema Warden: USDA Text and API Schemas"
    floor: 2
    floor_name: Schema Borough
    neighborhood: Warden Foundry
    kind: floor_boss
    prerequisites: [f2_relationship_bridge]
    level_required: 6
    exam_tasks: [author_usda, apply_api_schema]
    stats: {craft: 3, resolve: 2}
    brief: "SYSTEM: The Warden rejects vague forms. Declare type, purpose, and visibility."
    starter: |
      from pathlib import Path
      from pxr import Gf, Kind, Sdf, Usd, UsdGeom, UsdLux, UsdShade

      stage = Usd.Stage.Open(STAGE_PATH)
      # This boss opens your accumulated city. Author every graded opinion below.
      # 1. Define /City/BlueprintBorough/WardenVault with type Scope.
      # 2. Set /City/BlueprintBorough/WardenVault.purpose to 'guide'.
      # 3. Set /City/BlueprintBorough/WardenVault metadata documentation to 'Schema Warden: USDA Text and API Schemas cleared.'.
      # 4. Set stage up axis to Y.
      # 5. Set stage startTimeCode to 1.
      # 6. Set stage endTimeCode to 48.
      # 7. Keep /City/BlueprintBorough/Bridge.destination targeting /City/BlueprintBorough/Stall.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
      - prim_type: {path: /City/BlueprintBorough/WardenVault, value: Scope}
      - attribute_equals: {path: /City/BlueprintBorough/WardenVault.purpose, value: guide}
      - metadata_equals: {path: /City/BlueprintBorough/WardenVault, key: documentation, value: 'Schema Warden: USDA Text and API
            Schemas cleared.'}
      - {up_axis: Y}
      - {start_time: 1}
      - {end_time: 48}
      - relationship_targets:
          path: /City/BlueprintBorough/Bridge.destination
          targets: [/City/BlueprintBorough/Stall]
    cookbook: docs/stage-setting/usd-file-formats.md
    xp: 200
    reward: Blueprint Sigil
    world_target: /City/BlueprintBorough/WardenVault
    recipes: [USDA def specifier, typed schema declaration]
