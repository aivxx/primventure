        answer: 0
        explanation: GetVariantEditContext authors opinions inside the selected variant.
      - prompt: Can separate references to one asset choose different variants?
        choices: ["Yes", "No"]
        answer: 0
        explanation: Variant selections can be authored on each referencing prim.

