  - id: f3_layer_registry
    title: Register the District Layer
    floor: 3
    floor_name: Composition Quarter
    neighborhood: Layer Lane
    kind: room
    prerequisites: [f2_schema_warden]
    level_required: 6
    exam_tasks: [create_layer, add_sublayer, inspect_layer_stack]
    stats: {craft: 2, lore: 2}
    brief: "SYSTEM: City Hall rejects monolithic files. Give the Quarter a weaker, inspectable voice."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      stage = Usd.Stage.Open(STAGE_PATH)
      support_path = Path(STAGE_PATH).parent / "district_registry.usda"
      support = Usd.Stage.CreateNew(str(support_path))
      district = support.DefinePrim("/City/CompositionQuarter", "Xform")
      district.CreateAttribute("districtStatus", Sdf.ValueTypeNames.String).Set("registered")
      support.GetRootLayer().Save()

      # TODO: Add district_registry.usda to the root layer's subLayerPaths.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - prim_exists: /City/CompositionQuarter
        - attribute_equals: {path: /City/CompositionQuarter.districtStatus, value: registered}
        - sublayer_order: {layers: [district_registry.usda]}
    cookbook: docs/composition-basics/layers.md
    xp: 120
    reward: Layer Clerk's Ribbon
    world_target: /City/CompositionQuarter
    recipes: [Layer, Layer Stack, Sublayer]

  - id: f3_layer_stack_boss
    title: Audit the Two-Faced Permit Desk
    floor: 3
    floor_name: Composition Quarter
    neighborhood: Layer Lane
    kind: neighborhood_boss
    prerequisites: [f3_layer_registry]
    level_required: 6
    exam_tasks: [order_sublayers, resolve_local_opinions]
    stats: {insight: 2, resolve: 3}
    brief: "SYSTEM: Two departments issued opposite permits. Put the intended opinion on top. Bureaucracy is combat with stationery."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      stage = Usd.Stage.Open(STAGE_PATH)
      folder = Path(STAGE_PATH).parent
      for filename, status in [("safety.usda", "closed"), ("commerce.usda", "open")]:
          source = Usd.Stage.CreateNew(str(folder / filename))
          desk = source.DefinePrim("/City/CompositionQuarter/PermitDesk", "Xform")
          desk.CreateAttribute("permitStatus", Sdf.ValueTypeNames.String).Set(status)
          source.GetRootLayer().Save()

      # Wrong: the first sublayer is strongest, so Safety currently wins.
      stage.GetRootLayer().subLayerPaths = ["safety.usda", "commerce.usda"]
      # TODO: Reorder the sublayers so Commerce's "open" opinion wins.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - attribute_equals: {path: /City/CompositionQuarter/PermitDesk.permitStatus, value: open}
        - attribute_source: {path: /City/CompositionQuarter/PermitDesk.permitStatus, layer: commerce.usda}
        - sublayer_order: {layers: [commerce.usda, safety.usda]}
    cookbook: docs/composition-basics/layers.md
    xp: 180
    reward: {opinion_points: 1, achievement: "New achievement! You won an argument by moving one string in a list."}
    world_target: /City/CompositionQuarter/PermitDesk
    recipes: [Opinions, Direct Opinion, Value Resolution]
    questions:
      - prompt: In a root layer's subLayerPaths, which listed layer is strongest?
        choices: [The first layer, The last layer, Alphabetical order, The newest file]
        answer: 0
        explanation: Sublayers are ordered strongest to weakest.
      - prompt: Does changing sublayer order modify either source layer?
        choices: ["Yes", "No"]
        answer: 1
        explanation: The root layer changes composition without rewriting either source.

