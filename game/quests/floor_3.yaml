  - id: f3_opinion_colossus
    title: Survive the LIVRPS Labyrinth
    floor: 3
    floor_name: Composition Quarter
    neighborhood: LIVRPS Plaza
    kind: floor_boss
    prerequisites: [f3_city_block]
    level_required: 8
    exam_tasks: [resolve_liverps, inspect_prim_and_property_stacks, debug_composition]
    stats: {insight: 5, resolve: 5, craft: 2}
    brief: "SYSTEM: Six arcs enter. One opinion leaves. Author the strongest value and prove you know why it wins."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      stage = Usd.Stage.Open(STAGE_PATH)
      folder = Path(STAGE_PATH).parent

      reference_stage = Usd.Stage.CreateNew(str(folder / "reference_threat.usda"))
      reference_root = reference_stage.DefinePrim("/ThreatSource", "Xform")
      reference_root.CreateAttribute("threatLevel", Sdf.ValueTypeNames.Int).Set(40)
      reference_stage.SetDefaultPrim(reference_root)
      reference_stage.GetRootLayer().Save()

      payload_stage = Usd.Stage.CreateNew(str(folder / "payload_threat.usda"))
      payload_root = payload_stage.DefinePrim("/PayloadSource", "Xform")
      payload_root.CreateAttribute("threatLevel", Sdf.ValueTypeNames.Int).Set(30)
      payload_stage.SetDefaultPrim(payload_root)
      payload_stage.GetRootLayer().Save()

      fallback = stage.CreateClassPrim("/City/CompositionQuarter/_FallbackThreat")
      fallback.CreateAttribute("threatLevel", Sdf.ValueTypeNames.Int).Set(10)
      inherited = stage.CreateClassPrim("/City/CompositionQuarter/_InheritedThreat")
      inherited.CreateAttribute("threatLevel", Sdf.ValueTypeNames.Int).Set(20)

      boss = stage.DefinePrim("/City/CompositionQuarter/OpinionColossus", "Xform")
      boss.GetSpecializes().AddSpecialize(fallback.GetPath())
      boss.GetPayloads().AddPayload("payload_threat.usda")
      boss.GetReferences().AddReference("reference_threat.usda")
      boss.GetInherits().AddInherit(inherited.GetPath())

      modes = boss.GetVariantSets().AddVariantSet("threatMode")
      for name, value in [("calm", 60), ("enraged", 80)]:
          modes.AddVariant(name)
          modes.SetVariantSelection(name)
          with modes.GetVariantEditContext():
              boss.CreateAttribute("threatLevel", Sdf.ValueTypeNames.Int).Set(value)
      modes.SetVariantSelection("enraged")

      # TODO: Author a direct local threatLevel of 100 on OpinionColossus.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - attribute_equals: {path: /City/CompositionQuarter/OpinionColossus.threatLevel, value: 100}
        - attribute_source: {path: /City/CompositionQuarter/OpinionColossus.threatLevel, layer: submission.usd}
        - has_inherit: {path: /City/CompositionQuarter/OpinionColossus}
        - has_variant_set:
            path: /City/CompositionQuarter/OpinionColossus
            name: threatMode
            variants: [calm, enraged]
            selection: enraged
        - has_reference: {path: /City/CompositionQuarter/OpinionColossus, asset: reference_threat.usda}
        - has_payload: {path: /City/CompositionQuarter/OpinionColossus, asset: payload_threat.usda}
        - has_specializes: {path: /City/CompositionQuarter/OpinionColossus}
        - prim_stack: {path: /City/CompositionQuarter/OpinionColossus, min: 5}
    cookbook: docs/composition-basics/strength-ordering.md
    xp: 450
    reward:
      opinion_points: 3
      achievement: "Floor clear! You survived LIVRPS. The weaker opinions request a recount."
      inventory: {system_peeks: 1}
    world_target: /City/CompositionQuarter/OpinionColossus
    recipes: [LIVERPS Strength Ordering, Composition, Index]
    questions:
      - prompt: Choose LIVRPS from strongest to weakest.
        choices:
          - Local, Inherits, Variant sets, References, Payloads, Specializes
          - Local, Variant sets, Inherits, Payloads, References, Specializes
          - Specializes, Payloads, References, Variant sets, Inherits, Local
        answer: 0
        explanation: LIVRPS orders Local, Inherits, Variant sets, References, Payloads, Specializes.
      - prompt: A local value and a selected variant both author the same attribute. Which wins?
        choices: [The selected variant, The local value, The newest opinion]
        answer: 1
        explanation: Local opinions are stronger than variant opinions.
      - prompt: Why inspect a property stack while debugging?
        choices:
          - It reveals the ordered authored sources contributing to that property
          - It permanently flattens the stage
          - It changes the edit target
        answer: 0
        explanation: The property stack shows where competing opinions originate and their strength order.

