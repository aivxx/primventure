  - id: f3_over_case
    title: Appeal Without Vandalism
    floor: 3
    floor_name: Composition Quarter
    neighborhood: Specifier Court
    kind: room
    prerequisites: [f3_def_docket]
    level_required: 7
    exam_tasks: [author_over, inspect_prim_stack]
    stats: {craft: 2, resolve: 2}
    brief: "SYSTEM: The billboard is defined in evidence. Change its size locally without touching the exhibit."
    starter: |
      from pathlib import Path
      from pxr import Sdf, Usd

      stage = Usd.Stage.Open(STAGE_PATH)
      base = Usd.Stage.CreateNew(str(Path(STAGE_PATH).parent / "billboard_base.usda"))
      billboard = base.DefinePrim("/City/CompositionQuarter/Billboard", "Cube")
      billboard.CreateAttribute("size", Sdf.ValueTypeNames.Double).Set(2.0)
      base.GetRootLayer().Save()
      stage.GetRootLayer().subLayerPaths.insert(0, "billboard_base.usda")

      appeal = stage.OverridePrim("/City/CompositionQuarter/Billboard")
      # TODO: Author a local size opinion of 8.0 on the appeal.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - attribute_equals: {path: /City/CompositionQuarter/Billboard.size, value: 8.0}
        - attribute_source: {path: /City/CompositionQuarter/Billboard.size, layer: submission.usd}
        - prim_stack: {path: /City/CompositionQuarter/Billboard, min: 2, specifiers: [over, def]}
        - specifier_equals: {path: /City/CompositionQuarter/Billboard, value: def}
    cookbook: docs/composition-basics/specifiers.md
    xp: 130
    reward: Non-Destructive Appeal
    world_target: /City/CompositionQuarter/Billboard
