  - id: f3_variant_boss
    title: The Curator of False Choices
    floor: 3
    floor_name: Composition Quarter
    neighborhood: Variant Gallery
    kind: neighborhood_boss
    prerequisites: [f3_variant_switch]
    level_required: 8
    exam_tasks: [change_variant_selection, preserve_variant_contents]
    stats: {insight: 3, resolve: 3}
    brief: "SYSTEM: The Curator offers red or blue, then secretly selects red. Author the requested selection. Free will sold separately."
    starter: |
      from pxr import Sdf, Usd

      stage = Usd.Stage.Open(STAGE_PATH)
      exhibit = stage.DefinePrim("/City/CompositionQuarter/ChoiceExhibit", "Xform")
      colors = exhibit.GetVariantSets().AddVariantSet("color")
      for name in ("red", "blue"):
          colors.AddVariant(name)
          colors.SetVariantSelection(name)
          with colors.GetVariantEditContext():
              exhibit.CreateAttribute("activeColor", Sdf.ValueTypeNames.String).Set(name)
      colors.SetVariantSelection("red")
      # TODO: Select blue without deleting either variant.
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - has_variant_set:
            path: /City/CompositionQuarter/ChoiceExhibit
            name: color
            variants: [red, blue]
            selection: blue
        - attribute_equals: {path: /City/CompositionQuarter/ChoiceExhibit.activeColor, value: blue}
    cookbook: docs/composition-basics/variant-sets.md
    xp: 220
    reward: {opinion_points: 1, achievement: "New achievement! You selected blue. The focus group is inconsolable."}
    world_target: /City/CompositionQuarter/ChoiceExhibit
