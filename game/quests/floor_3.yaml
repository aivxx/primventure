  - id: f3_specifier_boss
    title: The Specifier That Wouldn't Def
    floor: 3
    floor_name: Composition Quarter
    neighborhood: Specifier Court
    kind: neighborhood_boss
    prerequisites: [f3_over_case]
    level_required: 7
    exam_tasks: [distinguish_def_over_class, default_traversal]
    stats: {insight: 3, resolve: 2}
    brief: "SYSTEM: One blueprint, one concrete booth, and one traversal. Classify them before the abstract one demands a building permit."
    starter: |
      from pxr import Sdf, Usd

      stage = Usd.Stage.Open(STAGE_PATH)
      blueprint = stage.CreateClassPrim("/City/CompositionQuarter/_BoothBlueprint")
      blueprint.CreateAttribute("department", Sdf.ValueTypeNames.String).Set("permits")
      # TODO: Define /City/CompositionQuarter/PermitBooth as an Xform.

      # Supplied by the System: the inherit arc that carries the blueprint's
      # department opinion to the booth. Floor 05 teaches you to author these.
      booth = stage.GetPrimAtPath("/City/CompositionQuarter/PermitBooth")
      if booth:
          booth.GetInherits().AddInherit(blueprint.GetPath())
      stage.GetRootLayer().Save()
    language: python
    validator:
      assertions:
        - specifier_equals: {path: /City/CompositionQuarter/_BoothBlueprint, value: class}
        - specifier_equals: {path: /City/CompositionQuarter/PermitBooth, value: def}
        - has_inherit: {path: /City/CompositionQuarter/PermitBooth}
        - attribute_equals: {path: /City/CompositionQuarter/PermitBooth.department, value: permits}
        - traversal_contains:
            paths: [/City/CompositionQuarter/PermitBooth]
            excluded: [/City/CompositionQuarter/_BoothBlueprint]
    cookbook: docs/composition-basics/specifiers.md
    xp: 210
    reward: {opinion_points: 1, achievement: "New achievement! You excluded an abstract class from polite traversal."}
    world_target: /City/CompositionQuarter/PermitBooth
    recipes: [Class, Inherit]
    questions:
      - prompt: Which specifier represents an abstract blueprint?
        choices: [def, over, class]
        answer: 2
        explanation: A class prim is abstract and omitted from default traversal.
      - prompt: If an over combines with a weaker def at the same path, what is the composed specifier?
        choices: [def, over, class]
        answer: 0
        explanation: The over contributes opinions while the weaker def establishes existence.

