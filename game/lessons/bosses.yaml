# A boss adapts no curriculum page of its own, because it introduces nothing.
# Its lesson is assembled from the cards its run already taught; only the
# framing and the work order are authored here.
reviews:
  - quest: f0_gatekeeper
    objective: >-
      Enter Prim Threshold, complete its district challenge, and pass the Gatekeeper by defining
      typed containers with the exact named values the district requires.
    intro: >-
      This is Prim Threshold's district challenge. Complete the work order in the terminal, then
      run it for the Gatekeeper's review. When all four terminal requirements pass, the route
      beyond Prim Threshold opens.
      Prim Threshold's earlier rooms asked where an opinion lands, what carries it, and what names
      its value. The Gatekeeper now asks for all three at once.
    work_order:
      heading: The Threshold has no district name and no container
      system: >-
        The Gatekeeper welcomes typed containers carrying explicitly named data.
      body: |
        The Departure Gate closes out Prim Threshold. Behind you are the intake desk, the first
        prim, and the nameplate, so /City should still be standing as an Xform with the city's
        name on it. The gate out of the floor runs through /City/Threshold, which has never
        been built.

        Nothing stands at that path, so the district has neither a container nor a label. An
        untyped prim is a container that declares nothing about what it carries, and a string
        attribute nobody has authored has no value to read at all rather than a blank one.

        The gate needs /City typed as an Xform with cityName reading Primventure, /City/Threshold
        explicitly defined as an Xform, and a string attribute districtName on it set to Prim
        Threshold. A prim existing at the correct path is not enough: its authored type must be
        Xform rather than untyped. String values are equally exact: CreateAttribute wants
        Sdf.ValueTypeNames.String named explicitly rather than inferred.
      points:
        - "An untyped prim declares nothing about what it holds, which is not the same as holding nothing."
        - "/City/Threshold must carry the authored type Xform; existing at the right path is not sufficient."
        - "CreateAttribute takes an explicit Sdf value type, and Set() then writes the value."
        - "String values are exact, punctuation and capitalisation included."
    apply: >-
      Enter the district by defining /City as an Xform with cityName reading Primventure. Then draw
      on what you learned to define /City/Threshold as an Xform and give it a string districtName
      of Prim Threshold. Run the terminal; passing all four requirements opens the gate.

  - quest: f1_clockwork_crossing
    objective: >-
      Connect the Property Ward, preserve its animated clock, and confirm the Archive is addressed
      by the exact paths authored across the first four rooms.
    intro: >-
      This neighborhood challenge reviews the first half of Floor 01: typed attributes,
      relationships, time samples, and constructed paths. The Gatekeeper asks them to work
      together as one connected district.
    work_order:
      heading: The ward and archive still need one connected record
      system: >-
        The Gatekeeper has the addresses. Now it needs the connections and timeline to match.
      body: |
        The lamp and canal now occupy the Property Ward, the clock changes size across its
        timeline, and the Archive Stacks have an exact address and shelf count. A bridge at
        /City/PropertyWard/Bridge is the missing link between those authored pieces.

        Without destination and origin relationships, the bridge does not record either bank.
        The district record also depends on the clock remaining a Cube with its stage range and
        two time samples intact, while the stacks must retain the shelf count authored through
        their constructed path.

        Define the Bridge as an Xform, connect destination to the lamp globe and origin to the
        canal, then preserve the clock from time 1 through 48 with size values 1.0 and 10.0.
        Keep shelfCount at 12 on /City/Archive/Stacks. Relationships hold paths, time samples hold
        values at specific moments, and each must remain on the prim that owns it.
      points:
        - "Relationships connect the Bridge to the exact prim paths for the lamp globe and canal."
        - "The stage range is metadata; the changing size is authored as time samples on the Clock."
        - "A constructed prim path still resolves to the same Archive Stacks prim and its shelfCount."
    apply: >-
      Connect the Bridge to the lamp globe and canal, preserve the Clock's range and time-sampled
      size, and keep the Archive Stacks shelfCount at 12.

  - quest: f1_civic_record
    objective: >-
      Stamp metadata onto the prims you have built, and restate the connection between them.
    intro: >-
      Floor 1 was the floor of properties: values, connections, time, addresses, and formats. The
      Registrar closes it by asking for the one kind of opinion that describes a prim rather than
      hangs off it.
    work_order:
      heading: No district in the ledger carries any documentation
      system: >-
        The Registrar erased the ledger and would like it restored, in the Registrar's preferred
        fields.
      body: |
        The Records Office closes out the property ward. Both districts you have worked through,
        the ward itself and the archive above it, now hold values, a running clock, and shelved
        stacks.

        Neither district carries documentation and the stacks carry no comment. Metadata is not a
        property: it does not hang off the prim as an attribute and it has no fallback, so an
        unstamped district is genuinely absent from the record rather than defaulted to something.
        The stacks no longer carry the relationship that indexed the clock either.

        A restored ledger needs /City/PropertyWard and /City/Archive defined as Xforms with
        documentation stamped on each, /City/Archive/Stacks defined with a comment, and an indexes
        relationship on the stacks targeting the clock. Keep the fields straight: documentation and
        comment are separate metadata keys with separate meanings, and SetMetadata writes them by
        key rather than through CreateAttribute.
      points:
        - "Metadata describes a prim, while attributes are properties that hang off it."
        - "documentation and comment are distinct keys, and stamping one leaves the other empty."
        - "Unauthored metadata has no fallback, so a blank record reads as blank."
    apply: >-
      Define both districts as Xforms with documentation stamped, give the stacks a comment, and
      re-target the indexes relationship at the clock.

  - quest: f2_blueprint_marshal
    objective: >-
      Let each prim's schema declare what it is, and author every value through the accessor that
      schema owns.
    intro: >-
      Floor 2 established that a prim's type is not decoration. The Marshal reads the
      whole borough as a single manifest: geometry, grouping, transform, and light, each declared
      by the schema that owns it.
    work_order:
      heading: The borough is a row of undeclared containers
      system: >-
        Every prim declared by the schema that owns it. The Marshal reads manifests for pleasure.
      body: |
        Lumen Row runs the length of Blueprint Borough. A market stall, a working yard, a crane, a
        lift, and a street lamp are all meant to stand along it, with the borough itself as the
        container they hang beneath.

        None of them declares what it is. An untyped prim carries no schema, so the stall has no
        size to set, the lamp has no intensity, and a transform has no ops to order. Grouping is
        its own version of the problem, because a plain container and a Scope are not
        interchangeable: a Scope is the type that says outright that this prim groups and does not
        transform.

        A declared borough needs the borough as an Xform, the stall as a Cube with size 2.0, the
        yard as a Scope, the crane as an Xform translated to (0, 12, 0), the lift as an Xform
        scaled to (2, 2, 2), and the street lamp as a SphereLight with inputs:intensity of 750. The
        namespaces require special attention: transform values live on xformOp attributes with
        their op order declared alongside, and a light's intensity is inputs:intensity, so dropping
        the prefix authors a custom attribute while the schema's own keeps its fallback.
      points:
        - "A prim's type is the schema that gives it properties and their fallback values."
        - "Scope groups without transforming; Xform is the type that carries transform ops."
        - "Prefer the schema accessor, such as AddTranslateOp or CreateIntensityAttr, so the namespaced name is written for you."
    apply: >-
      Type every prim on the row to its job: an Xform borough, a Cube stall at size 2.0, a Scope
      yard, a translated crane, a scaled lift, and a SphereLight at intensity 750.
  - quest: f4_two_faced_topiary
    objective: >-
      Prune a prim subtree out of the composed stage while leaving every authored spec
      intact in its layer.
    intro: >-
      Three rooms of Quiet Garden, three ways to hang an opinion on a prim. This one wants
      the opinion that makes a prim stop existing as far as traversal is concerned, while
      leaving it perfectly readable on disk.
    work_order:
      heading: The topiary bed carries no approved design
      system: >-
        The committee approved one design and filed the other, so the argument can be
        reopened the moment somebody finds the paperwork.
      body: |
        Quiet Garden is the last stretch of Beyond-the-Walls to be settled. The hedge along
        it carries a constant displayColor, the north gate holds a namespaced note for the
        warden, and the topiary bed at the end of the path is still bare ground.

        Nothing stands at /City/BeyondTheWalls/Topiary, so there is no Hero and no Draft
        beneath it and neither has an active state to resolve. The bed carries no
        documentation either, which leaves no record of which design the committee kept.

        A settled garden needs the Topiary Xform defined with Hero and Draft under it, Hero
        left resolving active, SetActive(False) authored on Draft, and documentation stamped
        on the bed. The detail to watch is reach: deactivating Draft prunes everything below
        it from composition, so a descendant's own active opinion cannot bring it back.
      points:
        - "Deactivating a parent prunes every descendant, whatever the descendant's own active opinion says."
        - "SetActive authors into the current edit target, not necessarily the layer that defined the prim."
        - "Traversal walking past a prim is not the same as the prim leaving its layer."
    apply: >-
      Define the Topiary bed with Hero and Draft beneath it, leave Hero active, deactivate
      Draft, and stamp the bed's documentation.

  - quest: f4_kind_post
    objective: >-
      Classify a prim's role in the model hierarchy with kind metadata, independently of the
      schema type it carries.
    intro: >-
      Measure Yard taught you to count what stands on a stage and to declare what its numbers
      mean. Neither said what any of it is for. Kind supplies that role, and later floors will use
      it to assemble model hierarchies.
    work_order:
      heading: The lamp post has a schema type and no role
      system: >-
        A lamp post is not an assembly, however many committees are assigned to maintain it.
      body: |
        Measure Yard ends at the lamp post. The yard is surveyed now, with the stage declaring
        centimeters and a Y up axis, and a census has already walked the district counting the
        concrete prims on it.

        The lamp post is meant to be a reusable leaf asset that later floors bring in as one
        unit. Nothing stands at /City/BeyondTheWalls/LampPost, and even once an Xform does,
        kind is prim metadata with nothing standing in for it: GetKind returns an empty token
        and a model-aware traversal passes the prim over entirely.

        A catalogued lamp post needs the Xform defined, its kind set to Kind.Tokens.component
        through Usd.ModelAPI, and documentation stamped on the prim. Two details are easy to
        miss: model is the abstract base of the taxonomy and should never be the authored
        token, and a component's ancestors have to be group or assembly for the classification
        to be valid.
      points:
        - "Author the concrete tokens — group, assembly, component, subcomponent — never the abstract model."
        - "Kind is independent of schema type; an Xform can hold any role or none at all."
        - "GetKind returning an empty token means nothing was authored, which is not an error."
    apply: >-
      Define the LampPost Xform, set its kind to component through Usd.ModelAPI, and stamp its
      documentation.

  - quest: f5_specializes_fallback
    objective: >-
      Author the weakest LIVRPS arc as a broadcast fallback and show a local opinion still
      outranks it.
    intro: >-
      Inherit Street has handed you both ends of the strength order. Inherits speaks with
      authority. Specializes speaks last and fully expects to be overruled. The traffic cop
      composes tickets strongest first.
    work_order:
      heading: The posted limit has to outrank the broadcast default
      system: >-
        Specializes yields to everything. It is the only arc that has made peace with this.
      body: |
        Inherit Street runs from the lamp class at one end to Main Street at the other. Every
        fixture on it now takes its colour temperature from a class it inherits, and the district
        survey has come back with a posted limit of 20 for the street itself.

        Nothing is laid at /World/MainStreet yet, and the imported road data that unsurveyed
        streets fall back on broadcasts 30. Authoring 20 onto the shared source would change every
        road in the district at once, and removing the shared source would leave the unsurveyed
        ones with no figure at all.

        Main Street needs laying as a Mesh, the shared road data attached through
        GetSpecializes().AddSpecialize, a local osm:street:maxspeed of 20 authored on the street,
        and its documentation stamped. The posted figure has to be a local opinion in your own
        layer rather than a value arriving across the arc, because specializes sits last in LIVRPS
        and yields to anything more specific.
      points:
        - "A local opinion outranks both inherits and specializes."
        - "Author the arc on the destination prim; the class only carries the fallback data."
        - "Specializes sitting last means removing the local posting lets the broadcast figure return."
    apply: >-
      Lay Main Street as a Mesh, specialize it from the shared road data, post a local maxspeed of
      20, and stamp its documentation so the posting outranks the broadcast 30.
