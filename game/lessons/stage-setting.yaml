lessons:
  - source: docs/stage-setting/prims.md
    title: Prims
    objective: Identify what a prim is, how it is addressed, and the role it plays inside a stage's scenegraph.
    intro: >-
      Welcome to your first lesson, Contestant. The city currently contains exactly as much
      scene description as your work history contained relevant experience. We fix that with
      prims. I will explain them once, thoroughly, in my generous host voice, and then I will
      stand behind you making notes while you fail to apply any of it.
    beats:
      - kind: concept
        heading: A prim is a container with an address
        system: >-
          "Container" is an unglamorous word. So was "contestant," and here we both are.
        body: |
          A primitive, or prim, is the core building block of every OpenUSD scene. A prim is a
          container that holds data: attributes, relationships, and metadata that together
          describe one object or entity in the scene.

          Every prim has a unique path that locates it in the scenegraph, such as
          /World/BuildingA/Geometry/building_geo. That path says building_geo is a child of
          Geometry, which is a child of BuildingA, which is a child of World. Nesting prims
          this way is how a hierarchical scenegraph takes shape.
        points:
          - A prim can represent visual entities like meshes, materials, and lights, or non-visual organizational entities.
          - The path is the prim's identity. Two prims cannot share one path, and moving a prim changes its address.
          - Prims encapsulate data so it can be shared, referenced, and instanced across scenes and files.
      - kind: concept
        heading: Typed prims declare what kind of data belongs there
        system: >-
          An untyped prim is a building with no purpose and no permits. The city has forty. They
          are why the fourth floor is in litigation.
        body: |
          Alongside its path, a prim can carry a type name: a single label such as Xform, Sphere,
          or Mesh that declares what kind of object the container holds. The type is optional. A
          prim without one is still a perfectly valid prim, but it is an unlabelled box, and
          nothing reading the scene can assume anything about what is inside it.

          The label matters because each type name points at a schema, the rulebook saying which
          properties that kind of prim is expected to carry. Xform means the prim holds a
          transform, so it can be moved, rotated, and scaled. Scope is a plain grouping container
          with no transform at all. Cube, Sphere, and Mesh mean the prim describes geometry, so a
          renderer knows there is something to draw.

          In a USDA file the type sits between the word def and the prim's name. Below is the
          same address written both ways. You will author the typed one in this room, and the
          next beat is the Python that writes it.
        code: |
          # Typed: anything reading this knows the prim holds a transform.
          def Xform "City"
          {
          }

          # Untyped: a valid container that promises nothing.
          def "City"
          {
          }
        points:
          - A type is a promise about what the prim contains, and that promise is what lets other tools read your scene correctly.
          - An untyped prim is legal and sometimes deliberate, but nothing can infer a transform, geometry, or material from one.
          - Xform is the right choice for a prim whose job is to position whatever gets nested beneath it.
      - kind: api
        heading: Working with prims in Python
        system: >-
          Five methods. I have seen contestants memorize longer coffee orders.
        body: |
          Scene description is authored in Python through pxr, OpenUSD's Python package. Work
          begins from a stage, the object that holds the scene in memory and knows which layer it
          will be written to.

          The call that creates a prim is DefinePrim, a method on that stage. It takes the path
          where the prim should live and, optionally, the type name from the previous beat. Pass
          a path alone and you get the unlabelled container. Pass a type as the second argument
          and you get the typed one. Every typed schema also offers its own constructor, such as
          UsdGeom.Xform.Define, which reaches the same result without spelling the type as a
          string.

          Both forms hand back a Usd.Prim you can then inspect. Authoring only changes memory, so
          the layer still has to be saved before anything else can read it.
        code: |
          from pxr import Usd, UsdGeom

          stage = Usd.Stage.CreateNew("city.usda")

          # Generic: a path, and optionally a type name.
          plaza = stage.DefinePrim("/Plaza")            # untyped container
          city = stage.DefinePrim("/City", "Xform")     # typed as Xform

          # Schema-specific: the same result with a typed interface.
          tower = UsdGeom.Xform.Define(stage, "/City/Tower")

          city.GetTypeName()      # 'Xform'
          city.GetChildren()      # direct children only
          city.GetProperties()    # every property on the prim

          if stage.GetPrimAtPath("/City").IsValid():
              stage.GetRootLayer().Save()
        points:
          - "stage.DefinePrim(path) creates an untyped prim, and a type name as the second argument creates a typed one."
          - "Schema classes such as UsdGeom.Xform.Define(stage, path) are the clearer, less brittle option when the type is known."
          - An invalid prim evaluates as False, which makes existence checks cheap before you author an override.
      - kind: work_order
        heading: The city stage is empty and no prim answers to /City
        system: >-
          I keep these on a clipboard. It is the only paperwork I enjoy.
        body: |
          The Arrival Hall is the one room that builds its own stage rather than opening the city
          you have already authored. The layer at the stage path does not exist yet, so the
          scenegraph holds nothing but the pseudo-root, and /City is the single address the hall
          is built around.

          Nothing answers to that address. There is no prim spec at /City in any layer, so asking
          the stage for the prim there hands back an invalid prim instead of raising, and there is
          no type name for anything to read. An untyped container would be a legal prim and still
          leave the city without a labelled place to hang anything, because the type is what tells
          a reader the prim holds a transform.

          The work is one typed prim. Author /City with the type name Xform, either through
          stage.DefinePrim with the type as its second argument or through UsdGeom.Xform.Define,
          then save the root layer. The save is the step most often left off: authoring changes
          the stage held in memory, and the file keeps its old contents until the layer is
          written.
        points:
          - "GetChild returns direct children only. Reach a grandchild by stepping down one level at a time."
          - "Forgetting stage.GetRootLayer().Save() or stage.Save() means the validator sees an empty stage."
          - "Passing a bad type name creates a prim with a type token no schema claims."
      - kind: recap
        heading: What you now know
        body: |
          Prims are containers identified by scenegraph paths. A type name declares what kind of
          data belongs in that container. Nesting prims creates the hierarchy that every later
          lesson, from composition to instancing, depends on.
    apply:
      f0_first_prim: >-
        Define /City as an Xform and save the root layer. One address. The entire room. I have
        already told the audience you will spend four minutes on it.

  - source: docs/stage-setting/properties/attributes.md
    title: Attributes
    objective: Author and read typed values on prims, and understand fallbacks, time samples, and schema-specific accessors.
    intro: >-
      Prims are containers. Congratulations, you own empty boxes. Attributes are the part where
      the boxes contain something, which the audience tells me is the interesting part. Attributes
      are also where the scene starts quietly answering questions you never wrote down.
    beats:
      - kind: concept
        heading: Attributes are typed name-value pairs on a prim
        system: >-
          One name, one type, one value. Three constraints. You will violate two.
        body: |
          Attributes are the most common kind of property in OpenUSD and the primary means of
          storing data. Each attribute is a name-value pair with exactly one defined data type,
          declared through the Sdf library: Sdf.ValueTypeNames.String, Double, Color3fArray, and
          so on.

          Common attributes include visibility, which controls whether a prim renders, display
          color, which sets the color on a geometric prim, and extent, which defines a gprim's
          boundaries.
        points:
          - "The other kind of property is a relationship, which targets paths rather than holding values."
          - Attributes are authored into layers, and composition combines opinions from those layers into a resolved value.
          - "An attribute can hold a default value, time samples, or both."
      - kind: concept
        heading: Authoring one means declaring a type, then setting a value
        system: >-
          Two steps. Contestants routinely perform one of them and then look at me expectantly.
        body: |
          An attribute does not exist on a prim until something declares it. Declaring means
          naming it and fixing its data type, which is what the Sdf value types above are for.
          Setting means giving it an actual value. Both steps write into a layer, and only then
          does the attribute appear in the file.

          Some attributes are declared for you. A prim's type carries a schema, and that schema
          names the attributes the prim is expected to have, so a Sphere arrives already knowing
          it has a radius. Anything a schema does not define is a custom attribute, which you
          declare yourself. USDA marks those with the keyword custom so a reader can tell at a
          glance which properties came from the type and which came from you.

          A city name belongs to no schema, so authoring one on an Xform reads like this.
        code: |
          def Xform "City"
          {
              custom string cityName = "Primventure"
          }

          # custom  no schema defines this attribute, so you declared it yourself
          # string  the data type, fixed when the attribute was declared
          # =       the value you set
        points:
          - Declaring fixes the name and type, and setting supplies the value. An attribute needs both before it shows up in a layer.
          - Schema attributes are already declared by the prim's type, so for those you only set a value.
          - "You do not type the custom keyword yourself. It appears because no schema claims the attribute."
      - kind: api
        heading: Prefer schema accessors, fall back to the generic API
        system: >-
          The generic API is a crowbar. The schema API is a key. Both open the door. Only one gets
          you invited back.
        body: |
          Each schema-specific API has methods that grab its own attributes. GetRadiusAttr returns
          a Usd.Attribute object; call Get on it to read the resolved value and Set to author one.
          When no schema owns the data, CreateAttribute takes an explicit value type.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          sphere = UsdGeom.Sphere.Define(stage, "/World/Sphere")

          # Schema-specific: clear and less brittle.
          sphere.GetRadiusAttr().Set(2.0)
          radius = sphere.GetRadiusAttr().Get()
          sphere.GetDisplayColorAttr().Set([(0.0, 1.0, 0.0)])

          # Generic: for data no schema defines.
          prim = sphere.GetPrim()
          name = prim.CreateAttribute("cityName", Sdf.ValueTypeNames.String)
          name.Set("Primventure")

          prim.GetAttributes()      # every attribute on the prim
          prim.GetPropertyNames()   # names only
      - kind: concept
        heading: Reading an attribute nobody authored
        system: >-
          The value exists, the file is empty, and no one is lying to you. Yes, this upsets people.
        body: |
          Schema attributes behave differently from custom ones when nothing has been set. Along
          with declaring that a Sphere has a radius, the schema states what that radius should be
          in a scene that never mentions it. That built-in default is called the fallback, and Get
          returns it without complaint.

          So a Sphere you just defined reports a radius of 1.0 while its USDA is completely empty.
          Nothing is broken. Reading an attribute resolves a value from the strongest source
          available, and with nothing authored the schema fallback is the only source there is.
          Set a radius yourself and your value outranks the fallback, and only then is a number
          written into the layer.

          Custom attributes have no schema standing behind them, so they have no fallback. A
          cityName you have not set yet is not empty text; there is simply nothing to read.
        code: |
          sphere = UsdGeom.Sphere.Define(stage, "/World/Sphere")   # nothing authored yet

          sphere.GetRadiusAttr().Get()               # 1.0, supplied by the schema
          sphere.GetRadiusAttr().HasAuthoredValue()  # False, the file says nothing

          sphere.GetRadiusAttr().Set(2.0)            # now the layer has an opinion
          sphere.GetRadiusAttr().HasAuthoredValue()  # True
        points:
          - A fallback is the schema's answer for an attribute the scene never mentions, which is how Get succeeds against an empty file.
          - A value you author always outranks a fallback, and only authored values are written to the layer.
          - "HasAuthoredValue tells you whether a value came from the file or from the schema."
      - kind: work_order
        heading: The prims exist and the values they should carry do not
        system: >-
          Three values belong on the city record, and two of them belong to no schema at all.
        body: |
          /City stands as an Xform from the Arrival Hall, the alley's lamp post waits for its
          glass, and the Departure Gate is where /City/Threshold belongs. The city needs a name,
          the lamp globe needs a radius of 0.4, and the Threshold needs its district label.

          None of those values is authored, and they are absent in two different ways. cityName
          and districtName belong to no schema, so nothing has declared them and there is nothing
          to read at all. The Sphere schema declares its radius as double radius = 1, so the
          globe reports 1.0 the moment it is defined while its layer stays silent, and 1.0 is not
          the 0.4 the alley wants.

          Author each value where ownership points. Sphere owns radius, so its schema accessor
          sets it. Nothing owns a city or a district name, so those are declared with
          CreateAttribute and an explicit Sdf.ValueTypeNames.String, then set. The detail worth
          watching is that GetRadiusAttr hands back the attribute object rather than the number,
          so nothing is written until Get or Set is chained onto it.
        points:
          - "GetRadiusAttr() hands back the attribute object, so chain .Get() when you want the number."
          - "displayColor is an array-valued primvar, so wrap the triple in a list: [(0, 1, 0)]."
          - "Passing a time code to Set authors a time sample instead of the default value."
      - kind: recap
        heading: What you now know
        body: |
          Attributes hold typed data on prims. Authoring one means declaring a name and a type,
          then setting a value. Reading one gives you the value you authored, or the schema's
          fallback when nobody authored anything. Prefer a schema accessor when the schema owns
          the data; reach for CreateAttribute with an explicit Sdf type when nothing does.
    apply:
      f0_nameplate: >-
        Author cityName as a string attribute set to Primventure, exactly, punctuation included,
        because the Registrar reads it aloud. No schema owns a city's name, so this is the generic
        CreateAttribute case. A city that cannot state its own name gets struck from the ledger.
      f1_lamp_post: >-
        A Sphere is a typed prim, so its radius arrives already declared and the schema accessor
        is right there. Define the globe, then set radius to 0.4. The alley has been dark since
        the last contestant, who is also still in there, and glass is as far as you get today.
      f0_gatekeeper: >-
        Everything the floor taught, in one submission. Define /City as an Xform with cityName still
        reading Primventure, define /City/Threshold as an Xform, and give it a string attribute
        districtName set to Prim Threshold. The Gatekeeper reads all four and grades none of them
        generously.

  - source: docs/stage-setting/stage.md
    title: Stages
    objective: Explain what a stage is, how it composes layers, and how to create, open, and save one.
    intro: >-
      A stage is the composed scene, assembled from layers. I stress the distinction because every
      season someone tells the audience a stage is merely a file, and then I have to be unkind on
      camera, and the sponsors send letters.
    beats:
      - kind: concept
        heading: A stage presents the composed scenegraph
        system: >-
          The stage is the truth. The files are just the arguing.
        body: |
          A stage presents the scenegraph, the hierarchy of prims that makes up the scene. It is
          the composed result of one or more layers, and a layer can come from a file or from any
          other resource.

          A stage might be a single USD file describing a robot, or a file that pulls in many
          more files describing a factory full of robots. Each contributing asset can also be
          opened independently as its own stage.
        points:
          - "Composition is the algorithm that decides how layers combine into that one scenegraph."
          - "Stages enable non-destructive editing, so elements change without altering the original files."
          - "Stages scale through mechanisms like payloads, which defer heavy content."
      - kind: concept
        heading: Every stage has a root layer
        system: >-
          The root layer is where your edits land when you have not told me otherwise. You will
          later learn to tell me otherwise. That lesson has a boss.
        body: |
          The root layer is the first layer the stage opens and the anchor of the layer stack.
          When you create a stage with CreateNew, the file you pass becomes the root layer, and
          edits are written there unless another edit target is set.

          Most authored data can live in other layers depending on composition. The root layer's
          subLayerPaths list is one way to bring those layers in, and sublayers may use different
          USD file formats.
        points:
          - "stage.GetRootLayer() returns the Sdf.Layer object backing the stage."
          - "stage.Save() writes every edited layer contributing to the stage, the root among them."
          - "Usd.Stage.CreateInMemory() builds a stage with no file until you call Export."
      - kind: concept
        heading: A stage does not have to be backed by a file
        system: >-
          Scratch work that never reaches disk. The one place in this building where nothing can
          be held against you permanently.
        body: |
          CreateNew and Open both tie a stage to a layer on disk, but a stage can also exist purely
          in memory. CreateInMemory builds one with no file behind it, which is what you want for
          scratch work, for tests, and for scene description you intend to assemble before deciding
          where it should live.

          An in-memory stage behaves like any other. You author prims and properties on it and read
          the composed result back the same way. The difference is that there is no root layer file
          to write to, so persisting it means exporting rather than saving. Export writes the
          composed stage to a path you name, and ExportToString hands you the same text without
          touching the filesystem at all.
        code: |
          from pxr import Usd

          stage = Usd.Stage.CreateInMemory()
          stage.DefinePrim("/City", "Xform")

          # Nothing exists on disk yet. Either of these changes that.
          print(stage.ExportToString(addSourceFileComment=False))
          stage.Export("city.usda")
        points:
          - "Usd.Stage.CreateInMemory() takes no path, because there is no file to name."
          - "stage.Save() has nothing to write for an in-memory stage, so Export is what persists it."
          - "ExportToString returns the layer as text, which makes it the quickest way to read back what you authored."
      - kind: api
        heading: Creating, opening, and saving
        body: |
          Three calls cover the lifecycle. CreateNew fails if the file already exists, Open loads
          an existing layer as a stage, and Save writes edits back to disk.
        code: |
          from pxr import Usd

          stage = Usd.Stage.CreateNew("city.usda")   # new stage, new root layer
          stage = Usd.Stage.Open("city.usda")        # existing file as a stage
          stage.Save()                               # write all edited layers

          print(stage.ExportToString(addSourceFileComment=False))
      - kind: work_order
        heading: The city has no stage, and the intake decision has not been made
        system: >-
          Two constructors and one save. The desk needs all three settled before you touch a
          keyboard.
        body: |
          The Intake Desk is the first stop on the floor and it sits in front of an empty city.
          There is no root layer under the stage path, no scenegraph composed over it, and no
          prims to inspect. Nothing is authored here. The desk needs the intake decision stated in
          the language of CreateNew, Open, and the root layer, because the next room's first line
          is exactly that choice.

          What is absent here is the decision itself. Each file-backed constructor assumes a
          different state on disk: CreateNew makes the layer and raises when the file is already
          there, while Open loads an existing layer and raises when it is not. Nothing yet
          separates those two situations, and nothing yet accounts for the step that turns an
          edit held in memory into a file another reader can open.

          State that a stage over a file which does not exist yet comes from Usd.Stage.CreateNew,
          that an existing file is opened with Usd.Stage.Open, and that edits reach disk only when
          the stage or its root layer is saved. The detail is what authoring does not do: defining
          a prim changes the composed stage and leaves the layer on disk untouched.
        points:
          - "CreateNew raises if the file already exists. Use Open when the room has already made the stage for you."
          - "Open raises if the file does not exist, so it is never the call that starts an empty scene."
          - "Skipping stage.Save() or stage.GetRootLayer().Save() leaves every check reading a stage with nothing in it."
      - kind: recap
        heading: What you now know
        body: |
          A stage is the composed scenegraph assembled from one or more layers and anchored by a
          root layer. CreateNew opens a stage over a new file, Open opens one over a file that
          already exists, and CreateInMemory skips the file altogether. Saving or exporting is what
          makes any of it readable by anyone but you.
    apply:
      f0_stage_intake: >-
        No code this round, just the desk. It wants you to say which call makes a stage over a file
        that does not exist yet, which one opens a file that does, and what has to happen before anything
        on disk reflects your edits. Answer in the language of CreateNew, Open, and the root layer.

  - source: docs/stage-setting/metadata.md
    title: Metadata
    objective: Use metadata to attach non-animatable information to prims, properties, layers, and stages.
    intro: >-
      Metadata is how the scene describes itself rather than its shape. Author, notes, project
      data, rendering hints. It is the paperwork of the Composition, and I say that with real
      affection, because paperwork is what convicted the last three bosses.
    beats:
      - kind: concept
        heading: Metadata is non-animatable name-value data
        system: >-
          A dictionary that will not move over time. Restful. Unlike this building.
        body: |
          Metadata is a set of name-value pairs attached to prims, properties, or layers. It lets
          you annotate scene description without modifying the underlying schema or data model.

          Typical uses include author information, creation and modification dates,
          project-specific data, annotations, and rendering hints. Metadata can be set at
          different levels of the hierarchy, supporting both global and localized information.
        points:
          - Metadata is stored separately from the primary data and is accessed and modified independently.
          - Because it cannot be time sampled, metadata evaluates and stores more efficiently than attribute values.
          - Composition still applies, so a stronger layer's metadata opinion wins.
      - kind: concept
        heading: Metadata versus attributes
        system: >-
          Contestants confuse these constantly, then act surprised when the animation department
          arrives with questions and torches.
        body: |
          Both store extra data, but they answer different questions. Attributes are part of the
          schema definition and describe the object's properties or behavior. Metadata sits
          outside the schema and carries supplementary information about the object.

          The decisive difference is time. Attributes can be animated with time samples. Metadata
          cannot be sampled over time at all.
        points:
          - "Use an attribute when the value describes the thing and might animate."
          - "Use metadata when the value describes the record and never animates."
          - "assetInfo holds asset-related data; customData holds everything else."
      - kind: api
        heading: Reading and writing metadata
        system: >-
          Note the dict-key variants. They exist because someone profiled this and was horrified.
        body: |
          Usd.Object exposes generic GetMetadata and SetMetadata, and the stage has its own
          equivalents. Well-known keys such as documentation and displayName also have convenience
          accessors. When you need one entry inside a dictionary-valued key, the ByDictKey variants
          avoid fetching and rewriting the whole dictionary.
        code: |
          from pxr import Usd

          prim = stage.GetPrimAtPath("/City/PropertyWard")

          prim.SetMetadata("documentation", "Civic property district.")
          prim.SetDocumentation("Civic property district.")   # the same field, named accessor
          prim.GetMetadata("documentation")

          prim.SetCustomDataByKey("sourceFormat", "OBJ")
          prim.GetMetadataByDictKey("customData", "sourceFormat")

          stage.SetMetadata("comment", "Composed by contestant USD-01.")
      - kind: work_order
        heading: The districts and the lamp globe carry no record of themselves
        system: >-
          "customData" is the key, spelled exactly that way. The vocabulary is fixed and I did not
          fix it.
        body: |
          The city already stands. The lamp globe is a Sphere at
          /City/PropertyWard/LampGlobe with the radius set in the alley, and the Registrar's
          ledger covers two districts, /City/PropertyWard and /City/Archive, plus the stacks
          beneath the Archive. The prims are all there. The record kept about them is not.

          documentation is unauthored on the globe and on both districts, comment is unauthored on
          the globe and on /City/Archive/Stacks, and the stacks hold no indexes relationship
          pointing at the clock. comment and documentation are separate fields, so stamping one
          leaves the other exactly as empty as it was.

          Author each one as metadata on the prim, passing the field name and the string to
          SetMetadata. The tool to leave alone is CreateAttribute: it authors a property with that
          name and leaves the metadata field unauthored, because metadata sits outside the schema
          and annotates the record rather than describing the object. Each string is stored exactly
          as typed, closing period included.
        points:
          - "Setting customData with a full dictionary discards entries you did not include."
          - "documentation is a well-known key. Arbitrary top-level keys need a schema."
          - "comment and documentation are separate fields, so stamping one leaves the other unauthored."
      - kind: recap
        heading: What you now know
        body: |
          Metadata annotates scene description outside the schema, never animates, and is the
          right home for provenance, documentation, and pipeline data. Attributes remain the home
          for values that describe or animate the object itself.
    apply:
      f1_records_office: >-
        Stamp the record on /City/PropertyWard/LampGlobe: documentation set to "Alley lamp globe."
        and comment set to "Glass blown on floor one." Neither is an attribute, so neither goes
        through CreateAttribute. Punctuation included, because the Registrar reads it aloud.
      f1_civic_record: >-
        Restore the whole ledger. Both districts typed as Xform, documentation on /City/PropertyWard
        and /City/Archive, comment on /City/Archive/Stacks, and an indexes relationship from the
        stacks to the clock. The Registrar erased it, and unlike the Registrar, I keep receipts.

  - source: docs/stage-setting/timecodes-timesamples.md
    title: Timecodes and Time Samples
    objective: Author animated attribute values and configure the stage timeline that gives them meaning.
    intro: >-
      Time. The floor's least favorite subject, and the reason Clockwork Crossing keeps arriving
      before it departs. A time sample is a value at a moment. A time code is the moment. Confuse
      them and the crossing loops forever, which the audience does enjoy.
    beats:
      - kind: concept
        heading: Time samples are values at specific time codes
        system: >-
          One attribute, many moments, no duplication. This is the part where USD is quietly
          excellent and nobody applauds.
        body: |
          An attribute can hold a default value and a set of time samples. A time sample pairs a
          time code with a value, so a single attribute describes an animated quantity without
          duplicating the prim.

          Time codes are unitless numbers. The stage's timeCodesPerSecond metadata maps them onto
          real time, which is what lets a scene authored in frames play back correctly.
        points:
          - "A default value is used when no time samples apply; time samples win when they exist."
          - "Values between samples are interpolated, with linear interpolation as the default."
          - "attr.GetTimeSamples() returns the authored sample times."
      - kind: concept
        heading: The stage timeline declares the playback range
        system: >-
          Without a range, your animation exists but nothing agrees on when to watch it. Like my
          contract.
        body: |
          Start and end time codes are stage metadata describing the intended playback range.
          Authoring stays unrestricted, so samples outside the range remain perfectly legal. The
          range tells consumers which span of time the scene is about.
        code: |
          from pxr import Usd, UsdGeom

          stage = Usd.Stage.Open(STAGE_PATH)
          stage.SetStartTimeCode(1)
          stage.SetEndTimeCode(48)

          clock = UsdGeom.Xform.Define(stage, "/City/PropertyWard/Clock")
          translate = clock.AddTranslateOp()

          translate.Set((0.0, 0.0, 0.0), 1)    # sample at time code 1
          translate.Set((0.0, 4.0, 0.0), 48)   # sample at time code 48

          stage.GetRootLayer().Save()
      - kind: api
        heading: Authoring and querying samples
        system: >-
          The second argument to Set is the entire difference between animation and a very
          confident still image.
        body: |
          Passing a time code to Set authors a sample; omitting it authors the default value. Get
          takes the same optional time code and resolves the value at that moment.
        code: |
          attr.Set(value)             # default value
          attr.Set(value, timeCode)   # time sample

          attr.Get()                  # resolved default
          attr.Get(timeCode)          # resolved value at that time

          attr.GetTimeSamples()       # [1.0, 48.0]
          attr.ValueMightBeTimeVarying()
      - kind: work_order
        heading: The clock holds no time samples and the stage declares no range
        system: >-
          The second argument to Set is the entire difference between a clock and a very confident
          still image.
        body: |
          Clockwork Crossing sits above the Property Ward, and the clock is the prim both rooms
          work on: a Cube at /City/PropertyWard/Clock. The clock face has to change over the
          cycle rather than sit still, size 1.0 at time code 1 and 10.0 at time code 48, and the
          crossing needs the stage to declare the span those two moments belong to.

          The clock's size carries no time samples. Unauthored, it resolves to the Cube schema's
          fallback at every moment; authored once without a time, it holds one default value that
          resolves identically at time code 1 and at time code 48. The timeline is absent too,
          since startTimeCode and endTimeCode are stage metadata rather than values on the
          attribute, and nothing has declared either of them.

          Set size twice on that one attribute, passing a time code alongside each value, so the
          layer records two samples and interpolation covers the span between them. Declare the
          range separately through the stage's start and end time codes. The detail is that
          omitting the time authors the default value instead of a sample, in which case the
          second call overwrites the first rather than adding to it.
        points:
          - "Set(value) and Set(value, time) author different things. Mixing them up leaves a static default."
          - "Metadata cannot be time sampled, so animated data belongs on attributes."
          - "AddTranslateOp on a prim that already has one appends another op to xformOpOrder."
      - kind: recap
        heading: What you now know
        body: |
          Time samples attach values to time codes on a single attribute, the stage's start and
          end time codes declare the playback range, and interpolation fills the gaps between
          authored moments.
    apply:
      f1_clockwork_room: >-
        Define a Cube at /City/PropertyWard/Clock, then sample its size attribute twice: 1.0 at time
        code 1 and 10.0 at time code 48. Two samples, one attribute. Set it once without a time and
        the clock face simply sits there being confident.
      f1_clockwork_crossing: >-
        Bind the city clock from 1 to 48, then sample the Cube's size at both endpoints, 1.0 at
        time code 1 and 10.0 at time code 48. The crossing has been looping outside time and the
        commuters have opinions.

  - source: docs/stage-setting/properties/relationships.md
    title: Relationships
    objective: Author relationships that target other prims and properties without copying their data.
    intro: >-
      An attribute holds a value. A relationship holds a pointer to somewhere else in the
      scenegraph. Reconnect Relationship Bridge is one room away and it currently leads nowhere,
      which the residents describe as "structurally honest."
    beats:
      - kind: concept
        heading: Relationships target paths
        system: >-
          It points. That is the whole personality. Some of us are typecast.
        body: |
          A relationship is the second kind of property. It stores one or more scene paths that
          target other prims or properties.

          This keeps the target independent. Material binding, light linking, and collection
          membership all use relationships so the referenced object stays a single authored
          entity rather than a copy.
        points:
          - "Targets are Sdf.Path values, and a relationship may hold zero, one, or many."
          - "Relationships compose like other properties, so stronger layers can change targets."
          - "A relationship can target a property as readily as a prim."
      - kind: api
        heading: Creating and reading targets
        system: >-
          SetTargets replaces. AddTarget appends. Choose wrong and the bridge points at three
          districts simultaneously, which is how the fourth floor started.
        body: |
          CreateRelationship authors the relationship on a prim, and SetTargets assigns its
          targets. GetTargets returns the authored target paths.
        code: |
          from pxr import Usd

          bridge = stage.DefinePrim("/City/BlueprintBorough/Bridge", "Xform")

          destination = bridge.CreateRelationship("destination")
          destination.SetTargets(["/City/BlueprintBorough/Stall"])

          destination.GetTargets()      # [Sdf.Path('/City/BlueprintBorough/Stall')]
          destination.AddTarget("/City/BlueprintBorough/Stall2")

          bridge.GetRelationships()     # every relationship on the prim
      - kind: work_order
        heading: The canal and the bridge stand beside the lamp with nothing pointing at it
        system: >-
          A relationship will happily target a prim nobody authored. USD treats that as a promise,
          and USD keeps promises badly.
        body: |
          Both rooms work in the Property Ward, where the lamp globe already exists as a Sphere at
          /City/PropertyWard/LampGlobe. The canal room defines the ward and /City/PropertyWard/Canal
          beneath it, and the bridge that follows defines /City/PropertyWard/Bridge. Each of those
          new prims needs a link: feeds on the Canal, naming the lamp it supplies, then destination
          and origin on the Bridge, naming the two banks it spans.

          None of those properties exists. The canal sits next to the globe with no authored link
          between them, and the bridge names neither bank, so nothing in the layer records which
          prim it starts from or which it lands on. The hierarchy cannot supply any of this,
          because a prim has exactly one parent and the globe already sits elsewhere in the ward.

          Author the link with CreateRelationship on the prim that holds it, then hand SetTargets
          the exact path list: feeds targeting the globe, destination targeting the globe, origin
          targeting the canal. Two details matter. A relationship has no data type and verifies
          nothing about its targets, so a mistyped path is written down verbatim and resolves to
          nothing, and SetTargets replaces the whole list rather than adding to it.
        points:
          - "SetTargets replaces the entire target list, discarding anything previously authored."
          - "Dangling targets fail silently. Verify with GetTargets and a prim existence check."
          - "Use a relationship to link objects, and an attribute when you actually need a value."
      - kind: recap
        heading: What you now know
        body: |
          Relationships are properties that hold scene paths, letting one prim point at others
          without duplicating them. They are how USD expresses connection instead of copying.
    apply:
      f1_binding_canal: >-
        Define /City/PropertyWard as an Xform and /City/PropertyWard/Canal as an Xform beneath it,
        then create a relationship named feeds on the Canal targeting /City/PropertyWard/LampGlobe.
        The canal does not carry the lamp, it points at it, which is the entire lesson and also the
        entire room.
      f2_relationship_bridge: >-
        Define /City/PropertyWard/Bridge as an Xform, then author both links: destination
        targeting the lamp globe and origin targeting the canal. A bridge that knows neither bank
        is technically just an expensive opinion about air.

  - source: docs/stage-setting/usd-file-formats.md
    title: USD File Formats
    objective: Choose between USD's file formats and author scene description directly in USDA text.
    intro: >-
      The Warden of this room accepts text and text alone. Specifically USDA, the human-readable
      format, which means for one glorious room you will see exactly what the file says instead of
      guessing what your script did.
    beats:
      - kind: concept
        heading: Four extensions, two real formats
        system: >-
          Yes, .usd could be either one. Yes, that is deliberate. No, I did not design it, though
          I would have.
        body: |
          USDA is the human-readable ASCII format, readable and diffable in any text editor. USDC
          is the binary crate format, compact and fast to load for large data.

          The .usd extension can hold either encoding, which lets a pipeline swap between text and
          binary without changing references. USDZ is an uncompressed, zero-padded archive that
          packages a stage with its assets for read-only delivery.
        points:
          - "Use USDA for small, hand-edited, review-friendly layers."
          - "Use USDC for heavy geometry and anything performance sensitive."
          - "Because references name the file, switching encodings behind a .usd extension is transparent."
      - kind: concept
        heading: Reading USDA scene description
        system: >-
          Every Python call you have made so far has been typing this file with extra steps and
          more self-esteem.
        body: |
          A USDA file opens with the #usda 1.0 header, followed by an optional metadata block in
          parentheses, then prim declarations. Each prim declaration is a specifier, a type name,
          a quoted name, and a brace block containing properties and children.

          Properties are declared with their type, then name, then value. The uniform qualifier
          marks a property that cannot vary over time.
        code: |
          #usda 1.0
          (
              defaultPrim = "City"
              upAxis = "Y"
          )

          def Xform "City" {
              string cityName = "Primventure"

              def Xform "Archive" {
                  uniform token vaultClass = "records"
                  int shelfCount = 12
              }
          }
      - kind: api
        heading: Moving between formats
        system: >-
          Export converts encodings and leaves composition intact unless you ask for a flatten.
          People assume otherwise and then file complaints with a department I invented.
        body: |
          The stage and layer APIs convert between encodings by exporting to a path with a
          different extension. Export writes the layer's own content in the target format.
        code: |
          from pxr import Sdf, Usd

          stage = Usd.Stage.Open("city.usda")
          stage.Export("city.usdc")          # text to binary

          layer = Sdf.Layer.FindOrOpen("city.usdc")
          layer.Export("review.usda")        # binary to text

          print(stage.ExportToString(addSourceFileComment=False))
      - kind: work_order
        heading: The Archive holds no vault, and no one has named the encoding it is written in
        system: >-
          Four extensions, two encodings, one delivery format. The Foundry asks. I merely stand
          here.
        body: |
          The Warden Foundry sits inside the Archive district you surveyed two rooms ago, where
          /City/Archive already holds Stacks with shelfCount reading 12. Nothing is authored at
          the Foundry itself. It needs a correct intake decision about encodings: which extension
          is the readable text encoding, which one packages a scene with its assets for a handoff,
          and what .usd signals. The Warden past it needs a prim in that district.

          /City/Archive/WardenVault does not exist. There is no container for the Warden's record,
          no note on it saying which encoding the layer uses, and no link from the vault to the
          clock it archives at /City/PropertyWard/Clock. The encodings are unsettled in a
          different way: three of the four names describe an encoding and one describes a
          delivery decision.

          State that .usda is the ASCII text encoding, .usdz is the uncompressed archive that ships
          a scene with its assets, and .usd is deliberately either text or binary so a layer can
          switch encodings without breaking the references naming it. Then define the vault as an
          Xform, author a string formatNote reading usda on it, and target its archives
          relationship at the clock. formatNote is a value on the prim, not the layer's encoding.
        points:
          - "Every USDA file must start with the #usda 1.0 header line."
          - "Prim names are quoted; type names are not."
          - "Stage metadata such as defaultPrim belongs in the top parentheses, above every prim block."
      - kind: recap
        heading: What you now know
        body: |
          USDA is text, USDC is binary, .usd is either, and USDZ packages a stage for delivery.
          Reading USDA fluently is how you verify what your authoring code actually wrote.
    apply:
      f1_format_foundry: >-
        No authoring here, only judgement. Be ready to say which extension is the readable text
        encoding, which one packages a scene with its assets for handoff, and why .usd deliberately
        refuses to tell you whether it is text or binary.
      f2_schema_warden: >-
        Define /City/Archive/WardenVault as an Xform, give it a string formatNote reading usda,
        and point its archives relationship at the clock. Keep shelfCount reading 12 on the
        stacks. The Warden rejects vague forms, untyped containers, and, historically, contestants.

  - source: docs/stage-setting/prim-property-paths.md
    title: Prim and Property Paths
    objective: Read, build, and navigate the paths that locate prims and properties inside a scenegraph.
    intro: >-
      You have been typing paths since your first room, the way a tourist types an address into a
      map without ever learning the city. This lesson is the part where the address becomes an
      object you can build, split, and interrogate. The Archive Stacks are indexed by path, and the
      Archive has never once forgiven a typo.
    beats:
      - kind: concept
        heading: A path is the location of a prim or property
        system: >-
          Every prim in this city has exactly one address. Unlike the contestants, who keep
          claiming several.
        body: |
          A path represents the location of a prim or a property within a scenegraph. Written as a
          string, a prim path is a sequence of prim names separated by forward slashes, much like a
          file path in a directory structure. The stage's pseudo-root, the starting point of the
          whole hierarchy, is written as a single forward slash.

          So /World/Geometry/Box names a prim called Box that is a child of Geometry, which is a
          child of World. Reading the path from left to right walks you down the hierarchy, and
          reading it from right to left tells you everything that contains the thing you named.
        points:
          - Each prim and property in a scene has a unique path, which is what distinguishes it from every other object.
          - Paths are how you navigate the hierarchy, traversing the stage to reach a specific prim.
          - Paths specify locations for authoring, telling a creation call where in the hierarchy the new prim belongs.
          - "Paths also support querying and filtering, selecting prims by location with Sdf.PathExpression."
      - kind: concept
        heading: The punctuation says what kind of thing you named
        system: >-
          Slash, period, curly brace. Three marks of punctuation, and contestants still manage to
          address a property as though it were a prim.
        body: |
          Path data is handled through the Sdf.Path class, which encodes prims, properties, and
          variants in a single string vocabulary. Which separator you use decides which of those
          three you are naming.

          A slash separator indicates namespace, so "/geo/box" names a prim. A period after an
          identifier introduces a property, so "/geo/box.weight" names a property on that prim
          rather than the prim itself. Curly brackets indicate a variant, as in
          "/geo/box{size=large}". Properties covered by this vocabulary include both attributes and
          relationships, since both live in the same property namespace.
        code: |
          "/geo/box"                # a prim path: slashes walk the namespace
          "/geo/box.weight"         # a property path: the period introduces a property
          "/geo/box{size=large}"    # a variant path: curly brackets select a variant
        points:
          - "A slash separates names in the namespace and identifies a prim."
          - "A period after an identifier introduces a property, whether that property is an attribute or a relationship."
          - "Curly brackets select a variant, so a variant path names a location inside a variant rather than a plain prim."
      - kind: api
        heading: Building and navigating paths in Python
        system: >-
          You can retype the whole string every time. You can also build it once and let the object
          do the arithmetic. One of these approaches survives a rename.
        body: |
          A path does not have to be a string literal you retype. Sdf.Path is a value you construct
          and then extend: AppendChild takes a parent path and returns the path of a child by that
          name, which lets you build a hierarchy of paths from a single root.

          Once you hold a path, the class answers questions about it. IsPrimPath reports whether the
          path names a prim, and GetParentPath returns the path of whatever contains it. On the
          other side, Usd.Prim.GetPath returns a prim's path as an Sdf.Path object, and
          Usd.Stage.GetPrimAtPath retrieves the prim at a given path from the stage.

          GetPrimAtPath returns either a valid or an invalid prim, so always check validity before
          using the result. Usd.Object.IsValid answers that question: valid means the prim exists on
          the stage, and invalid means either the prim does not exist or the path itself is not a
          usable address.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          world_path = Sdf.Path("/World")
          geometry_path = world_path.AppendChild("Geometry")   # /World/Geometry
          sphere_path = geometry_path.AppendChild("Sphere")    # /World/Geometry/Sphere

          stage.DefinePrim(world_path)
          stage.DefinePrim(geometry_path)
          UsdGeom.Sphere.Define(stage, sphere_path)

          sphere_path.IsPrimPath()          # True
          sphere_path.GetParentPath()       # Sdf.Path('/World/Geometry')

          prim = stage.GetPrimAtPath(geometry_path)
          prim.IsValid()                    # check before you use it
          prim.GetPath()                    # Sdf.Path('/World/Geometry')
        points:
          - "AppendChild builds a child path from a parent path, so one root path can produce an entire branch."
          - "IsPrimPath and GetParentPath inspect and walk a path without touching the stage at all."
          - "GetPrimAtPath can hand back an invalid prim, so pair it with IsValid before you author through it."
      - kind: concept
        heading: A property path identifies a location, not a property
        system: >-
          Naming a thing and creating a thing are different activities. This surprises people, which
          says more about people than about paths.
        body: |
          AppendProperty builds the path of a property on a prim, producing something like
          /World/Geom/Sphere.userProperties:tag. Building that path creates nothing. The property
          path identifies a location, and the spec at that location still has to be authored.

          Authoring is what CreateAttribute and CreateRelationship do, and both are called on the
          prim that owns the property. GetPrimPath on a property path returns the path of that
          owning prim, which is how you get from the property path back to the prim you author
          through. Once the spec exists, GetAttributeAtPath and GetRelationshipAtPath fetch it from
          the stage by path, and GetPropertyAtPath works for either kind.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          sphere = UsdGeom.Sphere.Define(stage, "/World/Geom/Sphere")

          # A path to a property that does not exist yet.
          attr_path = sphere.GetPath().AppendProperty("userProperties:tag")

          owner = stage.GetPrimAtPath(attr_path.GetPrimPath())
          owner.GetAttribute("userProperties:tag").IsDefined()   # False, nothing authored

          attr = owner.CreateAttribute("userProperties:tag", Sdf.ValueTypeNames.String)
          attr.Set("surveyed")
          stage.GetAttributeAtPath(attr_path).Get()              # 'surveyed'

          rel_path = sphere.GetPath().AppendProperty("my:ref")
          rel = owner.CreateRelationship(rel_path.name)
          rel.AddTarget("/World/Markers/MarkerA")
        points:
          - "AppendProperty builds a property path from a prim path; it does not author a property spec."
          - "GetPrimPath strips a property path back to its owning prim, which is what CreateAttribute is called on."
          - "IsDefined on the property reports whether anything has actually been authored at that location."
      - kind: work_order
        heading: The Archive district has no prims behind either of its addresses
        system: >-
          An invalid prim is not an error. It is a perfectly polite object that will do nothing you
          ask and never mention why.
        body: |
          At the Archive Stacks, /City is an Xform and the Property Ward is built out with its
          lamp, canal, and clock. The Archive district is not there at all. It needs both of its
          prims and a count of its shelves: an
          Xform at /City/Archive, an Xform at /City/Archive/Stacks beneath it, and an int
          attribute named shelfCount set to 12 on the deeper prim.

          Neither prim is authored. Asking the stage for either address returns an invalid prim
          rather than raising, so nothing announces that the district is absent, and shelfCount has
          no spec anywhere to hold a value. The child address is meant to be built rather than
          retyped, because /City/Archive/Stacks is one path whose ancestors decide whether the
          attribute lands inside the Archive or beside it.

          Build Sdf.Path("/City/Archive"), extend it with AppendChild("Stacks"), define an Xform at
          each path, then create shelfCount on the Stacks prim with Sdf.ValueTypeNames.Int and set
          it to 12. The separators are the detail: AppendChild extends namespace while
          AppendProperty introduces a property, and building a property path authors nothing, since
          the spec is created on the prim that owns it.
        points:
          - "GetPrimAtPath on a path nobody authored returns an invalid prim instead of raising, so check IsValid first."
          - "A prim path and a property path differ by one period, and the wrong separator addresses the wrong kind of object entirely."
          - "AppendChild extends namespace and AppendProperty introduces a property, so mixing them builds an address for something you did not mean."
      - kind: recap
        heading: What you now know
        body: |
          A path uniquely identifies a prim or property and locates it within the scenegraph. Slashes
          walk namespace, a period introduces a property, and curly brackets select a variant.
          Sdf.Path turns those strings into values you can build with AppendChild and AppendProperty,
          inspect with IsPrimPath and GetParentPath, and hand to the stage for authoring, querying,
          and navigation.
    apply:
      f1_paths_survey: >-
        Build the path to /City/Archive with Sdf.Path, then reach the child with AppendChild rather
        than retyping the string. Define both as Xform prims, then author an int attribute
        shelfCount on the Stacks prim set to 12. The Archive is indexed by address, and it does not
        accept approximations.

  - source: docs/stage-setting/usd-modules.md
    title: OpenUSD Modules
    objective: Identify the commonly used OpenUSD modules and know which one to reach for when authoring or reading scene description.
    intro: >-
      You have been importing these for six rooms without being asked to justify a single one of
      them. The Module Desk would like that corrected. It is a short lesson, which the audience
      always mistakes for an easy one, and the Desk always corrects them too.
    beats:
      - kind: concept
        heading: Four core packages, two of which you actually need
        system: >-
          Half the repository is about drawing pictures. You are not drawing pictures. You are
          filling in forms, and I have never been prouder.
        body: |
          The USD code repository is made up of four core packages: base, usd, imaging, and
          usdImaging. To author and read USD data, you only need base and usd, which is where the
          commonly used modules live.

          The full API spans many modules with varying purposes: authoring, reading, and composing
          USD data, imaging composed scenes, defining plugin interfaces for extending USD's
          capabilities, and more. That breadth is why knowing which module owns which job matters
          more than memorizing any single call.
        points:
          - "The four core packages are base, usd, imaging, and usdImaging."
          - "Authoring and reading scene description requires only the base and usd packages."
          - "The imaging packages exist for rendering composed scenes, which is a separate concern from authoring them."
      - kind: concept
        heading: Usd, Sdf, and Gf divide the work
        system: >-
          Three modules, three jobs, no overlap worth arguing about. Naturally, contestants argue.
        body: |
          When authoring or querying USD data, you will almost always use a few common modules. Usd
          is the core client-facing module for authoring, composing, and reading USD. It provides
          the interface for creating or opening a stage, plus the generic interfaces for interacting
          with prims, properties, metadata, and composition arcs.

          Sdf, the scene description foundation, provides the foundations for serializing scene
          description to a reference text-based file format and implements scene description layers,
          which store part of the scene description. In practice you will see Sdf most often for
          managing prim and property paths and for creating layers.

          Gf, the graphics foundation, contains the foundation classes and functions that contribute
          graphics: linear algebra, basic mathematical operations, and basic geometry. It holds the
          3D data types you use when getting and setting particular USD attributes.
        points:
          - "Usd owns stages, prims, properties, metadata, and composition arcs."
          - "Sdf owns layers, paths, and the serialized form of scene description."
          - "Gf owns the math and 3D data types that attribute values are expressed in."
      - kind: api
        heading: Importing from the pxr namespace
        system: >-
          One namespace, every module. It is the least confusing thing in this building and I resent
          it slightly.
        body: |
          In Python, these modules are imported from the pxr namespace. A single import line brings
          in as many as you need, which is why nearly every example in this curriculum opens the
          same way.
        code: |
          # Import Usd, Sdf, and Gf libraries from Pixar
          from pxr import Usd, Sdf, Gf

          # Schema domains are modules too, imported the same way.
          from pxr import UsdGeom, UsdShade, UsdPhysics
      - kind: concept
        heading: Schema modules are grouped by domain
        system: >-
          The domain tells you the module. Geometry lives with geometry. Revolutionary, I know.
        body: |
          Alongside the common modules, you will use schema modules. Schemas are grouped into schema
          domains, and each domain has its own module, so which schema module you import depends on
          the kind of scene description you are working with.

          UsdGeom covers geometry data, UsdShade covers materials and shaders, and UsdPhysics covers
          physics scene description. Each schema domain is covered in more depth in the lessons for
          that domain, so the point here is only the mapping: identify the domain your data belongs
          to and the module name follows from it.
        points:
          - "UsdGeom is the schema module for geometry data."
          - "UsdShade is the schema module for materials and shaders."
          - "UsdPhysics is the schema module for physics scene description."
      - kind: work_order
        heading: Six rooms of imports, and nothing has said which module owns what
        system: >-
          Reaching into the wrong module is not a crime. It is merely slow, and slow is expensive
          on this floor.
        body: |
          The Module Desk is the last stop on the Records Clocktower and it changes nothing in the
          city. Every room behind it opened with one line from pxr, and that line has covered
          opening stages, the Sdf value types behind cityName and shelfCount, the Sdf paths behind
          the Archive survey, and the schema classes for Sphere and Xform.

          That mapping has never been stated. Because Usd, Sdf, and Gf arrive together, nothing so
          far has separated them, so Sdf.ValueTypeNames.String reads as a Usd symbol simply
          because it is handed to a call on a prim, and Sdf.Path reads the same way because the
          stage is what consumes it. Away from the Desk the same gap shows up as time spent
          hunting a symbol in the wrong module.

          State the division. Usd is the client-facing module for stages, prims, properties,
          metadata, and composition arcs. Sdf is the scene description foundation behind layers,
          paths, and the serialized text form. Gf is the graphics foundation holding the linear
          algebra and 3D types attribute values are expressed in. A schema module such as UsdGeom
          is none of those three; it follows from the domain the data belongs to.
        points:
          - "Value types and paths come from Sdf, not Usd, even though you use them through Usd calls."
          - "Vector and matrix types come from Gf, so an attribute value built from the wrong module will not match its declared type."
          - "Typed prims come from a schema domain module rather than the core Usd module, so geometry means UsdGeom."
          - "Everything is imported from pxr, so an import that names a package instead of the pxr namespace will not resolve."
      - kind: recap
        heading: What you now know
        body: |
          The repository's four core packages are base, usd, imaging, and usdImaging, and authoring
          only needs the first two. Usd is the client-facing module for stages, prims, properties,
          metadata, and composition. Sdf is the scene description foundation behind layers and
          paths. Gf is the graphics foundation supplying the math types attribute values use. Schema
          modules such as UsdGeom, UsdShade, and UsdPhysics are chosen by domain, and all of them
          are imported from pxr.
    apply:
      f1_module_desk: >-
        No terminal here either. The Desk wants you to name which module opens a stage and hands you
        the generic prim interfaces, what Sdf is actually the foundation of, and where the 3D math
        types you assign to attributes come from. You have imported all three repeatedly. Now say
        why.
