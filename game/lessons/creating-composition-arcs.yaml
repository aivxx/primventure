lessons:
  - source: docs/creating-composition-arcs/sublayers/working-with-sublayers.md
    title: Authoring Sublayers
    objective: Author an ordered list of sublayers on a stage's root layer to combine independent workstreams.
    intro: >-
      Geometry and shading have agreed to occupy separate files, a diplomatic triumph unmatched
      anywhere else in the Composition. You will place both beneath one root layer and decide
      which department gets the louder opinion. The Clerk has already prepared the appeal forms.
    beats:
      - kind: concept
        heading: Sublayers include complete layers
        system: >-
          No remapping, no selective admission, no velvet rope. Every spec in the invited layer
          enters the building.
        body: |
          A sublayer arc includes all scene description from another layer in the same layer stack.
          Paths stay exactly where they were authored: a prim spec at /World/Hull in a sublayer
          contributes to /World/Hull on the composed stage.

          This makes sublayers well suited to independent workstreams such as geometry, shading,
          layout, and lighting. Each producer can edit a smaller document while the root layer
          composes their work into one scene.
        points:
          - A layer and all of its recursively gathered sublayers form one layer stack.
          - Sublayers can add different prims or contribute competing opinions to the same prim and property.
          - Sublayering preserves the source files, enabling collaborative, non-destructive editing.
      - kind: concept
        heading: Over specs contribute without redefining
        system: >-
          An over is a neutral container for disagreement. The sponsors call that a meeting room.
        body: |
          An over specifier supplies opinions at a prim path without defining a new concrete prim.
          A weaker def or class keeps supplying the composed prim's defining specifier even when a
          stronger over sits above it, and that over contributes properties and children on top of
          the prim the def establishes.
        points:
          - "over is short for override or compose over."
          - A shading layer can override /World/Hull while a geometry layer supplies its def and geometry.
          - Distinct children authored in separate sublayers both appear in the composed hierarchy.
      - kind: api
        heading: Edit the root layer's subLayerPaths
        system: >-
          The list is public, mutable, and consequential. This is more authority than contestants
          usually receive before the first commercial break.
        body: |
          GetRootLayer returns the Sdf.Layer anchoring the stage. Its subLayerPaths field is an
          ordered, list-editable sequence of asset paths. Relative paths are resolved relative to
          the layer that authors the sublayer entry.
        code: |
          from pathlib import Path
          from pxr import Sdf, Usd

          stage = Usd.Stage.CreateNew("assembly.usda")
          root_layer: Sdf.Layer = stage.GetRootLayer()

          # First listed is strongest.
          root_layer.subLayerPaths.append("shading.usda")
          root_layer.subLayerPaths.append("geometry.usda")

          root_layer.Save()
          print(list(root_layer.subLayerPaths))
      - kind: work_order
        heading: Assemble both workstreams under one root layer
        system: >-
          Two entries in one list, and their order is the entire negotiation. The broadcast
          graphics department wanted a longer segment.
        body: |
          Sublayer Yards has two finished workstream files sitting beside an empty root layer.
          geometry.usda defines /World and a Hull cube. shading.usda carries an over on
          /World/Hull with a display name on it. Both files are complete and both are saved.

          Nothing combines them. The root layer's subLayerPaths is empty, so the composed stage
          has no /World/Hull at all, and the shading workstream's opinion has no route onto the
          hull that geometry modeled. Two entries in one list are the entire assembly.

          Append shading.usda, then geometry.usda, and save the root layer. Order carries the
          meaning, since the first entry is the strongest, so shading has to precede geometry for
          its display name to win while /World/Hull still resolves as def from the geometry def.
          Asset paths are anchored to the layer that authors them, and the sublayer list is
          metadata on the root layer, so saving the two workstream files persists nothing about
          how they combine.
        points:
          - The first appended path has the highest sublayer strength.
          - A missing layer path produces an unresolved dependency rather than copying its content.
          - Save the root layer after changing subLayerPaths; saving only the child layers is insufficient.
      - kind: recap
        heading: What you now know
        body: |
          Sublayers combine whole layers without path remapping. Author their paths on the root
          Sdf.Layer, list the strongest workstream first, use portable asset paths, and save the
          root layer so the assembly can be reconstructed.
    apply:
      f5_sublayer_workstreams: >-
        Append shading.usda first and geometry.usda second so both workstreams compose at
        /World/Hull and shading remains stronger. Two departments, one hull, several pending grievances.

  - source: docs/creating-composition-arcs/sublayers/what-are-sublayers.md
    title: Sublayer Strength
    objective: Explain sublayer inclusion semantics and order competing opinions from strongest to weakest.
    intro: >-
      Sublayers are an ordered stack of complete documents, because an unordered stack would
      merely be a committee. The first layer speaks loudest. The final layer still speaks, but
      mostly into the minutes of the meeting.
    beats:
      - kind: concept
        heading: Inclusion without remapping
        system: >-
          A sublayer arrives exactly where it was authored. We tried relocating one floor and
          litigation is why nobody agrees which floor is fourth.
        body: |
          Sublayer composition adds every spec from each listed layer to the destination layer
          stack in an include-like fashion. References and payloads remap a source root onto a
          destination prim; sublayers keep every authored path as it stands.

          Matching paths combine into one composed prim. Nonmatching paths coexist, so one layer
          can add a cube while another adds a sphere under the same hierarchy.
        points:
          - Sublayers are appropriate when layers describe the same namespace.
          - Separate workstreams remain independently editable, so producers can work in parallel.
          - New content in a sublayer appears through composition without rewriting sibling workstreams.
      - kind: concept
        heading: First listed is strongest
        system: >-
          This rule is short enough for the live audience to chant. They will still chant it backward.
        body: |
          subLayerPaths is ordered from strongest to weakest. When two sublayers author different
          values for the same property, the opinion in the earlier listed layer wins. The weaker
          opinion remains in the stack and becomes visible if the stronger opinion is removed.

          Opinions authored directly in the root layer are stronger than opinions in any of its
          sublayers. Recursive sublayers are gathered depth first while preserving this ordering.
        points:
          - Root layer opinions are strongest within their layer stack.
          - Among siblings, index 0 is stronger than index 1.
          - Strength resolves conflicts one opinion at a time, and weaker layers stay in the stack.
      - kind: api
        heading: Reorder without rewriting sources
        system: >-
          Promote lighting by moving one string. No vertex is harmed, and geometry will still file a complaint.
        body: |
          Reordering subLayerPaths changes composition without editing either source layer. Replace
          the sequence when the complete order is known, or use normal mutable-sequence operations
          for a targeted change.
        code: |
          from pxr import Usd

          stage = Usd.Stage.Open("city.usda")
          root = stage.GetRootLayer()

          root.subLayerPaths = ["lighting.usda", "layout.usda"]
          assert root.subLayerPaths[0] == "lighting.usda"

          sign_off = stage.GetAttributeAtPath("/World/Marquee.signOff").Get()
          print(sign_off)  # FINAL
          root.Save()
      - kind: work_order
        heading: Promote lighting ahead of layout on the Marquee
        system: >-
          LIVRPS uses "local" with the confidence of a term that knows it will be misunderstood.
          I admire that.
        body: |
          The marquee at /City/ArcHighlands/Marquee takes its sign-off text from two workstreams.
          layout.usda authors /World/Marquee with signOff set to DRAFT. lighting.usda authors the
          same prim with signOff set to FINAL. Both files are finished, and the city's root layer
          lists neither of them.

          So the composed marquee has no signOff to resolve, and the obvious assembly makes it
          worse. Listing the files in the order they were written puts layout at index 0, where
          DRAFT becomes the strongest opinion and lighting speaks into an empty stack. Neither
          file needs editing; only their order does.

          Define /World/Marquee as an Xform, set the root subLayerPaths to lighting.usda followed
          by layout.usda, and stamp the prim's documentation. Watch where FINAL comes from once it
          composes: the winning opinion has to be the one authored in lighting.usda, so typing
          signOff again on the city's own root layer would outrank both workstreams and make the
          promotion meaningless.
        points:
          - The earliest listed sublayer wins, however recently a later one was appended.
          - Choose a sublayer when the requirement is to preserve the same namespace without remapping.
          - Reordering resolves every conflict between the affected layers, well beyond the property currently inspected.
      - kind: recap
        heading: What you now know
        body: |
          Sublayers include complete layers in a shared namespace. The root layer is strongest,
          then listed sublayers proceed from first to last, recursively. Reordering the list changes
          which competing opinions win while preserving every source document.
    apply:
      f5_sublayer_brief: >-
        Read the stack as an ordered list: first listed is strongest, every layer arrives at the
        paths it was authored on, and the weaker opinion waits rather than vanishing.

  - source: docs/creating-composition-arcs/references-payloads/what-are-references.md
    title: Reference Semantics
    objective: Explain how a reference grafts a source prim hierarchy onto a destination prim, and distinguish internal from external references.
    intro: >-
      Three identical prims, one authored building, and a sublayer list that cannot help you.
      References exist for exactly this shape of problem, and the docks would like the vocabulary
      settled before another shipment arrives with three names on it.
    beats:
      - kind: concept
        heading: Sublayers cannot make siblings
        system: >-
          Listing the same layer three times produces one prim and a great deal of confidence. Only
          one of those is useful.
        body: |
          A sublayer contributes every spec at the path it was authored. Listing one sphere layer
          three times therefore contributes three opinions to the same sphere, because nothing in
          the sublayer list can say that the second copy belongs at a different path in the prim
          hierarchy.

          Three copies of one piece of content standing beside each other is a namespace problem,
          not a strength problem. It needs an arc that names both a source and a destination, so
          the same authored hierarchy can arrive at several different paths.
        points:
          - Sublayer inclusion preserves authored paths, so repeated inclusion collides on one prim.
          - A reference names a destination prim, which is what allows several copies to coexist.
          - Copies remain one source document rather than several duplicated hierarchies.
      - kind: concept
        heading: Grafting translates the source namespace
        system: >-
          The building keeps its shape and surrenders its name at the door. Immigration for prims.
        body: |
          A reference grafts a prim hierarchy from one layer onto a prim of another layer. The
          referenced prim takes on the destination prim's name, and every descendant path is
          translated to reflect the destination's namespace.

          That translation is what makes references suited to modularity and reuse. One published
          asset can be composed at red_cube_01, red_cube_02, and anywhere else a consumer needs it,
          while the asset itself remains a single independently editable document.
        points:
          - Path translation rewrites the source paths into the destination's namespace.
          - The same asset can be referenced many times to aggregate a large scene from small units.
          - Libraries developed in parallel can be aggregated without duplicating anyone's work.
      - kind: api
        heading: External and internal targets
        system: >-
          One arc points at another document, the other points across the room. Both are references.
        body: |
          An external reference targets a prim in a different layer, which is the usual case for
          assets published by another team. An internal reference targets a prim in the current
          layer stack, which is convenient when several destinations should track one locally
          authored hierarchy.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("factory.usda")
          UsdGeom.Xform.Define(stage, "/World")

          # External: the conveyor asset lives in its own document.
          belt = UsdGeom.Xform.Define(stage, "/World/conveyor_01").GetPrim()
          belt.GetReferences().AddReference("conveyor.usd")

          # Internal: this destination tracks a prim in the current layer stack.
          copy = UsdGeom.Xform.Define(stage, "/World/conveyor_02").GetPrim()
          copy.GetReferences().AddInternalReference(Sdf.Path("/World/conveyor_01"))

          stage.GetRootLayer().Save()
      - kind: work_order
        heading: One tower asset, several addresses on the skyline
        system: >-
          Two published documents can furnish a three-building skyline, and the arithmetic is the
          whole point.
        body: |
          Reference Docks holds two finished buildings in the city asset library, and the skyline
          on order needs three towers standing on a stage that currently has nothing beneath its
          /World Xform.

          Two documents cannot cover three addresses by being listed twice in a layer stack, since
          every inclusion would contribute at the paths the building was authored on and produce one
          tower with several opinions. Copying a hierarchy into the stage would fill the skyline
          while leaving three separate documents for the teams who own those buildings to maintain
          separately.

          Each destination prim needs defining and then an arc naming the asset it composes, with
          one building named twice. Path translation is what keeps the two copies distinct, since
          each arc rewrites the source hierarchy beneath the destination prim that carries it.
        points:
          - Name the destination prim first; the arc composes the source beneath it.
          - Two destinations naming one asset is reuse, and the asset stays a single document.
          - Prefer an internal reference when the source hierarchy is authored in the current layer stack.
      - kind: recap
        heading: What you now know
        body: |
          References graft a source prim hierarchy onto a destination prim and translate the source
          paths into the destination's namespace. They compose small assets into large aggregates,
          they can be external or internal, and one source can serve any number of destinations.
    apply:
      f5_reference_brief: >-
        Read a reference as a graft with an address change: the source hierarchy arrives beneath the
        destination prim under the destination's name, which is what a sublayer list can never do.

  - source: docs/creating-composition-arcs/references-payloads/working-with-references.md
    title: Authoring References
    objective: Author internal and external references that reuse asset hierarchies at destination prims.
    intro: >-
      The skyline needs three towers and has budget for two source assets. References solve this
      without photocopying a single building, which disappoints the city's toner sponsor. Each
      destination receives composed scene description while the source remains independently editable.
    beats:
      - kind: concept
        heading: References map reusable scene description
        system: >-
          One asset, several towers, and only one file to blame. This is operational maturity.
        body: |
          A reference arc composes a source prim and its descendants onto a destination prim. An
          external reference names another layer; an internal reference targets a prim in the
          current layer stack.

          Each destination can add stronger local opinions such as transforms or display names.
          Those changes affect the composed instance at that destination while the referenced
          source layer and every other destination stay as authored.
        points:
          - References reuse authored assets without copying their specs.
          - References are always composed while their stage is open; they cannot be unloaded.
          - Multiple references can be list-edited on the same prim.
      - kind: concept
        heading: Default prim supplies an omitted target
        system: >-
          If you omit the address, the source had better name its front door. The Gatekeeper
          considers guessing beneath both of you.
        body: |
          An external reference consists of an asset path and, optionally, a prim path. If the
          prim path is omitted, USD targets the referenced layer's default prim. If that layer has
          no default prim, USD cannot automatically select the intended hierarchy.

          Supplying a prim path explicitly avoids that dependency. Only the targeted prim and its
          descendants compose at the destination, leaving unrelated source siblings behind.
        points:
          - Relative asset paths are resolved relative to the layer authoring the reference.
          - A reference to a default prim is concise and supports asset-level interchange.
          - The source hierarchy is remapped beneath the destination prim.
      - kind: api
        heading: Add references through UsdReferences
        system: >-
          GetReferences hands over the control panel. Pull the correct lever.
        body: |
          Usd.Prim.GetReferences returns a UsdReferences editing interface. AddReference authors
          an external reference; AddInternalReference authors a reference within the current layer
          stack. Authoring occurs in the stage's current edit target.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("city.usda")
          UsdGeom.Xform.Define(stage, "/World")

          tower_a = UsdGeom.Xform.Define(stage, "/World/TowerA").GetPrim()
          tower_a.GetReferences().AddReference("skyscraperA.usd")

          tower_e = UsdGeom.Xform.Define(stage, "/World/TowerE").GetPrim()
          tower_e.GetReferences().AddReference(
              "skyscraperE.usd", Sdf.Path("/World")
          )

          copy = UsdGeom.Xform.Define(stage, "/World/TowerCopy").GetPrim()
          copy.GetReferences().AddInternalReference(Sdf.Path("/World/TowerA"))
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Three destination prims, two source assets
        system: >-
          Editing the source changes every consumer. The Clerk has declined three applications to
          register Surprise as a composition arc.
        body: |
          Reference Docks stocks two finished buildings in the city asset library, skyscraperA.usd
          and skyscraperE.usd. The stage waiting for them holds a single /World Xform with nothing
          beneath it, and the skyline on order is three towers.

          Two assets, three towers, and no arc between them. One building has to appear twice,
          which is the part worth getting right. Copying a source hierarchy into the stage would
          fill the skyline and leave three separate documents to maintain, and the teams who own
          those buildings could no longer keep working in their own files.

          Define /World/skyscraperA_01, /World/skyscraperA_02, and /World/skyscraperE_01, then
          call GetReferences().AddReference on each with the asset path. Both A destinations name
          the same file, which is what makes this reuse rather than duplication. Neither call
          supplies a prim path, so each arc targets the default prim of the referenced layer, and
          a relative asset path is anchored to the layer authoring it rather than to wherever the
          code runs.
        points:
          - Supply primPath explicitly unless the source layer defines the intended default prim.
          - Keep required dependencies inside the referenced source hierarchy.
          - Use payloads when heavy content must be loadable on demand.
      - kind: recap
        heading: What you now know
        body: |
          References compose reusable source hierarchies at destination prims. Add them through
          GetReferences, rely on a default prim only when one exists, and author destination-local
          overrides without duplicating or mutating the source asset.
    apply:
      f5_skyline_references: >-
        Define two destination prims referencing skyscraperA.usd and one referencing
        skyscraperE.usd. The skyline wants reuse, not three independently maintained monuments to poor judgment.

  - source: docs/creating-composition-arcs/encapsulation/what-is-encapsulation.md
    title: Encapsulation
    objective: Structure an asset so every required prim and relationship target is contained beneath its referenced root.
    intro: >-
      A cube arrives with its material binding and without its material. This is considered
      avant-garde only by people who do not maintain pipelines. Put every dependency under the
      asset's default prim before Reference Docks loses another shipment.
    beats:
      - kind: concept
        heading: Composition follows the targeted subtree
        system: >-
          The reference brings descendants, not neighbors, cousins, or the suspicious Scope next door.
        body: |
          A prim is encapsulated relative to a referenced target when it lies beneath that target
          in namespace. Referencing the target composes the target and its descendants at the
          destination, and sibling prims outside that subtree stay behind.

          Asset encapsulation therefore means placing all scene description required by an asset
          beneath the root prim intended for composition.
        points:
          - A default prim commonly identifies the asset root used by external references.
          - Geometry, materials, rig data, and other private support prims should remain inside that root.
          - Encapsulation creates a portable composition boundary.
      - kind: concept
        heading: Relationships must survive remapping
        system: >-
          A binding to a missing material is still a relationship. It is simply a relationship
          with the emotional range of this city's procurement office.
        body: |
          Relationship targets such as material bindings are paths. If a cube under /World binds
          to /Looks/Red, referencing /World brings the cube but not its sibling /Looks, leaving
          the target unavailable in the new context.

          Moving Looks to /World/Looks places both ends of the relationship inside the referenced
          namespace. USD can then remap the complete subtree together at each destination.
        points:
          - Encapsulation applies to every dependency, visible geometry and support data alike.
          - A valid source-stage relationship can become ineffective after composition if its target is outside the boundary.
          - Private asset support namespaces commonly use Scope prims beneath the asset root.
      - kind: api
        heading: Build a self-contained asset root
        system: >-
          One front door, all departments inside. The fire marshal objects, but composition is delighted.
        body: |
          Define the asset root, set it as the layer's default prim, and place required support
          prims beneath it. Material bindings authored through UsdShade then target scene
          description that travels with the asset.
        code: |
          from pxr import Usd, UsdGeom, UsdShade

          stage = Usd.Stage.CreateNew("encapsulated.usda")
          world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
          cube = UsdGeom.Cube.Define(stage, "/World/Cube").GetPrim()
          UsdGeom.Scope.Define(stage, "/World/Looks")
          red = UsdShade.Material.Define(stage, "/World/Looks/Red")

          UsdShade.MaterialBindingAPI.Apply(cube).Bind(red)
          stage.SetDefaultPrim(world)
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Move the material inside the asset root
        system: >-
          It worked in the asset file is the traditional opening statement before the boss music.
        body: |
          The kiosk asset at Reference Docks is a cube and one red material, and the open question
          is where that material sits relative to the prim a consumer will reference. Nothing in
          the city stands as that asset root yet.

          The defect this job exists to prevent is a Looks scope authored as a sibling of /World.
          On the stage where it was written everything looks correct, since /World and /Looks are
          both root-level prims and the binding resolves. Reference /World from another stage and
          only the cube arrives, its binding pointed at a material that does not exist in the new
          context.

          Define /World as an Xform, put both /World/Cube and /World/Looks/Red beneath it, mark
          /World as the default prim with SetDefaultPrim, and document that root. Nothing may
          remain at /Looks, because a material one level too high is invisible on the authoring
          stage and missing at every destination. The default prim is what tells consumers which
          root to reference.
        points:
          - Setting /World as default prim leaves sibling /Looks outside its subtree.
          - Referencing a layer with a target prim composes that prim's subtree alone.
          - Avoid external relationship targets unless the asset contract explicitly requires the consumer to provide them.
      - kind: recap
        heading: What you now know
        body: |
          A reference composes only its targeted prim subtree. Keep geometry, materials, bindings,
          and other required dependencies beneath the asset root, make that root the default prim,
          and test the asset from a referencing stage.
    apply:
      f5_encapsulation_brief: >-
        Read encapsulation as one namespace boundary: a reference carries its target's descendants,
        so a binding survives only when both of its ends sit inside that subtree.

  - source: docs/creating-composition-arcs/encapsulation/experimenting-with-encapsulation.md
    title: Reading Encapsulation
    objective: Inspect an asset's hierarchy to judge its encapsulation, and predict what composes for a given reference target.
    intro: >-
      Two kiosk packs, one bench, and no way to tell them apart from the outside. Both open without
      complaint in their own file. Only one of them survives being referenced, and the tell is
      visible in the hierarchy before anything is composed.
    beats:
      - kind: concept
        heading: The hierarchy is the evidence
        system: >-
          Expand the tree, look above the default prim, and the diagnosis takes about four seconds.
        body: |
          A well encapsulated layer shows every prim the asset needs beneath the root a consumer is
          meant to reference, which is usually the layer's default prim. Geometry, materials, and
          any private support scopes all sit inside that one subtree.

          The unencapsulated version of the same asset looks almost identical, except that its
          material sits in a Looks scope beside the asset root rather than inside it. On its own
          stage both layers resolve their bindings, because both ends of the relationship exist as
          root-level prims, so nothing in the authoring context reports a problem.
        points:
          - Read the tree relative to the prim a consumer references, not relative to the file.
          - A support scope beside the asset root is the common shape of the defect.
          - An asset can resolve correctly in its own file and still be unusable through a reference.
      - kind: concept
        heading: Composition reports the stranded target
        system: >-
          The warning names the path, the relationship, and the arc. It is the most helpful sentence
          in the whole harbor.
        body: |
          Reference the unencapsulated root into another layer and only the cube arrives. Its
          material binding still names the original external path, which now refers to a path
          outside the scope of the reference, and USD reports that and ignores the target.

          The composed result is a mesh with a binding that resolves to nothing. Nothing about the
          arc is invalid, so the arc is composed as authored; only the relationship target falls
          outside the boundary the reference established.
        points:
          - A relationship target outside the referenced subtree is reported and then ignored.
          - The remaining scene description still composes, which is why the defect is easy to miss.
          - Reading the composition warnings names the exact relationship and arc involved.
      - kind: api
        heading: Test the asset from a consuming stage
        system: >-
          The only opinion that counts is the one a consumer composes. Ask it directly.
        body: |
          Encapsulation is confirmed by referencing the asset from another stage and inspecting what
          arrives. Composing both roots side by side shows which subtree carried its dependencies
          and which one left them behind.
        code: |
          from pxr import Usd, UsdGeom, UsdShade

          stage = Usd.Stage.CreateNew("references_encapsulation.usda")
          UsdGeom.Xform.Define(stage, "/World")

          good = UsdGeom.Xform.Define(stage, "/World/encapsulated_01").GetPrim()
          good.GetReferences().AddReference("encapsulated_GOOD.usd")

          bad = UsdGeom.Xform.Define(stage, "/World/unencapsulated_01").GetPrim()
          bad.GetReferences().AddReference("unencapsulated_BAD.usd")

          for name in ("encapsulated_01", "unencapsulated_01"):
              cube = stage.GetPrimAtPath(f"/World/{name}/Cube")
              binding = UsdShade.MaterialBindingAPI(cube).GetDirectBinding()
              print(name, binding.GetMaterialPath())
      - kind: concept
        heading: The target prim moves the boundary
        system: >-
          Aim one level too low and a correctly built asset arrives half dressed. The asset was fine.
        body: |
          A reference can name a source prim as well as an asset path, and the encapsulation
          boundary is measured against whatever prim is named. Targeting the Cube inside a well
          encapsulated asset composes the cube alone, because the material sits above the prim the
          arc targeted rather than beneath it.

          The same warning appears, this time describing a target above the referenced prim. Reading
          it carefully distinguishes an asset that was built wrong from an asset that was consumed
          wrong, and those have different repairs.
        points:
          - Naming a descendant as the source prim narrows the boundary to that descendant's subtree.
          - A default prim exists to tell consumers which root the asset intends to be referenced at.
          - Two identical warnings can describe an authoring defect and a consumption mistake.
      - kind: work_order
        heading: Put the kiosk material inside the root a consumer names
        system: >-
          One front door, every department behind it, and a default prim saying which door that is.
        body: |
          The kiosk on the bench is a cube and one red material, and the open question is where that
          material sits relative to the prim a consumer will reference. Nothing in the city yet
          stands as that asset root.

          Authored as a sibling of the asset root, the material resolves on this stage and disappears
          at every destination, because the arc carries the target's descendants and nothing above
          them. Leaving the material where it is and asking consumers to target a descendant only
          narrows the boundary further.

          The asset root needs defining as an Xform with both the cube and the material scope
          beneath it, that root marked as the default prim, and its documentation stamped. Nothing
          may remain outside the root, since a material one level too high is invisible from any
          consuming stage.
        points:
          - Keep every dependency beneath the prim the asset intends consumers to reference.
          - Mark that prim as the default prim so an arc without a prim path finds it.
          - Confirm the repair by referencing the asset from another stage and inspecting the binding.
      - kind: recap
        heading: What you now know
        body: |
          Judge encapsulation by reading the hierarchy above and below the prim a consumer
          references. A dependency outside that subtree is reported as a target beyond the scope of
          the reference and then ignored, and the same shape of mistake can come from how the asset
          was built or from which prim the arc names.
    apply:
      f5_encapsulation_survey: >-
        Read both packs from the consumer's side: what composes is the targeted prim's subtree, so
        judge the layer and the named source prim as two separate decisions.

  - source: docs/creating-composition-arcs/variant-sets/what-are-variant-sets.md
    title: Variant Set Semantics
    objective: Explain how a variant set switches between alternative representations, and weigh the cost of the switches it offers.
    intro: >-
      One lamp with a switch on it beats two lamps filed separately, and one character with an
      outfit variant set beats tracking coats in a spreadsheet. The wardrobe department has opinions
      about how many switches is too many, and for once they are correct.
    beats:
      - kind: concept
        heading: One controller, many variations
        system: >-
          The variant set is the dial. The variants are the settings. Only the chosen setting is
          composed, which is more restraint than anything else in this city shows.
        body: |
          A variant set defines alternative representations of the same dataset that can be switched
          at runtime. The variations themselves are called variants, and only the opinions of the
          selected variant are composed onto the stage.

          A character with several outfits is the classic case. Authored as one asset with an outfit
          variant set, the combination is selected rather than assembled, so nobody has to track the
          character and the clothing as separate things and reunite them per shot.
        points:
          - A variant set is authored on a prim and controls variations of that prim's subtree.
          - Only the selected variant contributes opinions to the composed stage.
          - The author decides what a variant set varies, and narrow scope makes selections predictable.
      - kind: concept
        heading: What a single variant may author
        system: >-
          Properties, new prims, or entire arcs. The dial has more range than the label suggests.
        body: |
          A variant can sparsely override properties on the prim holding the variant set or on any
          of its descendants, such as changing a material's diffuse color from blue to green.

          A variant can also define new descendant prims, so one variant contributes a single cube
          and another contributes two. It can even author composition arcs that exist only within
          that variant, which is how one variant references a blue material while another references
          a green one from the same materials layer.
        points:
          - Sparse property overrides are the lightest thing a variant can carry.
          - Variants can define descendant prims, so the hierarchy itself can vary.
          - An arc authored inside a variant exists only while that variant is selected.
      - kind: concept
        heading: Combinations are authored, not free
        system: >-
          Four combinations from two dials, and someone still has to author the wet character
          without the hat.
        body: |
          Several variant sets on one prim can be selected independently, which multiplies out into
          many combinations. A geometric variant set controlling shape and a shading variant set
          controlling materials is a common and well behaved pairing.

          Each combination still needs its data authored. Adding variant sets freely produces
          combinations nobody will ever select, and skipping the data for combinations that are
          selectable leaves an end user holding a selection that does nothing.
        points:
          - Independent variant sets multiply into combinations that all have to be authored.
          - Unused combinations are wasted authoring; unauthored ones are a poor experience.
          - Geometric and shading variant sets are a conventional split of responsibilities.
      - kind: api
        heading: Weigh the switch before offering it
        system: >-
          Some dials only re-resolve a value. Others rebuild the composition. Turn them at different
          frequencies.
        body: |
          Switching a variant that only changes attribute values or visibility is comparatively
          cheap, because the composition index stays as it is and only resolved values change.
          Switching a variant that changes a reference target or an activation opinion is more
          expensive, because part of the composition index has to be rebuilt.
        code: |
          from pxr import Usd

          stage = Usd.Stage.Open("street_lamp.usda")
          lamp = stage.GetPrimAtPath("/World/StreetLamp")

          lights = lamp.GetVariantSet("lights")
          print(lights.GetVariantNames(), lights.GetVariantSelection())

          # Re-resolving values on a selection change is the inexpensive case.
          lights.SetVariantSelection("off")
          print(stage.GetAttributeAtPath("/World/StreetLamp.lampState").Get())
      - kind: work_order
        heading: One switch for the lamp the night scenes keep dimming
        system: >-
          Two settings on one dial, scoped to the lamp, and predictable to anyone who finds it.
        body: |
          The lamp standing on Inherit Street burns at one intensity around the clock, and the night
          scenes need it dark without a second lamp asset being published beside it.

          Two lamps would mean two documents to maintain and a manual swap wherever the street
          appears. Authoring the dark values directly on the lamp would settle tonight's scene and
          erase the lit one, since a local opinion is a single value rather than a choice.

          What the lamp needs is one variant set holding two named settings, each authoring the
          globe's intensity and the lamp's own state, with a selection recorded on the prim. Scope
          it to the lighting alone, because a dial that also swaps geometry is a dial nobody can
          predict.
        points:
          - Author the variant set on the prim whose subtree the variations belong to.
          - Keep one variant set to one kind of variation so selections stay predictable.
          - Record a selection, since an unselected variant set composes none of its variants.
      - kind: recap
        heading: What you now know
        body: |
          A variant set is a controller for variations of one prim's subtree, and only the selected
          variant composes. Variants can override properties, define descendant prims, and author
          arcs of their own. Every combination costs authoring, and value or visibility switches are
          cheaper to flip than switches that rebuild composition.
    apply:
      f5_variant_brief: >-
        Read a variant set as one dial with named settings: the selection decides what composes, a
        variant may reach the prim and its descendants, and cheap switches only re-resolve values.

  - source: docs/creating-composition-arcs/variant-sets/working-with-variant-sets.md
    title: Authoring Variant Sets
    objective: Author a variant set with named variants, populate each variant through its edit context, and record a selection.
    intro: >-
      The lamp needs a switch, and a switch is three calls and a context manager. The wardrobe
      department has requested a longer segment; the wiring genuinely does not need one.
    beats:
      - kind: concept
        heading: A selection decides what composes
        system: >-
          Change the selection and the shader's diffuse color follows. Nothing else in the file moves.
        body: |
          Inspecting a stage with a color variant set shows the selection recorded on the prim that
          holds the set. Choosing blue resolves the shader's diffuse color to blue, and choosing red
          resolves the same property to red, while every other authored value stays exactly as it was.

          What varies is the opinion contributed by the selected variant. The property being
          overridden lives on a descendant of the prim carrying the variant set, which is why one
          dial on a lamp or a character can reach an entire subtree.
        points:
          - The selection is recorded on the prim that holds the variant set.
          - Only the selected variant contributes its opinions to the composed stage.
          - A variant reaches the prim holding the set and every descendant beneath it.
      - kind: concept
        heading: Variants can add prims and arcs
        system: >-
          One setting contributes a row of shelving. Another contributes a reference. The dial is
          doing considerably more than paint.
        body: |
          A variant set that defines prims changes the hierarchy as the selection changes, which is
          how one shelf asset offers several sizes by defining an extra row inside one variant
          rather than publishing several shelves.

          A variant can also carry a composition arc. Selecting a color can change which prim a
          material reference targets, so the composed material arrives from a different source prim
          in the same materials layer depending on the setting.
        points:
          - Defining descendant prims inside a variant varies the hierarchy itself.
          - An arc authored inside a variant is composed only while that variant is selected.
          - Inspecting the varying prim shows which source the current selection composes from.
      - kind: api
        heading: Add the set, then edit inside each variant
        system: >-
          GetVariantEditContext points your authoring calls at the variant instead of the prim.
          Everything typed inside it lands in the setting you selected.
        body: |
          Usd.Prim.GetVariantSets returns the editing interface, and AddVariantSet authors the set
          itself. AddVariant names each setting, SetVariantSelection chooses which one is active,
          and GetVariantEditContext redirects authoring into the selected variant for the duration
          of the with block.
        code: |
          from pxr import Sdf, Usd, UsdGeom, UsdLux

          stage = Usd.Stage.CreateNew("street_lamp.usda")
          UsdGeom.Xform.Define(stage, "/World")
          lamp = UsdGeom.Xform.Define(stage, "/World/StreetLamp").GetPrim()
          globe = UsdLux.SphereLight.Define(stage, "/World/StreetLamp/Globe")

          lights = lamp.GetVariantSets().AddVariantSet("lights")
          lights.AddVariant("on")
          lights.AddVariant("off")

          lights.SetVariantSelection("on")
          with lights.GetVariantEditContext():
              globe.CreateIntensityAttr(1000.0)

          lights.SetVariantSelection("off")
          with lights.GetVariantEditContext():
              globe.CreateIntensityAttr(0.0)

          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Two settings for the lamp, parked on off
        system: >-
          Author both settings before choosing one. A dial with a single position is a value with
          extra steps.
        body: |
          The lamp on the stage is an Xform with a sphere light beneath it, and neither prim carries
          an intensity or a state of its own. A helper is available that authors both of those
          opinions together for whichever setting is being edited.

          With no variant set on the lamp there is no switch to select, and the tempting shortcut
          makes the switch useless. Authoring an intensity directly on the globe puts a local opinion
          on the prim, and a local opinion outranks every variant, so the dial would turn without
          the light ever changing.

          The lamp needs a variant set named for the lighting, holding a lit setting and a dark
          setting, each populated inside its own edit context, with the dark setting left selected.
          Both values belong inside the variants rather than on the prims themselves.
        points:
          - Author the values inside the variant edit context, never directly on the prim as well.
          - A local opinion on the same property outranks every variant in the set.
          - The recorded selection is what the stage composes when it opens.
      - kind: recap
        heading: What you now know
        body: |
          Author a variant set with AddVariantSet, name each variant with AddVariant, populate one
          at a time inside GetVariantEditContext, and record the active setting with
          SetVariantSelection. Variants can override properties, define prims, and carry arcs, and
          a competing local opinion on the same property outranks all of them.
    apply:
      f5_lamp_variants: >-
        Give the lamp a lights set holding on and off, author each setting inside its own edit
        context through the helper, and leave off selected. One dial, two settings, no local override.

  - source: docs/creating-composition-arcs/references-payloads/working-with-payloads.md
    title: Authoring Payloads
    objective: Author payload arcs and control their loaded state through the OpenUSD Python API.
    intro: >-
      The harbor contains three buildings disguised as cargo and would prefer not to unpack them
      until requested. Payloads grant that wish while preserving composition. The Harbor Master
      calls this laziness because efficiency threatens his staffing model.
    beats:
      - kind: concept
        heading: Payloads compose deferred content
        system: >-
          The crate remains visible in the manifest while its expensive descendants sleep. I have
          requested the same arrangement for contestants.
        body: |
          A payload arc maps source scene description onto a destination prim like a reference,
          but its contributed content can be loaded or unloaded. When unloaded, the payload arc
          remains authored while the scene description across it is excluded from composition.

          The destination prim and its local opinions remain available, providing a lightweight
          entry point that users can discover and load.
        points:
          - Loaded payloads contribute their targeted hierarchy and downstream composition dependencies.
          - Unloading recomposes affected prims and removes payload-contributed descendants from the stage.
          - References are always composed, so load control belongs to payloads alone.
      - kind: concept
        heading: Payload targets follow reference rules
        system: >-
          Same address form, different cargo policy. Even bureaucracy occasionally reuses an interface.
        body: |
          An external payload identifies an asset path and optional prim path. Omitting the prim
          path targets the source layer's default prim. A payload may also target an internal prim
          in the current layer stack.

          Payload arcs are list-editable, so a prim can carry more than one. They are weaker than
          reference arcs in LIVRPS.
        points:
          - Relative payload asset paths are anchored to the authoring layer.
          - Source assets should be encapsulated beneath the targeted or default prim.
          - Reserve payloads for deferrable bulk and keep essential lightweight interface data outside them.
      - kind: api
        heading: Add, unload, and load
        system: >-
          Three methods operate the cargo doors. The harbor still employs seventeen people to lose the keys.
        body: |
          GetPayloads returns the UsdPayloads editing interface and AddPayload authors the arc in
          the current edit target. Load and Unload operate on a composed prim's load state rather
          than deleting the authored arc.
        code: |
          from pxr import Usd, UsdGeom

          stage = Usd.Stage.CreateNew("city.usda")
          UsdGeom.Xform.Define(stage, "/World")

          building = UsdGeom.Xform.Define(stage, "/World/Building").GetPrim()
          building.GetPayloads().AddPayload("sm_bldgF.usd")
          assert building.HasPayload()

          building.Unload()
          assert not building.IsLoaded()
          building.Load()
          assert building.IsLoaded()

          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Author three deferred building destinations
        system: >-
          One closes the crate. The other throws away the shipping order. The insurers care deeply.
        body: |
          Payload Berth holds the small building pack, sm_bldgF.usd, in the city asset library as
          heavy cargo nobody has unpacked. The stage that will carry it has /World and no children
          at all.

          Three copies of that pack belong on this block. Referencing them would compose all three
          the moment anyone opens the stage, leaving no way to inspect the block while keeping the
          bulk out of memory, which is the reason the berth exists in the first place.

          Define /World/sm_bldgF_01, _02, and _03, call GetPayloads().AddPayload with the asset
          path on each, and save the root layer. Every destination carries its own arc, since one
          prim holding three payloads composes something different. Load state is stage state at
          runtime and never lands in the file, so what persists is the arc AddPayload authors,
          which Unload deliberately leaves in place when it empties the crate.
        points:
          - Unloading a payload removes all scene description composed across that payload arc.
          - Local properties on the payload prim can remain available while its deferred contents are unloaded.
          - Saving after AddPayload persists the arc; load state itself is runtime stage state.
      - kind: recap
        heading: What you now know
        body: |
          Author payloads with GetPayloads().AddPayload, target a default prim or explicit prim
          path, and use Load and Unload to control deferred composition without erasing the arc.
    apply:
      f5_sealed_crate: >-
        Payload sm_bldgF.usd onto all three building destination prims and save the manifest.
        They may sleep until summoned; the validators, regrettably, never do.

  - source: docs/creating-composition-arcs/references-payloads/what-are-payloads.md
    title: Payload Semantics
    objective: Choose payloads for deferred scene description and manage stage load sets efficiently.
    intro: >-
      A city can be too large to load merely because someone opened the file. Payloads let you
      inspect the map before manifesting every warehouse, vehicle, and regrettable statue. Memory
      usage falls, load time improves, and the sponsors claim credit.
    beats:
      - kind: concept
        heading: References with a load gate
        system: >-
          A reference enters immediately. A payload waits for its cue, unlike every contestant in casting.
        body: |
          Payloads and references both compose a targeted source hierarchy at a destination prim.
          Their defining difference is population control: reference content is always composed,
          while payload content can be loaded and unloaded on demand.

          Loading crosses the payload arc and composes the targeted layers and further dependencies.
          Unloading excludes that contributed scene description and recomposes the affected subtree.
        points:
          - Payloads retain composition structure without requiring all heavy data in memory.
          - Payload arcs are list-editable like references.
          - In LIVRPS, payload opinions are weaker than reference opinions and stronger than specializes.
      - kind: concept
        heading: Load only the working set
        system: >-
          Load one city block, not the entire city. The collapse is architectural, not an invitation.
        body: |
          A large stage can open with every payload unloaded, exposing lightweight hierarchy and
          authored payload prims without composing bulk content. A tool or user can then load only
          the branches needed for the current task.

          This reduces initial load time, memory consumption, and rendering work. The benefit grows
          when a stage contains many independently useful asset payloads.
        points:
          - "Usd.Stage.LoadNone opens a stage without initially loading payloads."
          - "Usd.Stage.LoadAll is the normal initial load policy."
          - Load state can be controlled at individual prims or over broader subtrees.
      - kind: api
        heading: Open unloaded and populate selectively
        system: >-
          The manifest first, the cargo second. Somewhere, a streaming service executive feels understood.
        body: |
          Pass a load policy when opening the stage, inspect loadable payload roots, then load the
          required prim. Prim.Load loads payloads beneath that prim; Prim.Unload removes their
          contributed content from the composed stage.
        code: |
          from pxr import Usd

          stage = Usd.Stage.Open("city.usda", load=Usd.Stage.LoadNone)
          print(stage.FindLoadable())

          block = stage.GetPrimAtPath("/World/CityBlock")
          block.Load()
          assert block.IsLoaded()

          block.Unload()
          assert not block.IsLoaded()
      - kind: work_order
        heading: A crate that stays readable while unloaded
        system: >-
          If unloading the warehouse also erases the sign telling you where the warehouse is,
          your interface has joined the boss faction.
        body: |
          The block at Payload Berth now carries three deferred buildings, and /World/CargoCrate is
          the crate the Harbor Master keeps demanding be opened. That crate is not on the stage
          yet.

          So the city defers cargo and offers nothing lightweight that describes it. A crate whose
          contents stay unloaded is only useful when the information needed to decide whether to
          load it remains composed, and no such entry point exists anywhere on the block.

          Define /World/CargoCrate as an Xform, author a payload on it targeting sm_bldgF.usd, and
          stamp its documentation. Author that documentation as a local opinion on the crate prim
          rather than inside the payloaded asset, or the label travels with the cargo and vanishes
          the moment the crate is unloaded. Unloading never removes the arc itself, so the saved
          layer still carries the payload once the contents are asleep.
        points:
          - "Load state differs from visibility: unloaded data is absent from composition, while hidden data still composes."
          - Efficiency still depends on asset structure, which a payload alone cannot repair.
          - Flattening the stage to sidestep payload population trades one problem for a much larger file.
      - kind: recap
        heading: What you now know
        body: |
          Payloads are reference-like arcs with demand loading. Open large stages with LoadNone,
          discover or navigate to payload roots, and load only the working set while keeping
          lightweight interface opinions available.
    apply:
      f5_payload_brief: >-
        Read the load gate: a payload targets its source exactly as a reference does, and unloading
        excludes what lies across the arc while the arc itself stays authored.

  - source: docs/creating-composition-arcs/inherits-specializes/what-is-inherits.md
    title: Inherits and Classes
    objective: Author class prims and inherits arcs that broadcast reusable opinions across composition contexts.
    intro: >-
      Every street lamp wants the same temperature and none wishes to admit it. A class prim will
      hold the shared opinion; inherits will broadcast it. The electricians union calls this
      collective authoring and has requested a better trailer.
    beats:
      - kind: concept
        heading: Inherits broadcast through a namespace
        system: >-
          Change one source, update every inheritor in this composition context. The audience calls it magic; payroll calls it leverage.
        body: |
          An inherits arc applies prim and property specs from a source prim hierarchy to a
          destination prim. Unlike a reference, an inherit source acts as a global namespace that
          stronger layers can override, broadcasting those changes to all inheriting prims even
          across referenced layer stacks.

          Each inheriting prim can still receive a stronger local opinion for individual customization.
        points:
          - Descendant specs under the inherit source can also be applied to matching descendants at destinations.
          - Broadcast overrides affect only the composition context in which they are authored.
          - Editing the original asset layer itself can affect every stage that consumes that asset.
      - kind: concept
        heading: Class prims hold abstract data
        system: >-
          The class influences the entire city while never appearing in it. Middle management, essentially.
        body: |
          A class specifier marks a prim hierarchy intended as a source for inherits or specializes
          arcs. It communicates abstract intent and prevents Hydra from imaging the class prim or
          its descendants.

          Class prims are commonly placed in an unencapsulated root namespace such as
          /_street_lamp_dbl so stronger layers can address and override that shared source.
        points:
          - A class prim can carry properties and descendants like other prim specs.
          - Normal stage traversal skips class prims, and renderers leave them unimaged.
          - The underscore naming convention is common but the class specifier supplies the behavior.
      - kind: api
        heading: Create a class and inherit it
        system: >-
          One abstract lamp, one concrete lamp, and no duplicated thermostat paperwork. Riveting television.
        body: |
          CreateClassPrim authors a class spec. GetInherits returns the UsdInherits editing
          interface, and AddInherit adds the source Sdf.Path to the destination's inherit list.
        code: |
          from pxr import Sdf, Usd

          stage = Usd.Stage.CreateNew("lamps.usda")
          lamp_class = stage.CreateClassPrim("/_street_lamp_dbl")
          lamp_class.CreateAttribute(
              "temperature", Sdf.ValueTypeNames.Int
          ).Set(2700)

          lamp = stage.DefinePrim("/World/StreetLamp", "Xform")
          lamp.GetInherits().AddInherit(lamp_class.GetPath())

          assert lamp.GetAttribute("temperature").Get() == 2700
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: One shared temperature for every lamp
        system: >-
          Global namespace is a phrase with excellent menace and several important footnotes.
        body: |
          Inherit Street has one fixture standing: /World/StreetLamp, an Xform whose fixture
          attribute reads double. It has no temperature, and nothing anywhere in the namespace
          holds shared lamp policy.

          Typing 2700 onto that lamp would light one fixture and teach the street nothing. The next
          lamp installed would need its own copy of the value, and an electrician retuning the
          color temperature would have to visit every lamp on the street. What the street needs is
          a single abstract source it can be corrected from.

          Create the class prim /_street_lamp_dbl, author temperature 2700 on it, then call
          GetInherits().AddInherit with that path on the lamp. The composed 2700 arrives across the
          arc instead of being authored at the fixture, which is what lets a later correction to
          the class reach every lamp inheriting it. The class specifier keeps that source out of
          traversal and unimaged; the leading underscore is convention alone.
        points:
          - Use a class specifier when the source should be abstract and non-imageable.
          - Changes authored in one consuming scenario stay within it and leave independent scenarios alone.
          - Use references for isolated reusable instances and inherits when coordinated broadcast behavior is required.
      - kind: recap
        heading: What you now know
        body: |
          Class prims store abstract, non-imageable scene description. Inherits arcs broadcast
          that description and stronger contextual overrides to many destinations, while local
          destination opinions remain available for per-instance changes.
    apply:
      f5_inherit_lamps: >-
        Create /_street_lamp_dbl as a class, give it temperature 2700, and make
        /World/StreetLamp inherit it. One shared fixture policy; the union may keep its megaphone.

  - source: docs/creating-composition-arcs/inherits-specializes/experimenting-with-inherits.md
    title: Broadcasting Through Inherits
    objective: Author an opinion on an inherits source so it reaches every inheriting prim in one consuming context only.
    intro: >-
      The night crew wants every lamp on this street amber, and only on this street. The published
      lamp asset says white and intends to keep saying it. One opinion on a shared source settles
      the whole street without touching a single lamp.
    beats:
      - kind: concept
        heading: The source acts as one shared address
        system: >-
          Correct the source once and every prim pointing at it follows. This is leverage, not magic,
          whatever the electricians claim.
        body: |
          An asset that carries an inherits arc gives its consumers a single prim to correct. Each
          referenced copy of the asset composes opinions from that inherits source, so an opinion
          authored there arrives at every copy at once.

          A pyramid built from three references to one cube asset shows this plainly. Author a
          diffuse color on the class the cubes inherit and all three cubes take it, even though
          nothing was authored on any individual cube.
        points:
          - An inherits source behaves as a shared namespace that stronger layers can address.
          - Every prim carrying the arc composes the opinions authored on that source.
          - Nothing needs authoring on the individual destinations for the correction to reach them.
      - kind: concept
        heading: The correction stays in its own context
        system: >-
          One scene turns amber. The scene next door never hears about it. Excellent professional
          boundaries.
        body: |
          An opinion authored on the source in one consuming layer stack is composed in that layer
          stack alone. Another stage referencing the same aggregate is unaffected, because the
          opinion was never authored into the published asset.

          The alternative approaches are worse in opposite directions. Editing the asset itself
          ripples into every scene that consumes it, and authoring overrides on each referenced light
          by hand is laborious, error prone, and leaves a great deal of authored data behind.
        points:
          - Broadcast overrides affect only the composition context that authored them.
          - Editing the published asset reaches every consumer of that asset.
          - Per-destination overrides scale with the number of destinations rather than with the intent.
      - kind: api
        heading: Override the source in the consuming stage
        system: >-
          An over on the shared path, one property, and the whole street changes colour. Two lines
          of authoring for a district-wide decision.
        body: |
          The asset authors the class and the arc through CreateClassPrim and
          GetInherits().AddInherit. The consuming stage then authors an over at the same source path
          and puts its opinion there, which composition applies across every prim that inherits it.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          asset = Usd.Stage.CreateNew("street_lamp_dbl.usda")
          lamp_class = asset.CreateClassPrim("/_street_lamp_dbl")
          root = asset.DefinePrim("/World", "Xform")
          root.GetInherits().AddInherit(lamp_class.GetPath())
          root.CreateAttribute("tint", Sdf.ValueTypeNames.String).Set("white")
          asset.SetDefaultPrim(root)
          asset.GetRootLayer().Save()

          scene = Usd.Stage.CreateNew("night_scene_01.usda")
          for name in ("Lamp_01", "Lamp_02"):
              lamp = UsdGeom.Xform.Define(scene, f"/World/{name}").GetPrim()
              lamp.GetReferences().AddReference("street_lamp_dbl.usda")

          shared = scene.OverridePrim("/_street_lamp_dbl")
          shared.CreateAttribute("tint", Sdf.ValueTypeNames.String).Set("amber")

          print(scene.GetAttributeAtPath("/World/Lamp_01.tint").Get())  # amber
          scene.GetRootLayer().Save()
      - kind: concept
        heading: Inherits outranks the asset's own value
        system: >-
          The asset says white from across a reference. The inherit says amber from inside this layer
          stack. LIVRPS settles it without a hearing.
        body: |
          The published asset's white is composed across a reference arc, while the amber authored
          in the consuming stage arrives through an inherits arc. Inherits sits above references in
          strength ordering, so amber is the value the street composes.

          A local opinion authored directly on one lamp would outrank both, which is how a single
          fixture keeps an exception while the rest of the street follows the broadcast.
        points:
          - An inherited opinion outranks values arriving through references and payloads.
          - A local opinion on a destination prim still outranks the broadcast.
          - The published asset keeps its own value for every other consumer.
      - kind: work_order
        heading: One amber opinion for the whole street
        system: >-
          Author it once on the shared source. Authoring it twice on two lamps is the version that
          ages badly.
        body: |
          The stage carries a published lamp asset in its own document, whose root inherits an
          unencapsulated class and authors a tint of white. The city stage itself has a /World Xform
          and nothing standing on the street yet.

          Two lamp destinations composing that asset would both read white, and the direct repair
          teaches the street nothing. Typing amber onto each lamp settles today's request and leaves
          the next colour change to be repeated fixture by fixture, while editing the asset would
          repaint every other scene that consumes it.

          Both destinations need defining with an arc naming the published asset, then an over at
          the shared class path in this stage carrying a tint of amber. The composed amber has to
          arrive across the inherits arc rather than being authored on either lamp.
        points:
          - Author the destinations first, then the single opinion on the shared source.
          - The over lives in the consuming stage, which is what keeps the change local to it.
          - Both lamps composing amber is the evidence that the broadcast reached them.
      - kind: recap
        heading: What you now know
        body: |
          An inherits source is a shared address a consuming layer stack can author on, and the
          opinion reaches every prim carrying the arc in that context alone. It outranks values
          arriving through references, it leaves the published asset and other scenes untouched, and
          local opinions on individual destinations remain available for exceptions.
    apply:
      f5_inherit_broadcast: >-
        Reference the lamp asset onto both destinations, then author amber once on the shared class
        in this stage. Two lamps, one opinion, and the asset keeps its white for everyone else.

  - source: docs/creating-composition-arcs/inherits-specializes/what-is-specializes.md
    title: Specializes Fallbacks
    objective: Author specializes arcs that provide globally reusable fallback opinions weaker than every other LIVRPS category.
    intro: >-
      Some defaults should lose gracefully whenever anyone has a more specific opinion.
      Specializes was built for this noble surrender. It occupies the weakest seat in LIVRPS and
      still somehow has a longer title than the floor boss.
    beats:
      - kind: concept
        heading: Specializes supplies fallback specs
        system: >-
          The opinion applies until literally any stronger category objects. It is the city's most employable understudy.
        body: |
          A specializes arc broadcasts prim and property specs from a source hierarchy across
          layer stacks, like inherits, but treats those specs as fallback values. A destination
          receives the specialized opinion only when no stronger authored opinion supplies that spec.

          Runtime or stronger-layer edits to the source continue to reach destinations that still
          rely on the fallback. Destinations with overrides keep their stronger values.
        points:
          - Specializes supports class-like defaults with per-object overriding behavior.
          - It can broadcast specs across composition contexts.
          - Specializes is the final and weakest category in LIVRPS.
      - kind: concept
        heading: Inherits asserts, specializes yields
        system: >-
          Inherits enters second. Specializes enters last and has already signed the waiver.
        body: |
          Inherited opinions are stronger than variants, references, payloads, and specializes.
          Specialized opinions are weaker than all of them. Both can source abstract class prims
          and broadcast changes, but their intended authority differs.

          Choose inherits for shared opinions that should outrank asset arcs. Choose specializes
          for defaults that every more specific authored opinion may replace.
        points:
          - Local opinions beat both inherits and specializes.
          - A reference opinion beats specializes but loses to inherits.
          - Specializes is useful for broad semantic defaults such as imported road metadata.
      - kind: api
        heading: Add a specialize source
        system: >-
          The road inherits nothing and specializes in yielding. City planning calls this a pilot program.
        body: |
          CreateClassPrim can hold the fallback data. GetSpecializes returns the UsdSpecializes
          editing interface, and AddSpecialize authors the source path on the destination prim.
        code: |
          from pxr import Sdf, Usd

          stage = Usd.Stage.CreateNew("roads.usda")
          fallback = stage.CreateClassPrim("/_osm_street_data")
          fallback.CreateAttribute(
              "osm:street:maxspeed", Sdf.ValueTypeNames.Int
          ).Set(30)

          road = stage.DefinePrim("/World/MainStreet", "Mesh")
          road.GetSpecializes().AddSpecialize(fallback.GetPath())
          road.CreateAttribute(
              "osm:street:maxspeed", Sdf.ValueTypeNames.Int
          ).Set(20)

          assert road.GetAttribute("osm:street:maxspeed").Get() == 20
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: A road default that yields to the posted limit
        system: >-
          The fallback remains in the stack, waiting. Patiently. Professionally.
        body: |
          Inherit Street has its lamp class standing, and /World/MainStreet has not been laid yet.
          Neither has the imported road data that streets across the city fall back on when nobody
          has surveyed them.

          Main Street is surveyed and its posted limit is 20, while the imported default is 30.
          Authoring the speed on the shared source alone composes 30 on Main Street, which is wrong
          for this road. Removing the shared source and posting 20 by itself is worse, since every
          other road is then left without any default to fall back on.

          Create a class prim carrying osm:street:maxspeed, add the arc on /World/MainStreet
          through GetSpecializes().AddSpecialize, then author maxspeed 20 on the street and stamp
          its documentation. The posted 20 has to be a local opinion on the street itself rather
          than a value arriving across the arc. The broadcast fallback is not replaced by it; it
          waits in the stack behind the local value and returns if the posting is ever removed.
        points:
          - Local and referenced values both outrank a specialized source.
          - Author the arc on the destination prim; the class source only holds the fallback data.
          - GetSpecializes and GetInherits encode different strength semantics, so pick the one matching the intended authority.
      - kind: recap
        heading: What you now know
        body: |
          Specializes broadcasts reusable fallback specs and sits last in LIVRPS. It resembles
          inherits structurally but yields to every stronger authored category, making it suitable
          for defaults that should survive only until something more specific is authored.
    apply:
      f5_road_defaults: >-
        Specialize /World/MainStreet from /_osm_street_data, then author local maxspeed 20 so the
        fallback 30 loses exactly as designed. The traffic cop composes tickets strongest first.

  - source: docs/creating-composition-arcs/inherits-specializes/experimenting-with-specializes.md
    title: Broadcasting Fallbacks
    objective: Broadcast a new fallback from a specializes source while refined destinations keep their more specific values.
    intro: >-
      Traffic engineering has raised the district default and the surveyed side street has not
      changed its mind about twenty. Specializes was built for precisely this argument, and it loses
      it on purpose wherever a survey exists.
    beats:
      - kind: concept
        heading: A refined destination ignores the broadcast
        system: >-
          Change the shared colour and only the prims that never picked one follow. The others already
          decided.
        body: |
          A specializes source holds fallback opinions, so a destination composes them only where it
          has no more specific opinion of its own. Change the fallback and the destinations still
          relying on it follow, while destinations carrying their own authored value stay exactly
          where they are.

          A pyramid of three cubes shows the split cleanly. With a red fallback on the class and blue
          and green authored on two of the cubes, moving the fallback to magenta repaints only the
          third cube.
        points:
          - Specialized opinions apply where nothing more specific is authored.
          - Destinations with their own value are described as refined and keep it.
          - Editing the fallback source reaches only the destinations still using it.
      - kind: concept
        heading: Imported defaults are the natural fallback
        system: >-
          Thirty for every road nobody has measured. It is a default with the good manners to yield.
        body: |
          A digital twin of a road network wants one shared maximum speed for every piece of road it
          imported, and a different number wherever a survey exists. Authoring the shared value on a
          class and pointing every road mesh at it through a specializes arc expresses both at once.

          Side streets then receive their surveyed value as an authored opinion on the road itself.
          Every road carries the arc, so the class remains the single place the shared default can be
          corrected later.
        points:
          - One class prim can hold the shared default for an entire network of destinations.
          - Author the arc on every destination, including the ones that will be refined.
          - A property arriving through the arc appears on the destination without being authored there.
      - kind: api
        heading: Move the fallback, keep the survey
        system: >-
          Forty on the shared source, twenty on the street that was measured. Both numbers survive.
        body: |
          CreateClassPrim holds the shared value and GetSpecializes().AddSpecialize authors the arc.
          Setting the attribute on the class broadcasts a new fallback, and setting it on a
          destination refines that destination alone.
        code: |
          from pxr import Sdf, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("main_street.usda")
          UsdGeom.Xform.Define(stage, "/World")

          shared = stage.CreateClassPrim("/_osm_street_data")
          shared.CreateAttribute(
              "osm:street:maxspeed", Sdf.ValueTypeNames.Int, custom=True
          ).Set(30)

          for name in ("road_main_01", "road_side_01"):
              road = stage.DefinePrim(f"/World/{name}", "Mesh")
              road.GetSpecializes().AddSpecialize(shared.GetPath())

          side = stage.GetPrimAtPath("/World/road_side_01")
          side.GetAttribute("osm:street:maxspeed").Set(20)

          shared.GetAttribute("osm:street:maxspeed").Set(40)

          print(stage.GetAttributeAtPath("/World/road_main_01.osm:street:maxspeed").Get())  # 40
          print(stage.GetAttributeAtPath("/World/road_side_01.osm:street:maxspeed").Get())  # 20
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Forty across the district, twenty where the survey stands
        system: >-
          One number moves on the shared source. The measured street does not notice, which is the
          entire design.
        body: |
          Two road meshes stand on the stage beside a class prim carrying an imported maximum speed
          of thirty, and neither road is connected to it yet. Traffic engineering has since raised
          the district default to forty, and the side street was surveyed at twenty.

          With no arc between the roads and the shared data, neither number reaches either road, and
          the direct approach undoes the point of the class. Authoring forty onto each road
          separately would leave the district with two copies of a value that is meant to be shared
          and corrected in one place.

          Both roads need the arc naming the shared source, the side street needs its surveyed
          twenty authored on the road itself, and the class needs its maximum speed moved to forty.
          The main road then composes the broadcast while the surveyed street holds its own value.
        points:
          - Author the arc on every destination that should track the shared default.
          - Refine a destination by authoring the property on the destination prim.
          - Moving the value on the source reaches the destinations that were never refined.
      - kind: recap
        heading: What you now know
        body: |
          A specializes source broadcasts fallback opinions that any more specific authored value
          replaces. Point every destination at one class, refine the destinations that need their own
          value, and correct the shared default on the source when it changes, knowing refined
          destinations will hold their ground.
    apply:
      f5_specializes_survey: >-
        Specialize both roads from the shared source, refine the side street with a local twenty,
        then move the class to forty. One broadcast, one survey, and no argument between them.

  - source: docs/creating-composition-arcs/inherits-specializes/encapsulation-refinement.md
    title: Refinement and Encapsulation
    objective: Choose an encapsulated or unencapsulated source for an inherits or specializes arc based on how far its opinions should broadcast.
    intro: >-
      Both arcs on this street point at a source prim, and the only real decision left is where that
      prim sits. Inside the asset root or outside it changes how far a later correction travels,
      which is the sort of detail that decides whether one note repaints a city.
    beats:
      - kind: concept
        heading: Either kind of source is valid
        system: >-
          Inside the asset or outside it, the arc composes either way. The consequences arrive later.
        body: |
          An inherits arc and a specializes arc can both target a source prim that is encapsulated
          beneath the asset root, or one that sits outside it in an unencapsulated namespace such as
          a root-level class.

          Neither placement makes the arc invalid, and on the authoring stage the two behave
          identically. The difference appears when the destination prim is referenced into another
          layer stack, which is the moment path translation applies.
        points:
          - Both arc types accept encapsulated and unencapsulated sources.
          - The choice is about broadcasting behaviour rather than about validity.
          - On the authoring stage alone, the two placements are hard to tell apart.
      - kind: concept
        heading: Referencing is what separates them
        system: >-
          A path inside the boundary gets rewritten. A path outside it never moves. One rule, two
          outcomes.
        body: |
          A reference composes its target's subtree at a destination prim and translates the paths
          inside that subtree. A source prim encapsulated beneath the asset root is therefore
          re-pathed once per reference, giving each aggregate its own copy of that source.

          A source prim outside the asset root is not part of the referenced subtree, so its path is
          unchanged in every consuming context. Every copy of the asset points at the same address,
          which is what allows one opinion to reach all of them.
        points:
          - Encapsulated sources are re-pathed per reference, producing one source per aggregate.
          - Unencapsulated sources keep a single path across every reference.
          - The destination prims keep their arcs either way; only the target path differs.
      - kind: api
        heading: Place the source deliberately
        system: >-
          Two class prims, two reaches. Choose by how many prims should hear the next correction.
        body: |
          Authoring the class outside the asset root gives consumers one shared address to correct.
          Authoring it beneath the root ties the source to the aggregate that owns it, so a
          correction there stays inside that copy.
        code: |
          from pxr import Sdf, Usd

          stage = Usd.Stage.CreateNew("cube_pyramid.usda")

          # Outside the asset root: one address in every consuming context.
          shared = stage.CreateClassPrim("/_cube_asset")

          root = stage.DefinePrim("/World", "Xform")
          # Beneath the asset root: re-pathed with the subtree at each destination.
          local = stage.CreateClassPrim("/World/_local_cube")

          cube = stage.DefinePrim("/World/cube_01", "Cube")
          cube.GetInherits().AddInherit(shared.GetPath())
          cube.GetInherits().AddInherit(local.GetPath())

          print([str(path) for path in cube.GetInherits().GetAllDirectInherits()])
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: A shared lamp source the whole street can be corrected from
        system: >-
          Where the source sits decides who hears the next instruction. Decide it before publishing.
        body: |
          The lamp asset on Inherit Street publishes a class prim and an arc from its root to that
          class, and consumers compose the asset by referencing its root. The class currently sits
          outside that root, in a root-level namespace of its own.

          That placement is a decision, not an accident. Moved beneath the asset root, the class
          would be re-pathed at every destination, and a note asking for an amber street would have
          to be repeated once per aggregate. Left outside, one address serves every copy in the
          consuming context, and a single opinion reaches them all.

          Keep the shared source unencapsulated for street-wide corrections, and reserve an
          encapsulated source for changes that belong to one aggregate. A prim can carry both arcs,
          so both reaches remain available.
        points:
          - Unencapsulated sources suit corrections meant for every copy in a context.
          - Encapsulated sources suit changes that should stay inside one aggregate.
          - One destination may carry arcs to both kinds of source at once.
      - kind: recap
        heading: What you now know
        body: |
          Inherits and specializes arcs accept either an encapsulated or an unencapsulated source,
          and the placement decides the broadcast. Referencing re-paths encapsulated sources per
          aggregate while leaving unencapsulated ones at one shared address, so choose the source by
          how far a later correction should travel.
    apply:
      f5_refinement_brief: >-
        Read the placement as the decision it is: an encapsulated source is re-pathed per reference,
        an unencapsulated one keeps a single address, and the arc is valid either way.

  - source: docs/creating-composition-arcs/inherits-specializes/experimenting-with-encapsulation-refinement.md
    title: Global and Local Refinement
    objective: Distinguish global from local refinement and predict which prims a correction on each kind of source reaches.
    intro: >-
      One note turned every cube in the city magenta. Another turned exactly one pyramid cyan. Same
      arc, same kind of opinion, different source prim, and the difference is worth understanding
      before the next note arrives.
    beats:
      - kind: concept
        heading: Global refinement rides an unchanging path
        system: >-
          The address survives every reference, so the correction arrives everywhere at once. Ambitious.
        body: |
          Global refinement takes advantage of an arc whose target path never changes. A path outside
          encapsulation is never re-pathed on reference, so every copy of the asset in a consuming
          context points at the same source prim.

          Overriding that source and authoring a new colour therefore reaches every prim inheriting
          it. In the example scene, one magenta opinion on the shared class turns all of the cubes
          magenta, however many aggregates they were composed through.
        points:
          - An unencapsulated target keeps one path through every reference.
          - One opinion on that source reaches every prim carrying the arc in the context.
          - This is the reach to use when a correction is meant for the whole scene.
      - kind: concept
        heading: Local refinement rides a translated path
        system: >-
          One pyramid changes and its neighbours never learn about it. Precisely scoped vandalism.
        body: |
          Local refinement is what happens when the arc targets an encapsulated prim. That target is
          re-pathed on reference, so each aggregate composes its own copy of the source at its own
          address.

          Authoring a cyan colour on one aggregate's copy of the source affects only the prims
          inheriting that copy. The other aggregates keep their previous values, because their arcs
          point at different paths entirely.
        points:
          - An encapsulated target is re-pathed beneath each destination prim.
          - A correction there is confined to the aggregate that owns that copy.
          - This is the reach to use when one instance needs to differ from its siblings.
      - kind: api
        heading: Read the target path to predict the reach
        system: >-
          The path tells you the blast radius before you author anything. Read it first.
        body: |
          Inspecting the arcs on a composed prim shows which source paths it points at. A root-level
          target indicates a global reach, while a target beneath an aggregate indicates a
          correction confined to that aggregate.
        code: |
          from pxr import Usd

          stage = Usd.Stage.Open("local_refinement.usda")
          cube = stage.GetPrimAtPath("/World/cube_pyramid_01/cube_01")

          for source in cube.GetInherits().GetAllDirectInherits():
              print(source)  # /_cube_asset is global; /World/cube_pyramid_01/_local_cube is not

          # Refine one aggregate alone by authoring on its own copy of the source.
          local = stage.OverridePrim("/World/cube_pyramid_01/_local_cube")
          print(local.GetPath())
      - kind: work_order
        heading: Two corrections, two different reaches
        system: >-
          One note for the district, one note for a single block. Choose the source that matches the
          note.
        body: |
          The city carries several aggregates composed from the same cube asset, and each cube
          inherits both a shared class outside the asset root and a local class beneath the aggregate
          that contains it. Both arcs are already authored and neither source carries an opinion.

          Two requests arrive with different scopes. Treating them the same way is what causes
          trouble, since a correction on the shared source repaints every aggregate, and a correction
          on one aggregate's local source reaches nothing outside it.

          Author the district-wide colour on the unencapsulated source, and author the single-block
          colour on that block's own encapsulated source. Reading the target path of each arc before
          authoring is what tells the two apart, because the composed cubes look identical.
        points:
          - A root-level source reaches every prim carrying the arc in that context.
          - An aggregate-local source reaches only the copies beneath that aggregate.
          - Both arcs can sit on one prim, so the reach is chosen when the opinion is authored.
      - kind: recap
        heading: What you now know
        body: |
          Global refinement authors on a source outside encapsulation, whose path no reference
          re-paths, so the opinion reaches every prim carrying the arc. Local refinement authors on
          an encapsulated source that is re-pathed per aggregate, confining the opinion to that copy.
          Reading the target path is how you tell which reach you are about to use.
    apply:
      f5_refinement_survey: >-
        Compare the two by target path: an unencapsulated source repaints every aggregate, while an
        encapsulated one is re-pathed per copy and holds its correction to one.

  - source: docs/creating-composition-arcs/prim-composition.md
    title: Prim Composition
    objective: Explain how specs and opinions form composed prims and direct authoring to a chosen edit target.
    intro: >-
      A composed prim may look singular while dozens of specs argue beneath it. This is the
      central illusion holding the city together. You will learn where opinions live, how they
      combine, and how not to vandalize the strongest layer by accident.
    beats:
      - kind: concept
        heading: Prims are composed from specs
        system: >-
          The prim is the verdict. Prim specs and property specs are the witnesses, several of whom have motives.
        body: |
          A Usd.Prim is the composed runtime object presented on a stage. Its source data is
          authored as Sdf.PrimSpec objects in layers. Properties are likewise backed by
          Sdf.AttributeSpec or Sdf.RelationshipSpec objects.

          Specs hold authored opinions: values and metadata expressing what the final prim or
          property should be. Composition gathers applicable specs and resolves their opinions by
          strength into one prim and its properties.
        points:
          - A layer is a sparse document and need only author the specs or fields its workstream owns.
          - Several layers can hold prim specs at the same scene path.
          - Attributes and relationships are both properties, so each can have property specs.
      - kind: concept
        heading: The prim index gathers composition
        system: >-
          Every arc leaves paperwork. The prim index is where the city stores the complete argument.
        body: |
          For each composed prim, USD builds a prim index that records the composition arcs and
          sites contributing opinions. The resulting prim stack orders applicable prim specs from
          strongest to weakest.

          References and payloads connect layer stacks and remap source namespaces. Sublayers,
          inherits, variants, and specializes add further sites according to LIVRPS. Resolution is
          performed per field or property, so a weaker spec can still supply data absent above it.
        points:
          - Weaker specs remain part of the composition structure beneath stronger ones.
          - A single composed prim can draw different properties from different source layers.
          - Inspecting stacks is more reliable than inferring a winner from filenames.
      - kind: api
        heading: Author arcs onto destination prims and inspect the result
        system: >-
          Every arc has its own counter, and every counter files the same paperwork. Urban planning
          has discovered specialization.
        body: |
          Composition arcs are authored on destination prims, each through its own editing interface
          reached from the prim. The stage presents the combined result while each arc remains
          independently inspectable.

          Each destination composes the source hierarchy the arc names, and the composed prim can
          carry stronger local opinions of its own. Reading a prim's stack afterwards names the
          layers whose specs contribute to it, which is how an arc's effect is confirmed rather
          than assumed.
        points:
          - One editing interface per arc category, each reached from the destination prim.
          - A destination prim composes its source while keeping its own local opinions available.
          - "GetPrimStack lists the contributing specs, so an arc's contribution can be read back from the composed prim."
        code: |
          from pxr import Sdf, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("block.usda")
          block = UsdGeom.Xform.Define(stage, "/World/Block")

          tower = UsdGeom.Xform.Define(stage, "/World/Block/Tower").GetPrim()
          tower.GetReferences().AddReference("tower.usd")

          second = UsdGeom.Xform.Define(stage, "/World/Block/TowerCopy").GetPrim()
          second.GetReferences().AddInternalReference(Sdf.Path("/World/Block/Tower"))
          second.SetDisplayName("Second tower, same source")

          for prim in (tower, second):
              print([spec.layer.identifier for spec in prim.GetPrimStack()])
          stage.GetRootLayer().Save()
      - kind: concept
        heading: Edit targets choose the authored layer
        system: >-
          The current edit target is where your next opinion lands. Check it before swinging; restoration is not in the prize budget.
        body: |
          A stage edit target maps scene paths to a particular layer and composition node. For
          straightforward layer-stack editing, stage.SetEditTarget(layer) directs subsequent Usd
          authoring calls into that Sdf.Layer. Composition strength continues to follow layer
          ordering and arcs regardless of which layer receives the edits.

          GetEditTarget reports the active Usd.EditTarget. Save every modified layer, including a
          weaker sublayer selected for authoring.
        code: |
          from pathlib import Path
          from pxr import Sdf, Usd

          stage = Usd.Stage.CreateNew("root.usda")
          stage.DefinePrim("/World", "Xform")

          notes = Sdf.Layer.CreateNew("notes.usda")
          stage.GetRootLayer().subLayerPaths.append("notes.usda")
          stage.SetEditTarget(notes)

          stage.GetPrimAtPath("/World").SetDisplayName("Authored on notes")
          assert stage.GetEditTarget().GetLayer() == notes

          notes.Save()
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Compose the Highland block from three arcs
        system: >-
          Confirm the edit target before authoring. A correct composed result can still leave the
          opinion in the wrong file.
        body: |
          Recaptured Skyline is one block short. /City/ArcHighlands stands from the neighborhoods
          behind it, but /City/ArcHighlands/HighlandBlock has no prim spec in any layer of the
          stack, so there is no composed prim for towers or a warehouse to sit beneath.

          A composed prim is only ever as strong as the specs authored for it, and this block has
          none. The block the district wants carries three children: two towers built from the
          city's skyscraper assets, and one warehouse whose bulk should stay deferred until
          somebody asks for it.

          Define HighlandBlock as an Xform, author each arc on its own child prim through that
          prim's editing interface, and document the block. The Debug Gauntlet next door adds the
          detail that is easiest to miss: displayName on /World is authored while notes.usda is the
          active edit target, and that weaker layer needs its own save call, because saving the
          root layer persists nothing written through a different target.
        points:
          - "GetPrimAtPath returns a composed Usd.Prim, while GetPrimStack returns contributing Sdf.PrimSpec objects."
          - "SetEditTarget changes where future opinions are written; existing opinions keep their current strength."
          - A layer must belong to an appropriate composition context before it can serve as a useful edit target.
      - kind: recap
        heading: What you now know
        body: |
          Layers store sparse prim and property specs containing opinions. A stage builds prim
          indexes and resolves those opinions into composed objects. Use composition arcs to
          assemble content, inspect stacks to understand sources, and set the edit target before authoring.
    apply:
      f5_composition_brief: >-
        Read a composed prim as a resolved result: specs in layers hold the opinions, the prim index
        orders them, and every field is settled on its own.
      f9_edit_target_duel: >-
        The notes layer is already the weaker sublayer and active edit target; set /World's
        displayName there and save both layers. Strength is not permission to write in the wrong file.

  - source: docs/creating-composition-arcs/strength-ordering/tracing-through-liverps.md
    title: Tracing Composition
    objective: Inspect prim and property stacks to identify authored sources and explain the winning opinion.
    intro: >-
      The sign says five things in five composition dialects and displays one value. Guessing is
      for game shows with smaller liability waivers. You will trace the stack, identify the
      strongest authored opinion, and leave every weaker arc alive for evidence.
    beats:
      - kind: concept
        heading: Composition resolves one opinion at a time
        system: >-
          A stage with thousands of prims is merely this argument repeated until the debugger asks for leave.
        body: |
          Composition strength is evaluated for each field and property. A strong spec may supply
          one value while a weaker spec supplies another property that has no stronger opinion.
          The winning value therefore cannot be inferred from the strongest layer alone.

          Local opinions include direct opinions throughout the current layer stack. Connecting
          arcs then contribute other composition contexts according to LIVRPS.
        points:
          - A weaker sublayer can win when stronger layers author no opinion for that property.
          - A stronger local opinion wins without deleting inherits, variants, references, payloads, or specializes.
          - Tracing should begin at the exact composed prim or property producing the unexpected result.
      - kind: concept
        heading: Prim stacks reveal structural sources
        system: >-
          GetPrimStack assembles the witness list. Cross-examination remains your responsibility.
        body: |
          Usd.Prim.GetPrimStack returns the contributing Sdf.PrimSpec objects in strength order.
          Each spec exposes its path, specifier, and owning layer, which helps identify where the
          prim's structural opinions were authored.

          The prim stack is broad: a spec can contribute to the prim without authoring the
          particular property being debugged.
        points:
          - Inspect spec.layer.identifier to locate the source document.
          - Inspect spec.path to understand namespace mapping through composition arcs.
          - A large prim stack is expected when multiple arc types contribute to one prim.
      - kind: api
        heading: Property stacks isolate competing values
        system: >-
          The flashlight points directly at the opinions. Do not strike the payload with it; props charges by the dent.
        body: |
          Usd.Property.GetPropertyStack returns the Sdf.PropertySpec objects that contribute to a
          composed property, ordered strongest to weakest. For an attribute, the resolved Get value
          can be compared with each spec's layer and authored default value.
        code: |
          from pxr import Sdf, Usd

          stage = Usd.Stage.Open("labyrinth.usda")
          prim = stage.GetPrimAtPath("/City/ArcHighlands/LabyrinthSign")
          attr = prim.GetAttribute("floorIndex")

          print("resolved:", attr.Get())
          for spec in prim.GetPrimStack():
              print("prim:", spec.layer.identifier, spec.path)

          for spec in attr.GetPropertyStack():
              print("property:", spec.layer.identifier, spec.path, spec.default)
      - kind: work_order
        heading: Five arcs on one sign, one resolved value
        system: >-
          Five specs can attend. One opinion wins. The other four remain on the record.
        body: |
          The LIVERPS Labyrinth has a sign with five arcs aimed at it. ref_sign.usda authors
          floorIndex 1 on its default prim, payload_sign.usda authors floorIndex 3 on its own, and
          /City/ArcHighlands/LabyrinthSign is not on the stage yet, so two competing values already
          exist before anything is authored.

          The sign has to display 4 while every weaker arc stays alive as evidence. An inherit, an
          edition variant set selecting final, a reference, a payload, and a specialize all
          contribute to that one prim, and pulling arcs out to simplify the trace changes the
          composition and hides the very sources a trace exists to identify.

          Author floorIndex 4 as a local opinion on the sign, then add each arc to that same prim
          and document it. The 4 has to be local rather than arriving across an arc, since local is
          the only category that outranks all five. The variant set needs draft and final both
          authored with final selected, which is a separate decision from authoring the arc.
        points:
          - GetPrimStack includes specs beyond those authoring the property under investigation.
          - GetPropertyStack is the focused view for a specific attribute or relationship.
          - Removing weaker arcs to make debugging simpler changes the composition and can conceal the actual cause.
      - kind: recap
        heading: What you now know
        body: |
          Trace composition at property granularity. Use GetPrimStack for the contributing prim
          specs, GetPropertyStack for the exact competing property specs, and inspect each spec's
          layer and path in strength order before authoring a corrective opinion.
    apply:
      f5_trace_brief: >-
        Read a trace at property granularity: identify the competing specs with GetPropertyStack and
        leave every weaker arc composed, because removing one changes the result being explained.

  - source: docs/creating-composition-arcs/strength-ordering/what-is-liverps.md
    title: LIVRPS Strength Ordering
    objective: Apply Local, Inherits, Variant sets, References, Payloads, Specializes ordering within recursive composition contexts.
    intro: >-
      LIVRPS is the ordering law of the Composition and the only phrase Archivist Prime enjoys
      hearing pronounced. It determines which opinion survives when layer stacks disagree.
      Memorize the order, then understand the recursion, or the Archive will notice the difference.
    beats:
      - kind: concept
        heading: Six categories, strongest to weakest
        system: >-
          Local, Inherits, Variant sets, References, Payloads, Specializes. The crowd has set it to music; counsel has intervened.
        body: |
          LIVRPS orders composition categories from strongest to weakest: Local opinions, Inherits,
          Variant sets, References, Payloads, and Specializes. The acronym describes both the arc
          categories and the order in which their opinions are applied to build prim and property stacks.

          Strength ordering is necessary because multiple layers and layer stacks can author
          conflicting opinions for the same composed object.
        points:
          - Local opinions outrank every composition arc category.
          - Inherits outrank variants, references, payloads, and specializes.
          - Specializes provide the weakest fallback opinions.
      - kind: concept
        heading: Local means the entire layer stack
        system: >-
          Local includes recursive sublayers. Language filed the ambiguity; USD denied jurisdiction.
        body: |
          A layer stack contains a root layer and all sublayers gathered recursively. Direct
          opinions in any of those layers are local to that layer stack, even when authored in a
          deeply nested sublayer.

          Within the Local category, the root layer is strongest. Sublayers follow their listed
          strength order, first to last, and recursive sublayers are gathered depth first.
        points:
          - The first sublayer is stronger than later sibling sublayers.
          - Descendants of an earlier sublayer branch are gathered before the next sibling branch.
          - A local opinion in a weak sublayer still outranks reference opinions from another layer stack.
      - kind: concept
        heading: LIVRPS applies recursively
        system: >-
          Every connected layer stack runs its own hearing before the appeals reach yours. The legal budget is spectacular.
        body: |
          References and payloads connect multiple layer stacks. LIVRPS evaluates opinions in the
          context of each layer stack and applies recursively as composition traverses arcs.
          Internal inherits, variants, references, payloads, and specializes are therefore
          interpreted relative to the layer stack where they are authored.

          The result is a strength-ordered prim index with property stacks built from that recursive
          evaluation. File names and creation times play no part in it.
        points:
          - Each layer stack supplies the context for evaluating its own composition operations.
          - A stronger category can beat a numerically larger or later-authored value.
          - Weaker opinions remain available to fill fields with no stronger authored value.
      - kind: api
        heading: Verify order through the stacks
        system: >-
          Recitation impresses the Archive. Inspection clears the room.
        body: |
          Author representative arcs with their dedicated interfaces, then inspect the composed
          prim and property stacks. The returned Sdf specs are strength ordered, allowing code to
          verify the source of a resolved opinion rather than relying on memory.
        code: |
          from pxr import Sdf, Usd

          stage = Usd.Stage.CreateNew("order.usda")
          fallback = stage.CreateClassPrim("/_Fallback")
          fallback.CreateAttribute("rank", Sdf.ValueTypeNames.Int).Set(0)

          prim = stage.DefinePrim("/World/Probe", "Xform")
          prim.GetSpecializes().AddSpecialize(fallback.GetPath())
          prim.CreateAttribute("rank", Sdf.ValueTypeNames.Int).Set(6)

          rank = prim.GetAttribute("rank")
          assert rank.Get() == 6  # Local beats Specializes.
          for spec in rank.GetPropertyStack():
              print(spec.layer.identifier, spec.path)
      - kind: work_order
        heading: File the archive and answer from the rules
        system: >-
          TfDebug can narrate runtime diagnostics with an excellent stage voice. Reading the authored stack remains your job.
        body: |
          The Certification Archive sits at the end of the Colosseum, and
          /City/CrownDistrict/CertificationArchive is the one prim missing from it. Archivist Prime
          files nothing that arrives without its stage contract in order.

          The city reaching the archive is flattened from everything published before it, so the
          district is standing but the archive prim is not, and the stage metadata the filing gets
          indexed under is whatever the earlier floors left behind. The contract the archive
          accepts is stated plainly: Y as the up axis, 0.01 metersPerUnit, and startTimeCode 1.

          Define the archive as a Scope, set its documentation to the exact wording asked for, and
          author those three pieces of stage metadata. Then answer from the ordering rules
          themselves rather than the acronym, because each question sits on a boundary: an external
          reference with no prim path needs a default prim in the referenced layer, and a schema
          fallback supplies a value only once every authored LIVRPS opinion is exhausted.
        points:
          - Rank opinions by LIVRPS category and layer-stack order; timestamps, file sizes, and Python call order carry no weight.
          - An external reference without a prim path requires a default prim in the referenced layer.
          - Stack inspection identifies authored opinion strength more directly than generic runtime tracing.
      - kind: recap
        heading: What you now know
        body: |
          LIVRPS orders Local, Inherits, Variant sets, References, Payloads, and Specializes from
          strongest to weakest. Local spans the root and recursive sublayers of one layer stack,
          internal order still matters, and the algorithm applies recursively across connected stacks.
    apply:
      f5_liverps_brief: >-
        Read the order as the law every arc on this floor was already obeying: Local spans a whole
        layer stack, sublayers are gathered depth first, and each stack reached across an arc runs the same rules again.
