lessons:
  - source: docs/data-exchange/data-exchange/what-is-data-exchange.md
    title: Data Exchange
    objective: Distinguish data exchange implementations and preserve source provenance while translating foreign data into OpenUSD.
    intro: >-
      Welcome to the Customs Terminal, where every crate is foreign, every manifest is incomplete,
      and customs has misplaced the definition of "complete." Data exchange gets data into and out
      of OpenUSD without pretending incompatible formats are secretly identical. I will be checking
      the paperwork.
    beats:
      - kind: concept
        heading: Exchange maps data models
        system: >-
          Renaming a crate does not change its contents. Customs learned this after the glTF incident
          and the resulting sponsor inquiry.
        body: |
          Data exchange asks how data enters OpenUSD, how it leaves OpenUSD, and how concepts in one
          representation map to concepts in another. OpenUSD supplies schemas for common scene
          entities such as meshes, materials, lights, and cameras, and extensible schemas can cover
          domains such as physics, robotics, and synthetic data.

          Translation is usually lossy because formats differ in their data models, structures, and
          fidelity. A faithful implementation documents unsupported concepts and chooses mappings
          based on the needs of its consumers, since one output structure rarely serves every
          pipeline.
        points:
          - An importer translates OpenUSD into an application's runtime representation.
          - An exporter translates an application's runtime representation into OpenUSD.
          - A standalone converter is a script, executable, or service that translates files in one or both directions.
          - Good mapping carries the source's meaning and structure across wherever the destination can express them.
      - kind: concept
        heading: File format plugins compose foreign sources
        system: >-
          A plugin lets the foreign crate enter the layer stack without changing uniforms. Elegant,
          powerful, and unavailable in this particular customs hall.
        body: |
          An OpenUSD file format plugin presents another file format or non-file source as an
          Sdf.Layer. A stage can then include that source through a reference, payload, or sublayer,
          and the plugin translates it as USD data is read. The foreign source can remain the source
          of truth, plugins may support reading and writing, and tools such as usdcat can use them as
          converters.

          This floor's usd-core build has no OBJ file format plugin, so Usd.Stage.Open cannot read
          an OBJ file. The intake implementation must parse OBJ text itself and author equivalent
          USD schema data on a new stage.
        points:
          - Runtime formats often favor application importers and exporters.
          - File-backed or procedural sources may be candidates for file format plugins.
          - Plugin availability is build-dependent, so confirm it before relying on one.
      - kind: concept
        heading: Extract first, transform second
        system: >-
          First record what arrived. Then make it presentable. Reversing those steps is how the
          terminal acquired a chandelier classified as agricultural equipment.
        body: |
          Two-phase exchange separates fidelity from downstream customization. Extraction maps the
          source into OpenUSD as directly as possible, retaining source structure and intent.
          Transformation applies optional export settings, restructures content, prunes data, or
          optimizes it for a client.

          This separation makes extraction easier to inspect and transformations easier to reuse.
          It also reduces the risk that workflow-specific choices are mistaken for facts from the
          source.
        points:
          - Extraction should preserve source fidelity and legibility.
          - Transformation may apply user options, structural changes, and performance optimizations.
          - Round trips are easier to reason about when transformations are minimized and documented.
      - kind: api
        heading: Stamp provenance on the USD result
        system: >-
          The filename can change. Authored provenance travels with the asset, which is more than I
          can say for half this season's contestants.
        body: |
          Provenance records what the USD data came from and how intake treated it. customData is a
          dictionary-valued metadata field suited to pipeline-specific values; documentation is
          well-known metadata suited to a human-readable note. SetCustomDataByKey changes one entry
          without replacing unrelated customData.
        code: |
          from pxr import Usd, UsdGeom

          stage = Usd.Stage.CreateNew("imported_kiosk.usda")
          prim = UsdGeom.Xform.Define(
              stage, "/City/ExchangeTerminal/ImportedKiosk"
          ).GetPrim()

          prim.SetCustomDataByKey("sourceFormat", "OBJ")
          prim.SetDocumentation("Normalized at intake.")

          assert prim.GetCustomDataByKey("sourceFormat") == "OBJ"
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Stamp the source format and intake note on the kiosk
        system: >-
          "Universal" stops well short of "telepathic." OpenUSD still requires you to explain what
          the foreign numbers mean.
        body: |
          A crate of foreign geometry has cleared the dock, and the Intake Platform has already
          built its stand-in: one Xform at /City/ExchangeTerminal/ImportedKiosk, alone on an
          otherwise empty stage. The kiosk has a path and a type and no metadata of any kind.

          Nothing on that prim records where the geometry came from. Its path and type place a kiosk
          in the exchange terminal; they do not say the contents arrived as OBJ text or that intake
          normalized them on the way in. The only remaining trace of the source is the filename on
          the crate, which any copy or rename discards.

          Author two opinions on the kiosk: a customData entry whose sourceFormat key reads OBJ, and
          a documentation string matching the intake note exactly. customData is one
          dictionary-valued field, so writing the whole dictionary replaces every entry already
          there, while SetCustomDataByKey edits one key and leaves its siblings intact. documentation
          is free-form, so a paraphrase or a dropped period is still valid metadata and no longer the
          note intake actually recorded.
        points:
          - Parse OBJ text directly in builds where no OBJ file format plugin is installed.
          - Author provenance metadata on the asset interface, where it survives copying and renaming.
          - SetCustomData replaces the complete dictionary, while SetCustomDataByKey preserves sibling entries.
          - Keep client-specific restructuring in a transformation step where it can be reused or skipped.
      - kind: recap
        heading: What you now know
        body: |
          Data exchange maps source concepts into or out of OpenUSD through application I/O,
          converters, or file format plugins. A robust pipeline extracts faithfully, transforms
          deliberately, and records provenance so downstream users know what entered the stage and
          which assumptions accompanied it.
    apply:
      f8_import_depot: >-
        Stamp ImportedKiosk with sourceFormat OBJ and the exact intake documentation. The Depot
        accepts metadata, not your solemn assurance that the crate looked foreign.

  - source: docs/data-exchange/data-exchange/exercise.md
    title: Anatomy of a Converter
    objective: Assemble a standalone converter as an entry point, an extraction phase, a transformation phase, and the export options a caller selects between.
    intro: >-
      Before a single vertex is parsed, the terminal would like to see the shape of the machine. A
      converter is a small program with one front door, two rooms, and one exit, and the paperwork
      goes wrong the moment those rooms start trading responsibilities.
    beats:
      - kind: concept
        heading: One entry point, two phases, one save
        system: >-
          Every crate that clears this hall went through a machine somebody wrote in an afternoon.
          Try to make yours legible to whoever inherits it.
        body: |
          A standalone converter translates files without an application's runtime in the loop. Its
          entry point collects arguments, calls a function that maps the source into OpenUSD, calls
          a function that adapts that result for the destination, and saves the stage once at the
          end.

          Parsing the foreign format and authoring OpenUSD are separate concerns. A converter
          usually hands the source side to a parsing library that already understands the format,
          which leaves the OpenUSD side free to think in prims, attributes, and metadata. The
          extraction function creates the output stage and returns it, so the transformation
          receives a live stage rather than a path and never reopens work already in progress.
        points:
          - The entry point is the only place that reads arguments and the only place that saves.
          - Extraction creates and returns the stage, so transformation has something to operate on.
          - A parsing library handles the source format while usd-core handles the authoring.
          - Keeping each phase in its own function leaves either one replaceable on its own.
      - kind: concept
        heading: Export options are the caller's half of the contract
        system: >-
          The client gets a small number of levers. Everything else is the machine's opinion, and
          the machine does not take requests.
        body: |
          A converter's command line states what it accepts. An input path names the source, an
          output path names the destination, and each export option exposes one decision the caller
          is allowed to make. Every option needs a sensible default so the ordinary conversion runs
          with no flags at all.

          Options describe the destination rather than the source, which is why they are collected
          at the entry point and applied in the transformation phase. An up-axis flag is the
          standard example. OBJ is Y-up, so Y is the default, and an organization whose pipeline
          runs Z-up asks for Z explicitly instead of leaving the converter to infer it.
        points:
          - Defaults should match the predominant workflow so common conversions stay flagless.
          - An option encodes a destination choice, so its effect belongs in the transformation phase.
          - Listing the accepted values up front keeps an option honest about what it can produce.
      - kind: api
        heading: Sketch both phases before filling either one in
        system: >-
          Two functions and a caller. It looks like nothing, which is rather the point.
        body: |
          Write the phases as named functions with the signatures they will keep. Extraction takes
          the source and destination paths and returns a Usd.Stage. Transformation takes that stage
          and edits it in place, so it returns nothing. OBJ states no linear unit, which makes the
          unit declaration a destination decision and puts SetStageMetersPerUnit in the
          transformation.
        code: |
          from pathlib import Path
          from pxr import Usd, UsdGeom


          def extract(input_file: Path, output_file: Path) -> Usd.Stage:
              """Map the source into OpenUSD as directly as the schemas allow."""
              stage = Usd.Stage.CreateNew(str(output_file))
              # Source parsing and the authoring it drives belong here.
              return stage


          def transform(stage: Usd.Stage) -> None:
              """Adapt the extracted stage for the destination."""
              UsdGeom.SetStageMetersPerUnit(stage, UsdGeom.LinearUnits.meters)


          def main(input_file: Path, output_file: Path) -> None:
              stage = extract(input_file, output_file)
              transform(stage)
              stage.Save()
      - kind: api
        heading: Collect the options at the front door
        system: >-
          One flag, three accepted values, and a default that spares everyone the flag. The form
          practically fills itself in.
        body: |
          Argument parsing belongs to the entry point, not to either phase. Naming the export
          options as their own group documents which arguments are destination choices, and
          deriving an unspecified output path from the input keeps the common invocation short.
        code: |
          import argparse
          from enum import Enum
          from pathlib import Path

          from pxr import UsdGeom


          class UpAxis(Enum):
              Y = UsdGeom.Tokens.y
              Z = UsdGeom.Tokens.z

              def __str__(self):
                  return self.value


          parser = argparse.ArgumentParser("obj2usd", description="An OBJ to USD converter.")
          parser.add_argument("input", help="Input OBJ file", type=Path)
          parser.add_argument("-o", "--output", help="Output USD file", type=Path)
          export_opts = parser.add_argument_group("Export Options")
          export_opts.add_argument(
              "-u",
              "--up-axis",
              help="Up axis for the exported USD stage.",
              type=UpAxis,
              choices=list(UpAxis),
              default=UpAxis.Y,
          )

          args = parser.parse_args()
          if args.output is None:
              args.output = args.input.parent / f"{args.input.stem}.usda"
      - kind: work_order
        heading: Run the crate through both phases
        system: >-
          Two working halves with nothing between them is the most common way a conversion produces
          an empty directory.
        body: |
          The converter on the bench is half assembled. Extraction is finished and already runs. It
          creates the output stage, defines the crate prim it maps the source onto, and hands that
          stage back. The transformation function is declared, accepts that stage, and has no body,
          and the save at the end writes out whatever the pipeline produced.

          OBJ states no linear unit, so nothing on the delivered stage says what one scene unit is
          worth, and a consumer is left to fall back on an assumption this conversion never made
          explicit. The transformation is also never invoked, which means any step written into it
          stays inert no matter how correct the step itself is.

          Declare meters inside the transformation, then run the stage extraction handed back
          through that phase before the save. Both halves of this matter. A unit declaration is a
          decision about the destination rather than a fact read out of the source, so it belongs
          in the second phase, and a phase that is never called changes nothing whatever it
          contains.
        points:
          - Extraction returns the stage, and everything downstream operates on that same object.
          - A transformation edits the stage in place, so it hands nothing back.
          - Save once at the end, after both phases have contributed their opinions.
          - An unauthored linear unit falls back to a value no phase ever declared.
      - kind: recap
        heading: What you now know
        body: |
          A converter is an entry point that gathers arguments, an extraction phase that maps the
          source onto a new stage, a transformation phase that adapts that stage for the
          destination, and a single save. Export options are collected at the entry point and
          applied during transformation, which keeps source fidelity and destination policy in
          separate, replaceable pieces.
    apply:
      f8_converter_anatomy: >-
        Declare meters inside the transformation phase, then run the extracted stage through it
        before the save. An empty phase nobody calls converts nothing twice over.

  - source: docs/data-exchange/data-extraction/exercise-extracting-geometry.md
    title: Extracting a Mesh
    objective: Parse foreign geometry and author its vertices, topology, normals, and polygonal subdivision behavior as a UsdGeom.Mesh.
    intro: >-
      The dock has delivered OBJ text and no plugin to interpret it. You will read the manifest
      yourself, extract the geometry, and author a mesh with the sort of precision customs normally
      reserves for confiscation notices. The vertices have already retained counsel.
    beats:
      - kind: concept
        heading: Extraction preserves the source representation
        system: >-
          We are translating evidence. Improvements happen later, under brighter lights and with
          more waivers.
        body: |
          Geometry extraction reads the source representation and writes the closest corresponding
          OpenUSD schema data. For OBJ, vertex records begin with "v", object names begin with "o",
          and face records identify vertex indices. In this environment those records are parsed as
          text because usd-core has no OBJ file format plugin.

          OBJ commonly stores vertices globally, while each UsdGeom.Mesh owns its own points array.
          An extractor must select or remap the vertices belonging to each object before authoring
          the mesh.
        points:
          - Preserve source ordering unless an explicit remapping updates every dependent index.
          - Sanitize foreign object names before using them as prim identifiers.
          - Leave workflow-specific hierarchy and optimization to the transformation phase.
      - kind: concept
        heading: Mesh topology uses two ordered arrays
        system: >-
          Faces arrive in groups. USD asks for one queue and a list explaining where each group
          ends. The terminal calls this efficiency and employs six clerks to oversee it.
        body: |
          OBJ groups vertex indices per face. UsdGeom.Mesh stores all face indices in one flattened
          faceVertexIndices array and stores the number of indices belonging to each face in the
          parallel faceVertexCounts array.

          Counts are consumed in order. For two triangles, faceVertexCounts is [3, 3] and the first
          three flattened indices form the first face. The sum of all counts must equal the length
          of faceVertexIndices.
        points:
          - points stores per-mesh vertex positions.
          - faceVertexIndices stores zero-based indices into points in face order.
          - faceVertexCounts stores one vertex count per face in the same order.
      - kind: api
        heading: Parse vertices and define the mesh
        system: >-
          Eight vertices enter. One typed prim leaves. This is the cleanest transaction the
          Customs Terminal has processed in years.
        body: |
          Read foreign text with normal Python I/O, convert numeric values to Gf.Vec3f objects, then
          define a UsdGeom.Mesh and author its schema attributes. CreatePointsAttr accepts a default
          value directly; calling Set on the returned Usd.Attribute is equivalent for a default
          value.
        code: |
          from pathlib import Path
          from pxr import Gf, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("cube.usda")
          world = UsdGeom.Xform.Define(stage, "/World")
          stage.SetDefaultPrim(world.GetPrim())

          points = []
          for line in Path("shapes.obj").read_text().splitlines():
              if line.startswith("v "):
                  _, x, y, z = line.split()[:4]
                  points.append(Gf.Vec3f(float(x), float(y), float(z)))
              if line.startswith("o ") and points:
                  break

          mesh = UsdGeom.Mesh.Define(stage, "/World/Cube")
          mesh.CreatePointsAttr(points[:8])
          stage.GetRootLayer().Save()
      - kind: api
        heading: Author complete polygonal topology
        system: >-
          A pile of points is cargo arranged with suspicious confidence. A mesh requires topology.
        body: |
          Flatten each source face's indices and append its length to faceVertexCounts. OBJ face
          indices are one-based in text and must be converted to zero-based indices if the parser
          has not already done so. Set subdivisionScheme to none because OBJ polygon meshes arrive
          without OpenSubdiv subdivision behavior. Author normals only when the source supplies them
          so smooth and faceted artistic intent is retained.
        code: |
          face_vertex_counts = []
          face_vertex_indices = []
          for face in source_faces:
              zero_based = [index - 1 for index in face]
              face_vertex_indices.extend(zero_based)
              face_vertex_counts.append(len(zero_based))

          mesh.CreateFaceVertexCountsAttr().Set(face_vertex_counts)
          mesh.CreateFaceVertexIndicesAttr().Set(face_vertex_indices)
          mesh.CreateSubdivisionSchemeAttr(UsdGeom.Tokens.none)
          if source_normals:
              mesh.CreateNormalsAttr(source_normals)
      - kind: work_order
        heading: Author the parsed cube vertices as a typed mesh
        system: >-
          Off-by-one topology points faces at the wrong vertices. Convert the source indices
          before authoring them.
        body: |
          shapes.obj is open on the dock and the reading is already done: every vertex record turned
          into a Gf.Vec3f, the pass halted at the first object boundary, the first eight positions
          waiting in cube_points. The stage they are bound for holds a root Xform at /World and
          nothing beneath it.

          Those eight positions exist only as a Python list. No prim in the terminal describes the
          crate's geometry, and this build has no OBJ file format plugin, so Usd.Stage.Open cannot
          read shapes.obj and nothing else will turn that text into scene description. The file also
          holds more than one object behind a single global vertex list, which is why the pass halts
          where it does.

          Define a UsdGeom.Mesh at /World/Cube and set its points to cube_points. That points array
          belongs to this mesh alone, which is the detail OBJ makes easy to miss: the file numbers
          vertices globally across every object it contains, so an index copied from the source
          addresses that global list rather than the eight positions now on this prim, and OBJ
          writes those indices one-based while a mesh indexes its points from zero.
        points:
          - OBJ text indices are one-based; UsdGeom.Mesh indices are zero-based.
          - Global OBJ vertices may require remapping into each mesh's local points array.
          - The sum of faceVertexCounts must equal the number of entries in faceVertexIndices.
          - Authoring subdivisionScheme none tells consumers to treat the source geometry as polygonal.
          - Author normals only from source data so the difference between supplied and absent normals survives.
      - kind: recap
        heading: What you now know
        body: |
          Mesh extraction converts foreign vertex and face records into per-mesh points, flattened
          face indices, ordered face counts, and optional normals. Explicit polygonal subdivision
          behavior and faithful index remapping preserve the source geometry in OpenUSD.
    apply:
      f8_extract_mesh: >-
        The starter has already parsed the first OBJ vertices. Define /World/Cube and set its points
        to cube_points; do not ask usd-core to open a crate it cannot read.

  - source: docs/data-exchange/data-extraction/exercise-extracting-materials.md
    title: Extracting Materials
    objective: Map source material records onto UsdShade material graphs, translate their properties onto a preview surface, and bind the result to the extracted geometry.
    intro: >-
      The paint on the crate arrived as a block of text with a period in its name and a shininess
      number no renderer will accept. Extraction is not finished when the vertices land. The dock
      wants the surfaces too, in a graph a consumer can actually read.
    beats:
      - kind: concept
        heading: A material is a graph with a lofted output
        system: >-
          One prim holds the graph, another does the shading, and a connection explains which is
          which. Customs finds this arrangement soothing.
        body: |
          A UsdShade.Material is a container for a network of shading prims. The shading itself
          happens in UsdShade.Shader prims inside that container, each naming the shader
          implementation it stands for. UsdPreviewSurface is the portable choice, since consumers
          are expected to understand it.

          The material publishes its result by connecting its own surface output to the shader's
          surface output. That connection is what makes the container usable as one material rather
          than a folder of unrelated shading prims, and it is why a mesh binds to the material and
          never to the shader.
        points:
          - CreateIdAttr writes the shader's info:id attribute, which names the implementation to run.
          - CreateSurfaceOutput on the material and ConnectToSource on that output loft the graph's result.
          - A material whose output is unconnected binds without complaint and shades nothing.
      - kind: concept
        heading: Source names are not always valid prim names
        system: >-
          Material.001 is a perfectly good name in the application that exported it and an
          impossibility here.
        body: |
          Prim names are identifiers built from letters, digits, and underscores, so a source name
          carrying a period, a space, or a dash cannot be used as written. Tf.MakeValidIdentifier
          replaces the offending characters, which is how a Blender material named Material.001
          becomes the prim Material_001.

          Sanitizing is a mapping decision worth recording. Two source names can sanitize to the
          same identifier, and a consumer searching for the original string will not find it
          anywhere on the prim, so a converter that cares about round trips keeps the source name
          in metadata beside the sanitized one.
        points:
          - Sanitize every foreign name used as a prim name, for materials exactly as for meshes.
          - Distinct source names can collide once sanitized, so uniqueness deserves its own pass.
          - The original name is source data and survives in customData if the mapping preserves it.
      - kind: api
        heading: Define the material and its preview surface
        system: >-
          Two prims and one connection. The terminal has processed worse in triplicate.
        body: |
          Define the material at the sanitized path and the shader as a child of it, then name the
          shader implementation and loft the result. Sdf.Path.AppendChild builds the child path
          without string surgery, and ConnectableAPI is what the material's output connects to.
        code: |
          from pxr import Sdf, Tf, Usd, UsdGeom, UsdShade

          stage = Usd.Stage.CreateNew("shapes.usda")
          UsdGeom.Xform.Define(stage, "/World")
          material_path = Sdf.Path("/World").AppendChild(
              Tf.MakeValidIdentifier("Material.001")
          )

          material = UsdShade.Material.Define(stage, material_path)
          shader = UsdShade.Shader.Define(stage, material_path.AppendChild("Shader"))
          shader.CreateIdAttr("UsdPreviewSurface")
          material.CreateSurfaceOutput().ConnectToSource(
              shader.ConnectableAPI(), UsdShade.Tokens.surface
          )
      - kind: api
        heading: Map the source properties, then bind
        system: >-
          Shininess becomes roughness through arithmetic nobody enjoys explaining twice.
        body: |
          CreateInput authors a namespaced input on the shader, so the diffuse color arrives as
          inputs:diffuseColor and the specular color as inputs:specularColor. Colors map straight
          across from the source record, while a specular shininess has to be converted into the
          roughness UsdPreviewSurface expects. MaterialBindingAPI applies the binding schema to the
          mesh, and Bind authors the material:binding relationship that points at the material.
        code: |
          import math

          from pxr import Gf, Sdf, UsdShade

          roughness = 1 - math.sqrt(shininess / 1000.0)

          shader.CreateInput("useSpecularWorkflow", Sdf.ValueTypeNames.Int).Set(1)
          shader.CreateInput("diffuseColor", Sdf.ValueTypeNames.Color3f).Set(
              Gf.Vec3f(diffuse_color)
          )
          shader.CreateInput("specularColor", Sdf.ValueTypeNames.Color3f).Set(
              Gf.Vec3f(specular_color)
          )
          shader.CreateInput("roughness", Sdf.ValueTypeNames.Float).Set(roughness)

          binding_api = UsdShade.MaterialBindingAPI.Apply(usd_mesh.GetPrim())
          binding_api.Bind(material)
      - kind: work_order
        heading: Give the extracted cube the surface its source describes
        system: >-
          An unbound mesh renders in whatever gray the viewer keeps for emergencies.
        body: |
          The extraction so far is on the stage: a root Xform at /World, the cube beneath it, and
          the one material record read off the MTL beside shapes.obj, whose source name is
          Material.001 and whose specular color is (0.5, 0.5, 0.5). The sanitized path for that
          material has already been built.

          Nothing on the stage describes what the crate is made of. The cube carries positions and
          no binding, the material named in the source has no prim at all, and the name as written
          cannot become one while it still contains a period. A consumer opening this stage has
          geometry and no surface to put on it.

          Define the material at that path, define its Shader child with UsdPreviewSurface as the
          implementation, connect the material's surface output to the shader's, author the
          specular color input, and bind the material to the cube. The order matters less than the
          connection, since a material bound without a lofted output leaves the mesh attached to a
          graph that produces nothing.
        points:
          - Tf.MakeValidIdentifier turns a source name such as Material.001 into a usable prim name.
          - The shader's id attribute names the implementation, and without it there is no shading to run.
          - Bind attaches the material prim, which is why the material owns the graph's surface output.
          - Colors carry over directly, while shininess converts into roughness before it is authored.
      - kind: recap
        heading: What you now know
        body: |
          Material extraction sanitizes each source material name, defines a UsdShade.Material to
          hold the graph, defines a UsdPreviewSurface shader inside it, connects the shader's
          surface output to the material's, maps the source properties onto shader inputs, and
          binds the material to the mesh it belongs to.
    apply:
      f8_material_bench: >-
        Sanitize the source name into a prim, build the material and its preview surface, author the
        specular color, and bind the result to the cube. The crate is not extracted until its paint is.

  - source: docs/data-exchange/data-extraction/what-is-data-extraction.md
    title: Complete Extraction
    objective: Evaluate whether extracted geometry is faithful, complete, legible, and suitable as a foundation for later transformations.
    intro: >-
      The Overseer counts authored data, checks the bounds, and files discrepancies in triplicate.
      Intentions are filed elsewhere. A mesh must carry enough information for consumers to
      understand what was extracted; a promising thumbnail earns nothing at this window.
    beats:
      - kind: concept
        heading: Extraction is the fidelity baseline
        system: >-
          Before customs rearranges the cargo, someone must record how it arrived. Apparently that
          someone is you, because the cameras are already rolling.
        body: |
          The extraction phase maps source data into OpenUSD as directly as possible. Output that
          resembles the source is more legible, easier to debug, easier to round-trip, and provides
          a common foundation for every later transformation.

          Extracted USD is often transient and may remain in memory while only transformed output
          is saved. Exposing or optionally persisting that raw stage lets third parties add their
          own transformations without reverse engineering earlier decisions.
        points:
          - Faithful extraction separates source facts from destination-specific choices.
          - Transient extracted data may be discarded, cached, or exposed for extension and debugging.
          - Transformation should consume this baseline rather than reparsing the source independently.
      - kind: concept
        heading: Complete geometry has positions, bounds, and topology
        system: >-
          Points say where the cargo is. Extent says how much warehouse it occupies. Topology
          explains why eight loose corners were billed as a cube.
        body: |
          A UsdGeom.Mesh needs points to define vertex positions. Faces additionally require
          faceVertexIndices and faceVertexCounts, whose order reconstructs polygon boundaries.
          extent stores the local-space, axis-aligned bounding box as exactly two vectors: minimum
          and maximum.

          Extent can accelerate bounds queries because consumers read two vectors in place of
          scanning every point. It must enclose the authored geometry and must be updated when the
          default or time-sampled points change.
        points:
          - points alone can satisfy a vertex extraction task, while polygon faces additionally require the topology arrays.
          - extent is ordered [minimum, maximum], with one coordinate triple in each entry.
          - faceVertexIndices indexes into points; faceVertexCounts partitions that flattened array by face.
          - Normals, primvars, materials, and subdivision behavior may also be required for source fidelity.
      - kind: concept
        heading: Conceptual mapping documents the contract
        system: >-
          If a source concept has nowhere to go, write that down before someone stores it in a
          filename and calls the case closed.
        body: |
          Conceptual data mapping identifies corresponding data models and exposes schema gaps.
          The mapping document acts as the extraction specification, records unsupported features,
          and gives stakeholders and third-party developers a shared statement of expected output.

          OpenUSD has no native struct value type. Compound source records can be represented with
          namespace-prefixed custom attributes when no schema models them directly. The mapping
          should be revised as the source format, OpenUSD schemas, or implementation changes.
        points:
          - Equivalent semantics deserve review even when the syntactic conversion is easy.
          - Schema gaps should be documented and may motivate new schemas.
          - Namespaced attributes conventionally group related custom properties.
      - kind: api
        heading: Author points and a trustworthy extent
        system: >-
          The Overseer accepts eight corners and two bounds. A ninth corner triggers an audit and,
          for reasons nobody will explain, confetti.
        body: |
          Schema accessors enforce the expected OpenUSD value types. For known points, author
          Gf.Vec3f values and either set the expected extent directly or compute it from the points
          with UsdGeom.PointBased.ComputeExtent.
        code: |
          from pxr import Gf, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("extracted.usda")
          mesh = UsdGeom.Mesh.Define(stage, "/World/Cube")
          points = [
              Gf.Vec3f(1, 1, 1), Gf.Vec3f(1, 1, -1),
              Gf.Vec3f(1, -1, 1), Gf.Vec3f(1, -1, -1),
              Gf.Vec3f(-1, 1, 1), Gf.Vec3f(-1, 1, -1),
              Gf.Vec3f(-1, -1, 1), Gf.Vec3f(-1, -1, -1),
          ]
          mesh.GetPointsAttr().Set(points)
          mesh.GetExtentAttr().Set([
              Gf.Vec3f(-1, -1, -1),
              Gf.Vec3f(1, 1, 1),
          ])
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Bring the published cube up to the extraction contract
        system: >-
          An incorrect extent is worse than no manifest. It sends the renderer searching the wrong
          warehouse while the asset remains exactly where you left it.
        body: |
          The Dock Overseer inspects the city as it currently stands rather than a fresh stage.
          /World/Cube is already in it, published when the cube came off the crate, and it carries
          positions and nothing else: no bounds, no note recording that it passed inspection.

          Those positions are the coordinates parsed straight out of shapes.obj, so they describe
          the crate as it arrived rather than the eight unit corners the extraction contract states.
          With no extent authored, nothing on the prim declares the bounds it occupies, and every
          consumer is left to scan the full point array or assume a volume for it.

          Type the prim as Mesh, set its points to the eight unit corners in the order the contract
          lists, author the matching extent from (-1, -1, -1) to (1, 1, 1), and record the clearance
          note in documentation. Extent is exactly two vectors, minimum then maximum, in the mesh's
          local space before any ancestor transform applies, and it is the easiest part to leave
          stale: a pair carried over from the earlier coordinates describes a volume the geometry no
          longer occupies while every position on the prim is correct.
        points:
          - Extent is measured in local space, before ancestor transforms apply.
          - A stale extent can cause incorrect culling and bounds even when points are correct.
          - Topology arrays must remain consistent with points and with one another.
          - Retain useful transient data until downstream transformations have consumed it.
      - kind: recap
        heading: What you now know
        body: |
          Extraction is a faithful, inspectable baseline for transformation. Complete mesh data
          includes the positions, bounds, and topology required by its contract, while conceptual
          mapping records assumptions, unsupported concepts, and schema gaps.
    apply:
      f8_mapping_document: >-
        Identify what faithful extraction output should resemble, and name the convention for a
        compound source record OpenUSD has no schema for. The dock files specifications, not
        intentions.

  - source: docs/data-exchange/data-transformation/transformation-hierarchy.md
    title: Hierarchy and Axes
    objective: Restructure extracted prims under a referenceable root and normalize stage and local transform conventions.
    intro: >-
      The Axis Switchyard has received a flat shipment, a Z-up declaration, and absolutely no
      shared ancestor. This is considered three separate emergencies for billing purposes. You will
      give the asset a usable hierarchy and point vertical toward the ceiling we currently insure.
    beats:
      - kind: concept
        heading: Faithful extraction may be awkward to consume
        system: >-
          OBJ offers a flat list. The Composition prefers a family tree. Neither has volunteered to
          compromise.
        body: |
          A direct OBJ extraction can produce several root prims because OBJ has no OpenUSD-style
          scenegraph root. Until a common ancestor exists, no single prim represents the complete
          asset, and until defaultPrim is authored, every reference must name its target prim
          explicitly.

          A mandatory transformation can define a root Xform, reparent extracted prims beneath it,
          and set it as the default prim. The result remains recognizable and becomes easy to
          reference as one asset.
        points:
          - The stage pseudo-root lives outside the authored scene description, so defaultPrim must name a real root prim.
          - A default prim must be a root prim.
          - Reparenting changes prim paths, so path-based relationships and pipeline records require care.
      - kind: api
        heading: Reparent root prims with NamespaceEditor
        system: >-
          Move the cargo under /World, then stamp /World as the entrance. Even customs can
          understand one front door on a favorable day.
        body: |
          Capture the existing pseudo-root children before defining /World so the move list holds
          only the prims that arrived from extraction. Usd.NamespaceEditor queues namespace edits; ApplyEdits applies
          the pending edit. SetDefaultPrim takes the root Usd.Prim, not its path.
        code: |
          from pxr import Usd, UsdGeom

          stage = Usd.Stage.Open("extracted.usda")
          root_prims = list(stage.GetPseudoRoot().GetChildren())
          world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
          stage.SetDefaultPrim(world)

          editor = Usd.NamespaceEditor(stage)
          for prim in root_prims:
              editor.ReparentPrim(prim, world)
              if not editor.ApplyEdits():
                  raise RuntimeError(f"Could not reparent {prim.GetPath()}")

          stage.GetRootLayer().Save()
      - kind: concept
        heading: Up axis is a stage-wide convention
        system: >-
          Vertical is settled law in this room. Legal handled that after Floor Four rotated
          ninety degrees and claimed artistic intent.
        body: |
          upAxis metadata declares which stage axis consumers should treat as vertical. OpenUSD
          permits Y or Z. Changing the token declares a convention, while existing points and
          transforms keep their authored values.

          A real Z-up to Y-up conversion must transform authored spatial data or introduce an
          appropriate conversion transform, then declare Y-up. If the geometry is already expressed
          in the destination coordinates, updating metadata is sufficient.
        points:
          - UsdGeom.GetStageUpAxis reads the resolved convention.
          - UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y) authors Y-up metadata.
          - Convert the spatial data whenever the declared up axis changes.
      - kind: api
        heading: Xform ops place the converted asset
        system: >-
          The kiosk has cleared orientation and now requires parking. Naturally the parking form is
          an ordered attribute.
        body: |
          UsdGeom.Xformable stores local transformations as ordered xform ops. AddTranslateOp creates
          xformOp:translate and adds it to xformOpOrder; Set authors the vector value. Ops evaluate
          in their declared order, so adding the same kind of op repeatedly creates a stack rather
          than replacing the existing operation.
        code: |
          from pxr import Gf, Usd, UsdGeom

          stage = Usd.Stage.Open("kiosk.usda")
          UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
          kiosk = UsdGeom.Xform.Define(
              stage, "/City/ExchangeTerminal/ImportedKiosk"
          )
          kiosk.AddTranslateOp().Set(Gf.Vec3d(10, 0, -4))
          stage.GetRootLayer().Save()
      - kind: work_order
        heading: Convert the shipment to Y-up and park the kiosk
        system: >-
          A changed label leaves the shipment exactly where it stood, though the accident now
          conforms to paperwork.
        body: |
          The Axis Switchyard has the shipment on a stage that declares Z as the up axis, with one
          Xform at /City/ExchangeTerminal/ImportedKiosk and untyped ancestors above it where Define
          created the intervening prims. The kiosk carries no local transformation at all.

          The line the switchyard feeds runs Y-up, and this shipment arrived flat and Z-up exactly
          as it came off the dock. Sitting at the origin with no transform, the kiosk overlaps
          whatever the exchange terminal already occupies instead of standing in the space kept for
          it at (10, 0, -4).

          Declare Y with SetStageUpAxis and add one translate op placing the kiosk at (10, 0, -4).
          upAxis is a declaration: writing the Y token states which axis consumers should treat as
          vertical while every authored point, extent, and translation keeps the number it already
          had, so a genuinely Z-up shipment relabeled this way is described differently rather than
          moved. A real conversion rewrites the spatial data or introduces a conversion transform
          first. Local transformations are an ordered list, so AddTranslateOp appends to
          xformOpOrder instead of replacing an existing op.
        points:
          - Capture root children before defining the destination root or you may try to parent /World beneath itself.
          - Check ApplyEdits because namespace edits can fail when composition prevents a safe move.
          - upAxis metadata declares the convention, while transformed data or a conversion transform performs the rotation.
          - Calling AddTranslateOp twice creates two translate ops unless distinct suffixes and intended ordering are managed.
      - kind: recap
        heading: What you now know
        body: |
          Transformation can turn faithful but flat extraction into a referenceable asset by
          reparenting prims beneath a default root. Stage up axis declares a convention, while xform
          ops or rewritten data perform the actual spatial conversion and placement.
    apply:
      f8_axis_switchyard: >-
        Declare Y-up and add one translate op placing ImportedKiosk at (10, 0, -4). The switchyard
        accepts converted coordinates, not motivational speeches about vertical.

  - source: docs/data-exchange/data-transformation/exercise-export-option.md
    title: Export Options
    objective: Add an optional transformation step that honors a caller's up-axis request and applies the corrective rotation the new convention requires.
    intro: >-
      A client on the Z-up line has filed a request, which the junction treats as an event. An
      export option is a transformation the caller turns on, and this one cannot be satisfied by
      relabeling the shipment and waving it through.
    beats:
      - kind: concept
        heading: Mandatory steps run always, optional steps run on request
        system: >-
          Some transformations are house policy. Others are requests, and requests come with a
          flag, a default, and a note explaining what they did.
        body: |
          A transformation pipeline holds steps of two kinds. A mandatory step runs on every
          conversion because the output is unusable without it, which is why reparenting extracted
          prims under a default root belongs there. An optional step runs only when a caller asks
          for it, because most deliveries do not need it and some would be harmed by it.

          Each optional step is one function with one job, reached from the transformation phase
          and driven by a parsed argument. Keeping them separate lets a pipeline select, reorder,
          or skip steps without editing the extraction that feeds them.
        points:
          - A mandatory step exists because the destination cannot consume the output without it.
          - An optional step defaults to off, or to the value the predominant workflow expects.
          - One step per function keeps the pipeline reorderable and each behavior testable.
      - kind: concept
        heading: A declaration alone leaves the geometry where it was
        system: >-
          Relabeling vertical is not the same as making it vertical. Legal has asked me to repeat
          that at every opportunity.
        body: |
          OBJ is Y-up, so a converter that declares Y is stating a fact about the source. A caller
          who asks for Z is asking for a different coordinate convention, and SetStageUpAxis only
          writes the token. Every authored point, extent, and transform keeps the number it had, so
          the token change on its own describes the same geometry differently and stands it on its
          side.

          The conversion is completed by a corrective transformation on the asset's root, a
          rotation of 90 degrees about X that puts the content back upright under the new
          convention. Naming that operation with a suffix records why it exists, which is how a
          later reader tells a conversion corrective apart from an artistic placement.
        points:
          - upAxis is a stage-wide declaration and moves nothing on its own.
          - AddRotateXOp accepts an opSuffix, producing a named op such as xformOp:rotateX:unitsResolve.
          - A corrective belongs on the default prim, where it applies to the whole delivered asset.
          - Leaving the requested axis at the source default means the optional step does nothing at all.
      - kind: api
        heading: Implement the option as one branch
        system: >-
          Two outcomes, one function, no surprises for whoever reads it next quarter.
        body: |
          The option handler takes the stage and the requested axis. The source-default branch only
          declares the convention, since the data already matches it. The other branch declares the
          new convention and adds the corrective op to the default prim, which UsdGeom.Xformable
          wraps for authoring.
        code: |
          from pxr import Usd, UsdGeom


          def set_up_axis(stage: Usd.Stage, up_axis: str) -> None:
              """Declare the requested up axis, correcting the data when it changes."""
              if up_axis == UsdGeom.Tokens.y:
                  UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
              else:
                  UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.z)
                  xformable = UsdGeom.Xformable(stage.GetDefaultPrim())
                  xformable.AddRotateXOp(opSuffix="unitsResolve").Set(90.0)
      - kind: work_order
        heading: Deliver the Z-up option with its corrective
        system: >-
          A flag that flips one token and moves nothing is an option in name only.
        body: |
          The shipment is on a stage that declares Y as the up axis, with a root Xform at /Shipment
          named as the default prim and the converted cube beneath it. That declaration is the OBJ
          default, and it matches the coordinates the geometry was authored with.

          This delivery was ordered with the up-axis option set to Z. Nothing on the stage reflects
          that yet, and simply writing the Z token would leave every authored coordinate untouched,
          so the cube that reads as upright under Y would arrive lying on its side under Z. The
          root prim carries no local transformation to compensate with either.

          Declare Z as the stage up axis and add a rotate-X op of 90.0 on the default prim, suffixed
          unitsResolve so the reason for it survives. The suffix is a convention rather than
          decoration, since an unnamed rotation on an asset root is indistinguishable from a
          placement someone intended, and local transformations are an ordered list, so the
          corrective appends rather than replacing anything already there.
        points:
          - Declare the requested convention and transform the data, or the delivery is only half converted.
          - AddRotateXOp with an opSuffix authors xformOp:rotateX:unitsResolve and appends it to xformOpOrder.
          - The corrective goes on the default prim so it covers everything the asset delivers.
          - An option that changes nothing when it is selected is worse than no option at all.
      - kind: recap
        heading: What you now know
        body: |
          Export options are optional transformation steps a caller selects, each implemented as
          its own function and applied from the transformation phase. Honoring an up-axis request
          means declaring the new convention and applying a corrective rotation to the asset root,
          named with a suffix that records why the operation is there.
    apply:
      f8_export_option: >-
        Declare Z as the up axis and add the unitsResolve rotate-X corrective on the default prim.
        The junction accepts a converted shipment, not a relabeled one.

  - source: docs/data-exchange/data-transformation/what-is-data-transformation.md
    title: Units and Transformation
    objective: Design reusable transformation steps that normalize linear units and adapt extracted USD for downstream workflows.
    intro: >-
      The Meter Gauge has found a unitless crate wearing an inches label and is preparing to make
      it everyone's problem. Transformation is where source-faithful data becomes destination-useful
      data. Declare the units, preserve the convention, and try not to build a hundred-meter lamp.
    beats:
      - kind: concept
        heading: Transformation serves the destination
        system: >-
          Extraction records the crate. Transformation decides whether the client wanted the crate,
          its contents, or a single-file monument to procurement.
        body: |
          Transformation applies export options, restructures content, prunes irrelevant data, and
          performs optimizations such as mesh merging. Unlike source-specific extraction code,
          transformations operate on OpenUSD data and can be reused across applications and
          exporters.

          DCC exporters should provide sensible defaults for predominant workflows while exposing a
          pipeline in which developers can select, reorder, or add transformation steps.
        points:
          - Transformation may be in-process, a separate process, a cloud service, or a post-process.
          - The usual default is a convenient single-file export, though organizations may require established asset structures.
          - Sparse overrides can express one transformed workstream's contributions without duplicating a complete asset.
      - kind: concept
        heading: metersPerUnit declares linear scale
        system: >-
          One scene unit can be a meter, centimeter, or regrettable surprise. The metadata exists
          so downstream tools can read the scale directly and leave the furniture out of it.
        body: |
          metersPerUnit is stage metadata that states how many meters one scene unit represents.
          A value of 1.0 means meters, 0.01 means centimeters, and 0.0254 means inches. It is a
          declaration used by consumers to compare and convert stages.

          The declaration stands on its own: points, extents, translations, and other distances keep
          their authored numbers. If source values are inches and destination values must be centimeters,
          multiply authored linear values by 2.54 and then declare 0.01, or preserve the numeric
          values and truthfully declare 0.0254.
        points:
          - UsdGeom.GetStageMetersPerUnit reads the stage's resolved linear-unit declaration.
          - UsdGeom.StageHasAuthoredMetersPerUnit distinguishes an authored opinion from fallback behavior.
          - Up axis and linear units are independent conventions and should both remain correct.
      - kind: api
        heading: Author the destination unit contract
        system: >-
          Centimeters are 0.01 meters. The Gauge knows this, the audience knows this, and now the
          form can stop blinking red.
        body: |
          UsdGeom provides free functions for geometric stage metadata. The LinearUnits constants
          are readable numeric values, and an explicit float is also accepted.
        code: |
          from pxr import Usd, UsdGeom

          stage = Usd.Stage.CreateNew("centimeter_asset.usda")
          UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
          UsdGeom.SetStageMetersPerUnit(
              stage, UsdGeom.LinearUnits.centimeters
          )

          assert UsdGeom.GetStageUpAxis(stage) == UsdGeom.Tokens.y
          assert UsdGeom.GetStageMetersPerUnit(stage) == 0.01
          stage.GetRootLayer().Save()
      - kind: concept
        heading: Minimize transformation for round trips
        system: >-
          Every clever rewrite is another confession future-you must reverse. Future-you has
          retained separate counsel.
        body: |
          Extensive restructuring, pruning, and optimization can be difficult or impossible to
          invert during reimport. Round-trip workflows should minimize transformations, preserve
          provenance and unmapped data where practical, and document any operation that loses
          information.

          Export options belong in transformation because they reflect user and destination choices,
          while extraction records the facts of the source.
        points:
          - Pruning can improve client relevance but permanently removes data unless it is preserved elsewhere.
          - Added data and client-specific overrides can be separate transformation steps.
          - Stable, reusable steps make behavior consistent across source-format exporters.
      - kind: work_order
        heading: Declare centimeters and leave the coordinates alone
        system: >-
          Declaring centimeters over inch-valued coordinates leaves the error intact and
          professionally documented.
        body: |
          The Meter Gauge works on the city the terminal has been assembling. It declares Y as the
          up axis and holds coordinates from every room that has published into it, the kiosk
          translation at (10, 0, -4) among them. There is no marker prim at
          /City/ExchangeTerminal/UnitMarker yet.

          The crate came in labelled inches, and OBJ itself carries no linear unit, so nothing on
          the city states what one scene unit is worth. Every published coordinate is a bare number,
          and a consumer reading the terminal has to infer the scale from context or fall back on an
          assumption this city never made explicit.

          Define the marker Xform, declare metersPerUnit as 0.01 for centimeters, record the
          clearance note, and change nothing else. metersPerUnit states how many meters one scene
          unit represents and converts nothing, so inch-valued numbers under a 0.01 declaration are
          described as centimeters rather than turned into them. Scale values exactly once, then
          declare the unit that honestly describes what ended up in the file. Up axis and linear
          units are independent conventions, and a units pass is where the axis tends to get
          overwritten on the way past.
        points:
          - SetStageMetersPerUnit writes metadata, while numeric scaling is a separate edit to the authored values.
          - Leave upAxis as authored while normalizing units unless an axis conversion is also required.
          - Apply a scale exactly once; scaling values and also compensating with misleading metadata double-converts the asset.
          - Unauthored units force consumers to rely on fallback assumptions that may differ across workflows.
      - kind: recap
        heading: What you now know
        body: |
          Transformation adapts extracted USD through reusable options, restructuring, pruning, and
          optimization. metersPerUnit declares the scale of scene coordinates while those
          coordinates keep their authored values, so numeric conversion and metadata must describe
          the same physical asset.
    apply:
      f8_transform_options: >-
        Place export options in the phase that owns destination choices, and say why a round trip
        wants as few transformations as possible. The junction reroutes cargo; it does not
        re-survey it.

  - source: docs/data-exchange/asset-validation/what-is-asset-validation.md
    title: Asset Validation
    objective: Encode and check asset contracts that make OpenUSD content structurally compliant and interoperable.
    intro: >-
      The Validation Warden checks contracts, reports failures, and keeps the crate on the dock
      until every required opinion exists. How the asset feels is filed under entertainment. I find
      the whole procedure deeply soothing and the contestants generally do not.
    beats:
      - kind: concept
        heading: Validation checks interoperability contracts
        system: >-
          A stage can open successfully and still be unsuitable for exchange. So can a contestant,
          according to casting.
        body: |
          Asset validation complements unit and integration tests by inspecting the USD output
          itself. A validator checks defined rules so an asset is more likely to be interchangeable,
          structurally sound, and renderable by Hydra.

          usdchecker is part of the OpenUSD toolset and validates stages and USDZ packages. Omniverse
          Asset Validator builds on usdchecker with a GUI, CLI, Python API, automatic fixes, and
          extensible rules.
        points:
          - Application tests prove code paths; asset rules prove properties of the authored result.
          - Validation should run on representative converted assets alongside hand-built fixtures.
          - Pipeline compliance is established by rule checks, with a successful parse or stage open as the starting point.
      - kind: concept
        heading: Rules turn assumptions into failures
        system: >-
          The Warden prefers explicit rules because "everyone knows" has never survived discovery.
        body: |
          A pipeline contract defines the stage and prim properties downstream consumers require.
          Common usdchecker-style rules inspect default prim, up axis, linear units, model kind,
          required prims, topology consistency, unresolved dependencies, and packaging constraints.

          Rules should be precise, independently reportable, and tied to a reason. Pipeline-specific
          rules can be stricter than general OpenUSD validity when a destination workflow requires
          particular structure or metadata.
        points:
          - defaultPrim identifies the asset interface used by references that omit a prim path.
          - upAxis and metersPerUnit communicate geometric conventions.
          - kind component identifies a self-contained model in a valid model hierarchy.
          - Required prim and metadata checks protect workflow guarantees beyond syntax.
      - kind: api
        heading: Author and inspect a minimal contract
        system: >-
          One root, Y-up, component kind. Three stamps between the crate and freedom. Four if the
          Warden dislikes your handwriting.
        body: |
          Stage metadata is authored through Usd.Stage and UsdGeom APIs. Model kind is authored
          through Usd.ModelAPI with a Kind token. Validators should reopen the saved output and
          query composed values, matching what downstream consumers actually see.
        code: |
          from pxr import Kind, Usd, UsdGeom

          stage = Usd.Stage.CreateNew("validated_asset.usda")
          world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
          stage.SetDefaultPrim(world)
          UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
          Usd.ModelAPI(world).SetKind(Kind.Tokens.component)
          stage.GetRootLayer().Save()

          checked = Usd.Stage.Open("validated_asset.usda")
          assert checked.GetDefaultPrim().GetPath().pathString == "/World"
          assert UsdGeom.GetStageUpAxis(checked) == UsdGeom.Tokens.y
          assert Usd.ModelAPI(checked.GetDefaultPrim()).GetKind() == Kind.Tokens.component
      - kind: concept
        heading: Validation belongs throughout intake
        system: >-
          Validate early enough to blame the correct step. Engineering calls this hygiene; the
          broadcast calls it how penalties get assigned.
        body: |
          Run checks after extraction to catch incorrect source mapping and after transformation to
          catch broken destination contracts. Failures should identify the responsible rule and the
          offending path so the implementation can be corrected rather than patched manually.

          Continuous validation prevents regressions as schemas, mappings, and export options
          evolve. Test assets should cover supported features, edge cases, and known malformed input.
        points:
          - Reopen file-backed output before final validation to catch missing saves and serialization differences.
          - Separate general USD compliance rules from organization-specific policy rules.
          - Treat automatic fixes as explicit transformation steps when they alter delivered content.
      - kind: work_order
        heading: Author the three contract terms the concourse requires
        system: >-
          Checking only that the file exists is attendance, and attendance has never cleared a
          crate.
        body: |
          The crate on the Validation Concourse holds a stage with a single Xform at /World and no
          stage metadata on it. It opens without complaint and parses cleanly, and it states nothing
          at all about how the asset it contains is meant to be used.

          None of the three terms the concourse contract requires are present. With no default prim,
          a reference that names no prim path has nothing to resolve to. With no up axis declared, a
          consumer has no way to know which direction is vertical. With no kind on /World, no tool
          can treat the result as a self-contained model.

          Name /World as the default prim, declare Y as the up axis, and set the component kind on
          /World. Each term is legal to omit, which is why an asset can be valid USD and still
          unusable to the pipeline receiving it, and why these assumptions are worth encoding as
          usdchecker-style rules. A default prim also has to be a root prim, so a nested prim cannot
          serve as the asset interface however central it looks in the scenegraph.
        points:
          - Validate the saved file itself whenever that file is the delivered product.
          - SetDefaultPrim expects a root Usd.Prim, not a path string.
          - Kind is a model-hierarchy contract with defined tokens and structural rules.
          - A validator should report all actionable failures when possible rather than stopping at the first.
      - kind: recap
        heading: What you now know
        body: |
          Asset validation encodes interoperability and pipeline assumptions as executable rules.
          usdchecker-style checks supplement code tests by inspecting the delivered stage's composed
          structure, metadata, model hierarchy, dependencies, and geometry contracts.
    apply:
      f8_validate_warden: >-
        Make /World the default prim, declare Y-up, and set its kind to component. The Warden has
        three boxes, no discretion, and excellent penmanship.

  - source: docs/data-exchange/asset-validation/exercise-asset-validation-testing.md
    title: End-to-End Intake
    objective: Test an OBJ-to-OpenUSD pipeline from explicit extraction through provenance stamping and final contract validation.
    intro: >-
      The Customs Engine is the city boss because seven separate clerks became one machine and
      discovered confidence. It expects a parsed OBJ cube, a compliant asset interface, honest
      geometric conventions, and provenance that survives delivery. One missing stamp and the
      terminal closes with you on the import side.
    beats:
      - kind: concept
        heading: Test the delivered stage end to end
        system: >-
          Unit tests inspect gears. This room starts the Engine, feeds it a crate, and watches which
          wall fails first.
        body: |
          An end-to-end intake test begins with representative foreign input, executes extraction
          and transformation, saves the resulting USD, reopens it, and validates the complete
          contract. This catches interactions that isolated parser or authoring tests cannot.

          In this environment extraction begins by manually parsing OBJ text. There is no OBJ file
          format plugin, so intake succeeds only when the implementation reads that text itself.
        points:
          - Use fixed input fixtures so vertex ordering and expected values are deterministic.
          - Validate the persisted output alongside the transient Python objects.
          - Cover source mapping, authored schemas, destination conventions, and provenance in one test.
      - kind: concept
        heading: Separate extraction facts from transformation policy
        system: >-
          The Engine has two chambers. The first records what arrived. The second makes it comply.
          Mixing them voids the maintenance agreement.
        body: |
          Extraction authors the source geometry and direct source conventions. Transformation
          creates the asset interface and applies destination policy such as default prim,
          centimeters, hierarchy, and model kind.

          Provenance connects the delivered stage to its source and processing assumptions. It
          belongs on the stable asset interface so references and downstream tools can find it
          without knowing internal mesh paths.
        points:
          - Direct geometry mapping includes points and, when required, topology, normals, materials, and extent.
          - Destination policy includes default prim, structure, up axis, units, and workflow-specific kind.
          - customData can carry pipeline-specific provenance without inventing a schema attribute.
      - kind: api
        heading: Build the intake result
        system: >-
          Eight points, five contract opinions, one saved file. The Engine considers this a light
          breakfast.
        body: |
          Parse the first eight OBJ vertex records into Gf.Vec3f values, create a root asset
          interface and child mesh, then author the complete destination contract. SetCustomDataByKey
          preserves any unrelated customData already present on the root.
        code: |
          from pathlib import Path
          from pxr import Gf, Kind, Usd, UsdGeom

          points = []
          for line in Path("shapes.obj").read_text().splitlines():
              if line.startswith("v "):
                  _, x, y, z = line.split()[:4]
                  points.append(Gf.Vec3f(float(x), float(y), float(z)))
              if len(points) == 8:
                  break

          stage = Usd.Stage.CreateNew("intake.usda")
          world = UsdGeom.Xform.Define(stage, "/World").GetPrim()
          stage.SetDefaultPrim(world)
          UsdGeom.SetStageUpAxis(stage, UsdGeom.Tokens.y)
          UsdGeom.SetStageMetersPerUnit(stage, 0.01)
          Usd.ModelAPI(world).SetKind(Kind.Tokens.component)
          world.SetCustomDataByKey("sourceFormat", "OBJ")

          mesh = UsdGeom.Mesh.Define(stage, "/World/Cube")
          mesh.GetPointsAttr().Set(points)
          stage.GetRootLayer().Save()
      - kind: api
        heading: Reopen and assert the contract
        system: >-
          Trust remains the terminal's current approach to elevators and has no place in a
          validation strategy.
        body: |
          Reopening the stage proves that every required opinion was serialized. Query schema APIs
          and composed prims exactly as a consumer would, and include diagnostic messages that
          identify failed paths and values.
        code: |
          checked = Usd.Stage.Open("intake.usda")
          root = checked.GetDefaultPrim()
          cube = UsdGeom.Mesh(checked.GetPrimAtPath("/World/Cube"))

          assert root.GetPath().pathString == "/World"
          assert UsdGeom.GetStageUpAxis(checked) == UsdGeom.Tokens.y
          assert UsdGeom.GetStageMetersPerUnit(checked) == 0.01
          assert Usd.ModelAPI(root).GetKind() == Kind.Tokens.component
          assert root.GetCustomDataByKey("sourceFormat") == "OBJ"
          assert cube and len(cube.GetPointsAttr().Get()) == 8
      - kind: work_order
        heading: Deliver the whole intake manifest on one stage
        system: >-
          The delivery contract is one complete manifest. Each required opinion belongs on the
          same saved stage.
        body: |
          The Customs Engine takes delivery of the whole city as one asset: /World and everything
          published beneath it, including the cube that came off the crate and the kiosk stamped
          back on the intake platform.

          The intake manifest is spread across the terminal in pieces, and no single stage carries
          all of it. The cube's points are still the coordinates parsed out of shapes.obj rather
          than the eight unit corners, and the source stamp sits on the intake kiosk rather than on
          /World, which is the prim a reference resolves to when it names no prim path.

          Author the complete manifest here: /World/Cube typed as Mesh with the eight unit-cube
          corners in order, /World as the default prim carrying the component kind and a customData
          entry whose sourceFormat reads OBJ, Y as the up axis, metersPerUnit 0.01, and the
          clearance note on the cube. Then save, because the file leaving the terminal is the asset.
          Provenance belongs on /World, setting one customData key preserves sibling entries where
          writing the dictionary replaces them, declaring metersPerUnit leaves the corner values as
          listed, and the root prim has to exist before it can be named the default prim.
        points:
          - Stamp provenance on the root prim, which is the stable asset interface downstream tools find first.
          - Remember that the parsed OBJ coordinates keep their values when metersPerUnit is declared.
          - Define a valid root prim first, then set it as the default prim.
          - Call stage.GetRootLayer().Save() before validating so the checks inspect the delivered file.
          - Check the contract terms of default prim, up axis, units, kind, and required prims, alongside coarse signals such as polygon count or file size.
      - kind: recap
        heading: What you now know
        body: |
          End-to-end intake testing proves that foreign data was explicitly parsed, faithfully
          authored, deliberately transformed, stamped with durable provenance, saved, reopened, and
          accepted by the destination contract. Each assertion protects one specific
          interoperability promise.
    apply:
      f8_conversion_report: >-
        Declare Y as the up axis and 0.01 as metersPerUnit on the converted stage, so the two
        geometric conventions the concourse reported missing are authored where the conversion
        happens rather than patched into the delivered file.
